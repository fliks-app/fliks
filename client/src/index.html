<!doctype html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="utf-8">
  <title>Fliks</title>
  <base href="/">
  <!-- no-cache index.html: it keeps the same path, so a cached copy strands the Tizen WebView on old chunk names after a partial `tizen install`. -->
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#1d232a">
  <!-- Pre-paint navy bg avoids the white flash before styles.css; :where() keeps zero specificity so daisyUI overrides it. -->
  <style>
    html, body { margin: 0; }
    :where(html) { background-color: #1d232a; }
  </style>
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <!-- Request art falls back to the TMDB CDN for rows without stored local
       images — pre-open the connection so that first fetch skips DNS+TLS. -->
  <link rel="preconnect" href="https://image.tmdb.org" crossorigin>
  <script src="https://www.gstatic.com/cv/js/sender/v1/cast_sender.js?loadCastFramework=1" async></script>
</head>
<body>
  <!-- Tizen AVPlay surface: the runtime binds `webapis.avplay` to the first `<object type="application/avplayer">` at parse time, and it must be 100%×100% then.
       The hardware layer sits BEHIND the WebView, so `html.native-player-active` makes the WebView transparent; inert off Tizen. -->
  <object id="fliks-avplay" type="application/avplayer"
          style="position: fixed; left: 0; top: 0; width: 100%; height: 100%; background: transparent; display: none; z-index: -1"></object>
  <app-root></app-root>
</body>
</html>
