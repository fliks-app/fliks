<!doctype html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="utf-8">
  <title>Fliks</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#1d232a">
  <!-- Pre-paint navy bg — kills the WebView default-white flash before
       styles.css parses. :where() has zero specificity so daisyUI overrides
       cleanly once it loads. App is dark-only. -->
  <style>
    html, body { margin: 0; }
    :where(html) { background-color: #1d232a; }
  </style>
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <script src="https://www.gstatic.com/cv/js/sender/v1/cast_sender.js?loadCastFramework=1" async></script>
  <!-- Samsung Tizen WebAPIs bootstrap. Resolves to the on-device runtime
       `webapis/webapis.js` via the magic `$WEBAPIS` prefix the WebView
       expands at load time. Required to populate `window.webapis.*` —
       without it, `webapis.avplay.prepareAsync` is a stub that throws
       `InvalidAccessError / PLAYER_ERROR_CONNECTION_FAILED` on every
       call. 404s on non-Tizen targets (browser ignores the missing
       script and the rest of the app boots normally). -->
  <script src="$WEBAPIS/webapis/webapis.js"></script>
</head>
<body>
  <!-- Tizen AVPlay surface. Samsung's media runtime instantiates the
       native player plugin at HTML parse time and binds `webapis.avplay`
       to the first `<object type="application/avplayer">` it sees;
       creating it later via JS leaves AVPlay without a surface and
       `prepareAsync` rejects every URL with `InvalidAccessError`.
       The element MUST be 100%×100% from parse time — Samsung's plugin
       seems to record the geometry at init and refuses to play if the
       surface was 0×0 when registered (same `InvalidAccessError`).
       The hardware layer is composited BEHIND the WebView regardless of
       z-index, so by default the opaque WebView fully hides the AVPlay
       output. When playback starts, `html.native-player-active` makes
       the WebView transparent so the video shows through.
       Inert on non-Tizen — the plugin type is unknown and the browser
       renders nothing. -->
  <object id="fliks-avplay" type="application/avplayer"
          style="position: fixed; left: 0; top: 0; width: 100%; height: 100%; background: transparent; display: none; z-index: -1"></object>
  <app-root></app-root>
</body>
</html>
