<div
  class="fixed inset-0 flex flex-col"
  [style.background-color]="colors().background"
  [style.color]="colors().text"
>
  <header
    class="z-30 flex shrink-0 items-center gap-1 bg-base-100/90 px-2 text-base-content backdrop-blur"
    style="padding-top: env(safe-area-inset-top); padding-left: max(0.5rem, env(safe-area-inset-left)); padding-right: max(0.5rem, env(safe-area-inset-right))"
  >
    <button type="button" class="btn btn-ghost btn-circle" [attr.aria-label]="'reader.back' | translate" (click)="closed.emit()">
      <svg lucideArrowLeft class="h-5 w-5"></svg>
    </button>
    <h1 class="min-w-0 flex-1 truncate px-2 text-sm font-medium">{{ title() }}</h1>
    <div class="join">
      @for (theme of themes; track theme) {
        <button
          type="button"
          class="btn btn-sm join-item size-11"
          [class.btn-active]="settings().theme === theme"
          [attr.aria-pressed]="settings().theme === theme"
          [attr.aria-label]="'reader.theme_' + theme | translate"
          (click)="setTheme(theme)"
        >
          <span class="inline-block h-4 w-4 rounded-full border border-base-content/30" [style.background-color]="swatch(theme)"></span>
        </button>
      }
    </div>
    <button
      type="button"
      class="btn btn-ghost btn-circle"
      [attr.aria-label]="'reader.zoom_out' | translate"
      [disabled]="settings().zoom <= zoomRange.min"
      (click)="zoom(-zoomRange.step)"
    >
      <svg lucideZoomOut class="h-5 w-5"></svg>
    </button>
    <button
      type="button"
      class="btn btn-ghost btn-circle"
      [attr.aria-label]="'reader.zoom_in' | translate"
      [disabled]="settings().zoom >= zoomRange.max"
      (click)="zoom(zoomRange.step)"
    >
      <svg lucideZoomIn class="h-5 w-5"></svg>
    </button>
  </header>

  <div #scroller class="relative min-h-0 flex-1 overflow-auto" data-testid="pdf-scroller" (scroll)="onScroll()">
    @if (loading()) {
      <div class="absolute inset-0 flex items-center justify-center">
        <span class="loading loading-spinner loading-lg"></span>
      </div>
    }
    <div class="flex w-max min-w-full flex-col items-center gap-3 py-3">
      @for (n of pages(); track n) {
        <div
          class="pdf-page bg-white shadow"
          [class.pdf-page-dark]="isDark()"
          [class.pdf-page-sepia]="settings().theme === 'sepia'"
          [attr.data-page]="n"
          [style.width.px]="pageWidth()"
          [style.aspect-ratio]="1 / ratio()"
        ></div>
      }
    </div>
  </div>

  <footer
    class="z-30 flex shrink-0 items-center gap-3 bg-base-100/90 px-4 py-2 text-base-content backdrop-blur"
    style="padding-bottom: max(0.5rem, env(safe-area-inset-bottom)); padding-left: max(1rem, env(safe-area-inset-left)); padding-right: max(1rem, env(safe-area-inset-right))"
  >
    <input
      type="range"
      class="range range-xs flex-1"
      min="1"
      [max]="pages().length || 1"
      step="1"
      [attr.aria-label]="'reader.progress' | translate"
      [value]="shownPage()"
      (input)="onScrub($event)"
      (change)="onSeek($event)"
    />
    <span class="shrink-0 text-right text-xs tabular-nums">{{ shownPage() }} / {{ pages().length }}</span>
  </footer>
</div>
