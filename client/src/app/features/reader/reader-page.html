@if (opened(); as o) {
  <app-reader
    [format]="o.format"
    [target]="o.target"
    [title]="o.title"
    [info]="o.info ?? null"
    [pages]="o.pages ?? []"
    (closed)="back()"
  />
} @else {
  <div class="fixed inset-0 flex items-center justify-center">
    <span class="loading loading-spinner loading-lg"></span>
  </div>
}
