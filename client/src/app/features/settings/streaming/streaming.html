@if (loading()) {
  <div class="flex justify-center py-16"><span class="loading loading-spinner loading-lg"></span></div>
} @else {
  <div class="space-y-6 max-w-xl">
    <h2 class="text-xl font-semibold">{{ 'settings.streaming.title' | translate }}</h2>
    <p class="text-base-content/60">{{ 'settings.streaming.description' | translate }}</p>

    <!-- Segment duration -->
    <div class="form-control">
      <label class="label"><span class="label-text font-medium">{{ 'settings.streaming.segment_duration' | translate }}</span></label>
      <select class="select select-bordered w-full" [ngModel]="segmentDuration()" (ngModelChange)="segmentDuration.set($event)">
        <option value="2">2s</option>
        <option value="3">3s</option>
        <option value="4">4s</option>
        <option value="6">6s</option>
      </select>
      <label class="label"><span class="label-text-alt text-base-content/50">{{ 'settings.streaming.segment_duration_help' | translate }}</span></label>
    </div>

    <!-- QSV / libx264 encoder preset -->
    <div class="form-control">
      <label class="label"><span class="label-text font-medium">{{ 'settings.streaming.qsv_preset' | translate }}</span></label>
      <select class="select select-bordered w-full" [ngModel]="qsvPreset()" (ngModelChange)="qsvPreset.set($event)">
        <option value="veryfast">veryfast</option>
        <option value="faster">faster ({{ 'settings.streaming.default' | translate }})</option>
        <option value="fast">fast</option>
        <option value="medium">medium</option>
        <option value="slow">slow</option>
        <option value="slower">slower</option>
        <option value="veryslow">veryslow</option>
      </select>
      <label class="label"><span class="label-text-alt text-base-content/50">{{ 'settings.streaming.qsv_preset_help' | translate }}</span></label>
    </div>

    <!-- QSV advanced options (Intel Quick Sync only) -->
    <div class="divider">{{ 'settings.streaming.qsv_advanced' | translate }}</div>

    <div class="form-control">
      <label class="label cursor-pointer justify-start gap-3">
        <input type="checkbox" class="toggle" [ngModel]="qsvLowPower()" (ngModelChange)="qsvLowPower.set($event)" />
        <span class="label-text font-medium">{{ 'settings.streaming.qsv_low_power' | translate }}</span>
      </label>
      <label class="label"><span class="label-text-alt text-base-content/50">{{ 'settings.streaming.qsv_low_power_help' | translate }}</span></label>
    </div>

    <button class="btn btn-primary" [disabled]="saving()" (click)="save()">
      @if (saving()) { <span class="loading loading-spinner loading-xs"></span> }
      {{ 'common.save' | translate }}
    </button>
  </div>
}
