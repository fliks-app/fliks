<div class="flex flex-col gap-4">
  @if (loading()) {
    <div class="flex justify-center py-16">
      <span class="loading loading-spinner loading-lg"></span>
    </div>
  } @else {
    <div class="card bg-base-100 border border-base-200">
      <div class="card-body gap-5">
        <h2 class="card-title text-base">{{ 'settings.subtitles.section_search' | translate }}</h2>

        <app-toggle-field
          [value]="autoSearch() === 'true'"
          (valueChange)="autoSearch.set($event ? 'true' : 'false')"
          [label]="'settings.subtitles.auto_search' | translate"
          toggleClass="toggle-sm toggle-primary" />

        <app-toggle-field
          [value]="burnInCovers() === 'true'"
          (valueChange)="burnInCovers.set($event ? 'true' : 'false')"
          [label]="'settings.subtitles.burn_in_covers' | translate"
          [hint]="'settings.subtitles.burn_in_covers_hint' | translate"
          toggleClass="toggle-sm toggle-primary" />

        <app-toggle-field
          [value]="ocrBurnInAuto() === 'true'"
          (valueChange)="ocrBurnInAuto.set($event ? 'true' : 'false')"
          [label]="'settings.subtitles.ocr_burn_in_auto' | translate"
          [hint]="'settings.subtitles.ocr_burn_in_auto_hint' | translate"
          toggleClass="toggle-sm toggle-primary" />

        <label class="form-control w-full max-w-xs">
          <div class="label">
            <span class="label-text">{{ 'settings.subtitles.search_interval' | translate }}</span>
          </div>
          <input type="number" class="input input-bordered input-sm w-full" min="30" max="1440"
            [ngModel]="searchInterval()" (ngModelChange)="searchInterval.set($event)" />
          <div class="label">
            <span class="label-text-alt text-base-content/50">{{ 'settings.subtitles.search_interval_hint' | translate }}</span>
          </div>
        </label>

        <label class="form-control w-full max-w-xs">
          <div class="label">
            <span class="label-text">{{ 'settings.subtitles.min_score' | translate }}</span>
          </div>
          <input type="number" class="input input-bordered input-sm w-full" min="0" max="100"
            [ngModel]="minScore()" (ngModelChange)="minScore.set($event)" />
          <div class="label">
            <span class="label-text-alt text-base-content/50">{{ 'settings.subtitles.min_score_hint' | translate }}</span>
          </div>
        </label>

        <div class="divider my-0"></div>
        <h2 class="card-title text-base">{{ 'settings.subtitles.section_upgrade' | translate }}</h2>

        <label class="form-control w-full max-w-xs">
          <div class="label">
            <span class="label-text">{{ 'settings.subtitles.upgrade_interval' | translate }}</span>
          </div>
          <input type="number" class="input input-bordered input-sm w-full" min="60" max="2880"
            [ngModel]="upgradeInterval()" (ngModelChange)="upgradeInterval.set($event)" />
          <div class="label">
            <span class="label-text-alt text-base-content/50">{{ 'settings.subtitles.upgrade_interval_hint' | translate }}</span>
          </div>
        </label>

        <label class="form-control w-full max-w-xs">
          <div class="label">
            <span class="label-text">{{ 'settings.subtitles.upgrade_threshold' | translate }}</span>
          </div>
          <input type="number" class="input input-bordered input-sm w-full" min="0" max="100"
            [ngModel]="upgradeThreshold()" (ngModelChange)="upgradeThreshold.set($event)" />
          <div class="label">
            <span class="label-text-alt text-base-content/50">{{ 'settings.subtitles.upgrade_threshold_hint' | translate }}</span>
          </div>
        </label>

        <div class="divider my-0"></div>
        <h2 class="card-title text-base">{{ 'settings.subtitles.section_post_processing' | translate }}</h2>

        <app-toggle-field
          [value]="autoSync() === 'true'"
          (valueChange)="autoSync.set($event ? 'true' : 'false')"
          [label]="'settings.subtitles.auto_sync' | translate"
          toggleClass="toggle-sm toggle-primary" />

        <app-toggle-field
          [value]="encodeUtf8() === 'true'"
          (valueChange)="encodeUtf8.set($event ? 'true' : 'false')"
          [label]="'settings.subtitles.encode_utf8' | translate"
          toggleClass="toggle-sm toggle-primary" />

        <div class="divider my-0"></div>
        <h2 class="card-title text-base">{{ 'settings.subtitles.section_cleaning' | translate }}</h2>

        <app-toggle-field
          [value]="removeHiTags() === 'true'"
          (valueChange)="removeHiTags.set($event ? 'true' : 'false')"
          [label]="'settings.subtitles.remove_hi_tags' | translate"
          toggleClass="toggle-sm toggle-primary" />

        <app-toggle-field
          [value]="deleteBurnInSource() === 'true'"
          (valueChange)="deleteBurnInSource.set($event ? 'true' : 'false')"
          [label]="'settings.subtitles.ocr_delete_source' | translate"
          [hint]="'settings.subtitles.ocr_delete_source_hint' | translate"
          toggleClass="toggle-sm toggle-primary" />

        <label class="form-control w-full max-w-lg">
          <div class="label">
            <span class="label-text">{{ 'settings.subtitles.custom_exclusions' | translate }}</span>
          </div>
          <textarea class="textarea textarea-bordered w-full font-mono text-sm" rows="4"
            [placeholder]="'settings.subtitles.custom_exclusions_placeholder' | translate"
            [ngModel]="customExclusions()" (ngModelChange)="customExclusions.set($event)"></textarea>
          <div class="label">
            <span class="label-text-alt text-base-content/50">{{ 'settings.subtitles.custom_exclusions_hint' | translate }}</span>
          </div>
        </label>

        <div class="card-actions justify-end">
          <button type="button" class="btn btn-primary" (click)="save()" [disabled]="saving()">
            @if (saving()) {
              <span class="loading loading-spinner loading-sm"></span>
            }
            {{ 'common.save' | translate }}
          </button>
        </div>
      </div>
    </div>
  }
</div>
