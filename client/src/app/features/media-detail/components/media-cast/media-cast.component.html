@if (cast().length) {
  <app-detail-section [heading]="headingKey() | translate" [persistKey]="persistKey()">
    <app-horizontal-scroller>
      @for (c of cast(); track c.key) {
        <ng-template #card>
          <div class="avatar">
            <div
              class="w-16 h-16 sm:w-20 sm:h-20 rounded-full ring ring-base-200 group-hover:ring-primary group-focus:ring-primary group-focus-visible:ring-primary group-focus:ring-4 group-focus-visible:ring-4 group-focus:ring-offset-2 group-focus-visible:ring-offset-2 group-focus:ring-offset-base-100 group-focus-visible:ring-offset-base-100 transition-colors"
            >
              @if (c.avatarUrl) {
                <img
                  appImgFadeIn
                  [cachedSrc]="c.avatarUrl | resolveUrl: 'thumb'"
                  [alt]="c.name"
                  loading="lazy"
                  decoding="async"
                  fetchpriority="low"
                />
              } @else {
                <div class="bg-base-300 flex items-center justify-center w-full h-full text-lg font-bold text-base-content/30">
                  {{ c.name.charAt(0) }}
                </div>
              }
            </div>
          </div>
          <span class="text-sm text-center font-medium line-clamp-1 w-full">{{ c.name }}</span>
          @if (c.character) {
            <span class="text-sm text-base-content/50 text-center line-clamp-1 w-full -mt-1">{{ c.character }}</span>
          }
        </ng-template>
        @if (c.link; as link) {
          <a [routerLink]="link" (click)="armSlide()" data-no-focus-ring class="shrink-0 w-20 sm:w-24 flex flex-col items-center gap-1.5 group">
            <ng-container *ngTemplateOutlet="card" />
          </a>
        } @else {
          <div class="shrink-0 w-20 sm:w-24 flex flex-col items-center gap-1.5 group">
            <ng-container *ngTemplateOutlet="card" />
          </div>
        }
      }
    </app-horizontal-scroller>
  </app-detail-section>
}
