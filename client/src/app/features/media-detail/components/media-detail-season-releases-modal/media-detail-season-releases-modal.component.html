<dialog #dialog class="modal">
  <div class="modal-box w-[95%] max-w-7xl my-8 max-h-[calc(100vh-4rem)] flex flex-col overflow-hidden p-0">
    <div class="flex items-center justify-between px-6 pt-6 pb-3 shrink-0">
      <h3 class="text-lg font-bold">{{ 'media_detail.season_packs_title' | translate }}</h3>
      <form method="dialog">
        <button class="btn btn-sm btn-circle btn-ghost">✕</button>
      </form>
    </div>
    <div class="flex-1 overflow-y-auto px-6">
      @if (seasonReleasesLoading()) {
        <div class="flex justify-center py-8">
          <span class="loading loading-spinner loading-lg"></span>
        </div>
      } @else if (seasonReleasesError()) {
        <div role="alert" class="alert alert-error text-sm">{{ seasonReleasesError() }}</div>
      } @else if (seasonReleases().length === 0) {
        <p class="text-sm text-base-content/60 py-4">{{ 'media_detail.releases_empty' | translate }}</p>
      } @else {
        <app-releases-table
          [releases]="seasonReleases()"
          [grabBusy]="seasonGrabBusy() != null ? 'busy' : null"
          [grabState]="seasonReleaseGrabState()"
          [canGrab]="true"
          [showCfScore]="false"
          grabPrefix="s"
          (grab)="grabSeasonRelease.emit($event)"
        />
      }
    </div>
    <div class="modal-action px-6 pb-4 pt-2 shrink-0">
      <form method="dialog">
        <button class="btn btn-sm">{{ 'common.close' | translate }}</button>
      </form>
    </div>
  </div>
  <form method="dialog" class="modal-backdrop"><button>close</button></form>
</dialog>
