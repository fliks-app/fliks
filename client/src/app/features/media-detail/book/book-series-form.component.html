<form class="flex flex-col gap-3" (submit)="$event.preventDefault(); save()">
  @if (options().length) {
    <app-select-field [label]="'books_work.series_name' | translate" [value]="choice()" (valueChange)="choice.set($event)" data-testid="series-select">
      @for (s of options(); track s.id) {
        <option [value]="s.id">{{ s.name }}</option>
      }
      <option [value]="NEW">{{ 'books_work.series_new' | translate }}</option>
    </app-select-field>
  }
  @if (isNew()) {
    <label class="flex flex-col gap-1 text-sm">
      @if (!options().length) {
        {{ 'books_work.series_name' | translate }}
      }
      <input
        type="text"
        class="input w-full"
        maxlength="255"
        data-testid="series-name"
        [attr.aria-label]="'books_work.series_name' | translate"
        [value]="name()"
        (input)="name.set($any($event.target).value)"
      />
    </label>
  }
  <label class="flex flex-col gap-1 text-sm">
    {{ 'books_work.series_position' | translate }}
    <input
      type="text"
      class="input w-full"
      maxlength="100"
      data-testid="series-position"
      [placeholder]="'books_work.series_position_hint' | translate"
      [value]="position()"
      (input)="position.set($any($event.target).value)"
    />
  </label>
  <div class="flex flex-wrap justify-end gap-2">
    @if (locked()) {
      <button type="button" class="btn btn-ghost" data-testid="series-reset" [disabled]="busy()" (click)="reset()">
        {{ 'books_work.series_reset' | translate }}
      </button>
    }
    @if (series()) {
      <button type="button" class="btn btn-ghost text-error" data-testid="series-remove" [disabled]="busy()" (click)="remove()">
        {{ 'books_work.series_remove' | translate }}
      </button>
    }
    <button type="submit" class="btn btn-primary" data-testid="series-save" [disabled]="!canSave()">
      {{ 'common.save' | translate }}
    </button>
  </div>
</form>
