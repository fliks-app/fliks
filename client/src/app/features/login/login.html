<div class="min-h-screen flex items-center justify-center bg-base-200">
  <div class="card w-96 bg-base-100 shadow-xl">
    <div class="card-body">
      <img
        src="fliks-logo-ondark.svg"
        alt="{{ 'app.name' | translate }}"
        class="h-14 w-auto mx-auto mb-6"
      />

      @if (error()) {
        <div role="alert" class="alert alert-error mb-4">
          <span>{{ error() }}</span>
        </div>
      }

      @if (passwordFolded()) {
        <div class="flex flex-col gap-2">
          <app-sso-buttons />
          <button type="button" class="btn btn-ghost btn-sm" data-testid="admin-sign-in" (click)="adminSignIn.set(true)">
            {{ 'login.admin_sign_in' | translate }}
          </button>
        </div>
      } @else {
      <form [formGroup]="form" (ngSubmit)="onSubmit()">
        <fieldset class="fieldset">
          <label class="fieldset-label" for="username">{{ 'login.username' | translate }}</label>
          <input
            id="username"
            type="text"
            class="input input-bordered w-full"
            formControlName="username"
            autocomplete="username"
            [readOnly]="usernameLocked"
          />
        </fieldset>

        <fieldset class="fieldset">
          <label class="fieldset-label" for="password">{{ 'login.password' | translate }}</label>
          <input
            id="password"
            type="password"
            class="input input-bordered w-full"
            formControlName="password"
            autocomplete="current-password"
          />
        </fieldset>

        <div class="card-actions mt-6">
          <button
            type="submit"
            class="btn btn-primary w-full"
            [disabled]="loading()"
          >
            @if (loading()) {
              <span class="loading loading-spinner loading-sm"></span>
            }
            {{ 'login.submit' | translate }}
          </button>
        </div>
      </form>

      @if (sso().length) {
        <div class="divider my-2 text-sm text-base-content/50">{{ 'login.or' | translate }}</div>
        <div class="flex flex-col gap-2">
          <app-sso-buttons />
        </div>
      }
      }

      @if (canPickUser()) {
        <button class="btn btn-ghost btn-sm w-full mt-2" (click)="goToSelectUser()">
          {{ 'login.back_to_picker' | translate }}
        </button>
      }

      @if (isNative) {
        <button class="btn btn-ghost btn-sm w-full" (click)="changeServer()">
          {{ 'nav.change_server' | translate }}
        </button>
      }
    </div>
  </div>
</div>
