<div class="flex flex-col gap-4">
  <div class="flex flex-wrap items-center gap-2">
    <input type="search" class="input input-bordered input-sm flex-1 min-w-40 max-w-sm" [placeholder]="'common.search' | translate" [attr.aria-label]="'common.search' | translate" [ngModel]="query()" (ngModelChange)="query.set($event)" />
    <select appTvSelect class="select select-bordered select-sm" [attr.aria-label]="'music.sort' | translate" [ngModel]="sortBy()" (ngModelChange)="sortBy.set($event)">
      @for (s of sorts; track s) {
        <option [value]="s">{{ 'music.sort_' + s | translate }}</option>
      }
    </select>
    <select appTvSelect class="select select-bordered select-sm" [attr.aria-label]="'music.filter' | translate" [ngModel]="filter()" (ngModelChange)="filter.set($event)">
      <option value="">{{ 'music.filter_all' | translate }}</option>
      <option value="favourite">{{ 'music.filter_favourites' | translate }}</option>
    </select>
  </div>
  @if (!list.rows().length) {
    @if (list.loading()) {
      <div class="flex justify-center py-12"><span class="loading loading-spinner loading-lg"></span></div>
    } @else {
      <p class="text-center py-12 text-base-content/50">{{ 'music.no_tracks' | translate }}</p>
    }
  } @else {
    <ul class="flex flex-col gap-1">
      @for (r of list.rows(); track r.itemId; let i = $index) {
        <li class="flex items-center gap-1 rounded-lg pe-1 hover:bg-base-200" data-testid="track-row">
          <button type="button" class="flex min-w-0 flex-1 items-center gap-3 rounded-lg px-3 py-2 text-left focus-visible:outline-2 disabled:cursor-default" [disabled]="!r.hasFile" [attr.aria-label]="'music.play_track' | translate: { title: r.title }" (click)="play(i)">
            <app-track-line [title]="r.title" [subtitle]="line(r.artists)" [explicit]="r.explicit" [durationSeconds]="r.durationSeconds">
              <svg lead lucidePlay class="size-4 shrink-0 text-base-content/50"></svg>
              @if (!r.hasFile) {
                <span class="badge badge-ghost badge-sm">{{ 'music.missing' | translate }}</span>
              }
              <span class="hidden sm:inline min-w-0 max-w-48 truncate text-sm text-base-content/60">{{ r.albumTitle }}</span>
            </app-track-line>
          </button>
          <a class="btn btn-ghost btn-sm shrink-0" [routerLink]="['/albums', r.mediaId]">{{ 'music.open_album' | translate }}</a>
        </li>
      }
    </ul>
    @if (list.more()) {
      <button type="button" class="btn btn-ghost self-center" [disabled]="list.loading()" (click)="list.loadMore()">{{ 'common.show_more' | translate }}</button>
    }
  }
</div>
