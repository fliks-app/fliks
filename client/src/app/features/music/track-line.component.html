<ng-content select="[lead]" />
<span class="min-w-0 flex-1">
  <span class="block truncate font-medium" [class.text-primary]="active()">{{ title() }}@if (explicit()) { <span class="badge badge-ghost badge-sm ml-2">{{ 'music.explicit' | translate }}</span> }</span>
  @if (subtitle() || itemId() != null) {
    <span class="flex items-center gap-1.5 text-sm text-base-content/60">
      @if (itemId(); as id) {
        <app-track-download-glyph [itemId]="id" />
      }
      <span class="truncate">{{ subtitle() }}</span>
    </span>
  }
</span>
<ng-content />
@if (duration()) {
  <span class="hidden sm:inline text-sm tabular-nums text-base-content/60">{{ duration() }}</span>
}
