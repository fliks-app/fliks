<app-hero-base
  [title]="seed()?.title ?? null"
  [loading]="!seed()"
  mediaType="album"
  [posterUrl]="seed()?.posterUrl ?? null"
  [viewTransitionName]="posterTransitionName()"
  [chips]="chips"
>
  <ng-container ngProjectAs="[heroActions]">
    @if (canImport()) {
      <button type="button" class="btn btn-primary gap-2" (click)="open()" data-hero-actions>
        <svg lucidePlus class="h-4 w-4"></svg>{{ 'discover.add_to_library' | translate }}
      </button>
    } @else if (requested()) {
      <span class="badge badge-warning" data-hero-actions>{{ 'discover.already_requested' | translate }}</span>
    } @else if (canRequest()) {
      <button type="button" class="btn btn-secondary" (click)="open()" data-hero-actions>{{ 'discover.request' | translate }}</button>
    }
  </ng-container>
</app-hero-base>

<app-add-dialog (done)="onAdded($event)" />
