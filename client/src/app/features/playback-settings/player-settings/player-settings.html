<h1 class="text-2xl font-bold mb-4">{{ 'app_settings.nav.player' | translate }}</h1>
<div class="card bg-base-100 border border-base-200">
  <div class="card-body gap-5">
    <app-select-field
      class="w-full max-w-xs"
      [(value)]="preferredAudioLanguage"
      [label]="'playback_settings.player_preferred_lang' | translate"
      [hint]="'playback_settings.player_preferred_lang_hint' | translate"
    >
      @for (l of languageOptions; track l.value) {
        <option [value]="l.value">{{ l.label }}</option>
      }
    </app-select-field>

    <div class="divider my-0"></div>

    <app-toggle-field
      [(value)]="useDefaultAudioStream"
      [label]="'playback_settings.player_use_default' | translate"
      [hint]="'playback_settings.player_use_default_hint' | translate"
    />

    <div class="divider my-0"></div>

    <app-toggle-field
      [(value)]="rememberAudioSelections"
      [label]="'playback_settings.player_remember_audio' | translate"
      [hint]="'playback_settings.player_remember_audio_hint' | translate"
    />

    @if (showHdrToggle()) {
      <div class="divider my-0"></div>

      <app-toggle-field
        [(value)]="forceDisableHdr"
        [label]="'playback_settings.player_disable_hdr' | translate"
        [hint]="'playback_settings.player_disable_hdr_hint' | translate"
      />

    }

    <div class="divider my-0"></div>

    <app-toggle-field
      [(value)]="showEcoQualities"
      [label]="'playback_settings.player_show_eco' | translate"
      [hint]="'playback_settings.player_show_eco_hint' | translate"
    />

    <app-toggle-field
      [(value)]="ecoByDefault"
      [label]="'playback_settings.player_eco_default' | translate"
      [hint]="'playback_settings.player_eco_default_hint' | translate"
    />

    <div class="divider my-0"></div>

    <app-toggle-field
      [(value)]="autoSkipIntro"
      [label]="'playback_settings.player_auto_skip_intro' | translate"
      [hint]="'playback_settings.player_auto_skip_intro_hint' | translate"
    />

    <app-toggle-field
      [(value)]="autoPlayNext"
      [label]="'playback_settings.player_auto_play_next' | translate"
      [hint]="'playback_settings.player_auto_play_next_hint' | translate"
    />

    <button class="btn btn-ghost btn-sm text-error gap-2 self-start" (click)="clearAudioSelections()">
      <svg lucideTrash2 class="h-4 w-4"></svg>
      {{ 'playback_settings.player_clear_saved' | translate }}
    </button>

    <div class="card-actions justify-end pt-2">
      <button class="btn btn-primary" (click)="save()">{{ 'common.save' | translate }}</button>
    </div>
  </div>
</div>
