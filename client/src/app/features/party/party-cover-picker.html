<div class="flex flex-col gap-2">
  <div role="radiogroup" class="join flex-wrap" [attr.aria-label]="'party.cover' | translate">
    @for (m of modes; track m) {
      <button
        type="button"
        role="radio"
        class="btn btn-sm join-item"
        [class.btn-primary]="draft().mode === m"
        [attr.aria-checked]="draft().mode === m"
        [disabled]="(m === 'item' && !options().length) || (m === 'mosaic' && options().length < 2)"
        (click)="setMode(m)"
      >{{ 'party.cover_' + m | translate }}</button>
    }
  </div>
  <p class="text-sm text-base-content/70">{{ 'party.cover_' + draft().mode + '_hint' | translate }}</p>

  @if (selectable()) {
    <div class="grid grid-cols-4 gap-2 sm:grid-cols-6">
      @for (o of options(); track o.mediaId + ':' + o.episodeId) {
        <button
          type="button"
          class="relative aspect-2/3 overflow-hidden rounded-lg bg-base-300 outline-offset-2"
          [class.outline-2]="isPicked(o)"
          [class.outline-primary]="isPicked(o)"
          [attr.aria-pressed]="isPicked(o)"
          [attr.aria-label]="o.title"
          [title]="o.title"
          (click)="toggle(o)"
        >
          @if (o.posterUrl) {
            <img [src]="o.posterUrl | resolveUrl: 'thumb'" alt="" loading="lazy" class="h-full w-full object-cover" />
          }
        </button>
      }
    </div>
  } @else if (draft().mode === 'upload') {
    <input #file type="file" accept="image/*" class="file-input file-input-bordered file-input-sm w-full" [attr.aria-label]="'party.cover_upload' | translate" (change)="setFile(file)" />
    @if (preview(); as src) {
      <img [src]="src" alt="" class="h-32 w-auto self-start rounded-lg object-cover" />
    } @else if (currentUpload(); as url) {
      <img [src]="url | resolveUrl: 'medium'" alt="" class="h-32 w-auto self-start rounded-lg object-cover" />
    }
  }
</div>
