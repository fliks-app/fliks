@if (button()) {
  <button type="button" class="btn btn-sm btn-outline gap-1" (click)="open()"><svg lucidePlus class="h-4 w-4"></svg>{{ 'party.programme_add' | translate }}</button>
}
<dialog #dialog appModal boxClass="max-w-md" (close)="shown.set(false)">
  <app-modal-header [title]="'party.add_people' | translate" />
  @if (shown()) {
    @if (link(); as url) {
      <div class="mb-4 flex items-center gap-2">
        <input type="text" class="input input-sm min-w-0 flex-1" readonly [value]="url" />
        <button type="button" class="btn btn-sm btn-outline gap-1" (click)="party.shareLink(url, view().name)">
          @if (party.canShare()) {
            <svg lucideShare2 class="h-4 w-4"></svg>{{ 'party.share_link' | translate }}
          } @else {
            <svg lucideCopy class="h-4 w-4"></svg>{{ 'party.copy_link' | translate }}
          }
        </button>
      </div>
    }
    @if (host()) {
      <app-party-invitee-picker [exclude]="excluded()" [(selected)]="selected" />
    }
  }
  <app-modal-footer>
    <button type="button" class="btn btn-ghost" (click)="close()">{{ 'common.cancel' | translate }}</button>
    @if (host()) {
      <button type="button" class="btn btn-primary" [disabled]="busy() || !selected().length" (click)="invite()">{{ 'party.programme_add' | translate }}</button>
    }
  </app-modal-footer>
</dialog>
