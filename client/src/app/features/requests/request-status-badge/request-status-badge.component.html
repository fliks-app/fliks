@if (descriptor(); as d) {
  @if (d.labelKey) {
    @if (clickable()) {
      <button
        type="button"
        class="btn btn-ghost btn-sm px-1.5"
        [attr.aria-label]="(failureReason() !== null ? 'requests.failed_reason_title' : 'media_detail.download_detail_title') | translate"
        (click)="$event.stopPropagation(); activate()"
      >
        <app-progress-badge
          [label]="d.labelKey | translate"
          [percent]="d.percent"
        [busy]="d.busy"
          [badgeClass]="d.badgeClass"
        />
      </button>
    } @else {
      <app-progress-badge
        [label]="d.labelKey | translate"
        [percent]="d.percent"
        [busy]="d.busy"
        [badgeClass]="d.badgeClass"
      />
    }
  }
}
