@if (manager()) {
  @if (pending()) {
    <button type="button" class="btn btn-secondary gap-2 max-md:flex-1" [disabled]="busy()" (click)="approve()">
      <svg [lucideIcon]="icons.Check" class="h-4 w-4"></svg>{{ 'requests.approve' | translate }}
    </button>
  }
} @else if (state().requestedByMe) {
  <span class="badge badge-warning h-auto py-1 whitespace-normal">{{ 'requests.you_requested' | translate }}</span>
} @else if (state().watching) {
  <button type="button" class="btn btn-outline btn-success gap-2 max-md:flex-1" disabled>
    <svg [lucideIcon]="icons.Check" class="h-4 w-4"></svg>{{ 'requests.watching' | translate }}
  </button>
  <app-dropdown-menu placement="bottom-start" [heading]="'requests.watching' | translate">
    <button trigger type="button" class="btn btn-ghost btn-square" [attr.aria-label]="'common.actions' | translate">
      <svg [lucideIcon]="icons.Ellipsis" class="h-4 w-4"></svg>
    </button>
    <button type="button" class="dropdown-item text-white" [disabled]="busy()" (click)="unwatch()">
      <svg [lucideIcon]="icons.BellOff" class="h-4 w-4"></svg>
      {{ 'requests.unwatch' | translate }}
    </button>
  </app-dropdown-menu>
} @else {
  <button type="button" class="btn btn-outline gap-2 max-md:flex-1" [disabled]="busy()" (click)="watch()">
    <svg [lucideIcon]="icons.Bell" class="h-4 w-4"></svg>{{ 'requests.watch' | translate }}
  </button>
}

@if (manager()) {
  <app-request-requesters class="order-last w-full max-md:mt-1" [requestId]="state().requestId!" [version]="state()" (loaded)="detail.set($event)" />
} @else if (line()) {
  <div class="order-last w-full flex items-center gap-2 text-sm text-base-content/60 max-md:mt-1">
    <svg [lucideIcon]="icons.Users" class="h-4 w-4 shrink-0"></svg>{{ line() }}
  </div>
}
