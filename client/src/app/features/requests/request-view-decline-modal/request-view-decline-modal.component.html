<dialog #dialog appModal boxClass="max-w-md" aria-labelledby="request-view-decline-title" (close)="dismissed.emit()">
  @if (payload(); as declineView) {
    <app-modal-header>
      <div class="min-w-0">
        <h3 id="request-view-decline-title" class="text-lg font-bold">
          {{ 'requests.view_decline_title' | translate }}
        </h3>
        <p class="text-base text-base-content/60 mt-1 line-clamp-2">{{ declineView.mediaTitle }}</p>
      </div>
    </app-modal-header>
  }
  @if (payload(); as declineView) {
    <p class="text-sm text-base-content whitespace-pre-wrap wrap-break-word">
      {{ declineView.reason }}
    </p>
  }
</dialog>
