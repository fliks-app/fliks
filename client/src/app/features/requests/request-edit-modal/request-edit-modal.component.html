<dialog #dialog class="modal" aria-labelledby="request-edit-title">
  @if (row(); as editRow) {
    <div class="modal-box max-w-md">
      <app-modal-header>
        <div>
          <h3 id="request-edit-title" class="text-lg font-bold">
            {{ 'requests.edit_title' | translate }}
          </h3>
          <p class="text-sm text-base-content/60 mt-1">{{ editRow.title }}</p>
        </div>
      </app-modal-header>

      <div class="flex flex-col gap-4 mt-4">
        @if (libraries().length > 1) {
          <label class="form-control w-full">
            <span class="label-text">{{ 'settings.libraries.title' | translate }}</span>
            <select
              class="select select-bordered select-sm w-full"
              [ngModel]="libraryId()"
              (ngModelChange)="libraryIdChange.emit($event ? +$event : null)"
            >
              <option [ngValue]="null">—</option>
              @for (l of libraries(); track l.id) {
                <option [ngValue]="l.id">{{ l.name }}</option>
              }
            </select>
          </label>
        }
        @if (qualityProfiles().length) {
          <label class="form-control w-full">
            <span class="label-text">{{ 'discover.quality_profile' | translate }}</span>
            <select
              class="select select-bordered select-sm w-full"
              [ngModel]="qualityProfileId()"
              (ngModelChange)="qualityProfileIdChange.emit($event)"
            >
              <option [ngValue]="null">—</option>
              @for (p of qualityProfiles(); track p.id) {
                <option [ngValue]="p.id">{{ p.name }}</option>
              }
            </select>
          </label>
        }
        @if (languageProfiles().length) {
          <label class="form-control w-full">
            <span class="label-text">{{ 'discover.language_profile' | translate }}</span>
            <select
              class="select select-bordered select-sm w-full"
              [ngModel]="languageProfileId()"
              (ngModelChange)="languageProfileIdChange.emit($event)"
            >
              <option [ngValue]="null">—</option>
              @for (p of languageProfiles(); track p.id) {
                <option [ngValue]="p.id">{{ p.name }}</option>
              }
            </select>
          </label>
        }
      </div>

      <div class="modal-action mt-2">
        <button type="button" class="btn btn-ghost" (click)="close(); dismissed.emit()">
          {{ 'common.cancel' | translate }}
        </button>
        <button
          type="button"
          class="btn btn-primary"
          [disabled]="saving()"
          (click)="save.emit()"
        >
          @if (saving()) {
            <span class="loading loading-spinner loading-xs"></span>
          }
          {{ 'common.save' | translate }}
        </button>
      </div>
    </div>
  }
  <form method="dialog" class="modal-backdrop">
    <button type="button" (click)="close(); dismissed.emit()" [attr.aria-label]="'common.close' | translate">
      {{ 'common.close' | translate }}
    </button>
  </form>
</dialog>
