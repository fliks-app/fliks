<dialog #dialog appModal boxClass="max-w-md" aria-labelledby="request-decline-title" (close)="dismissed.emit()">
  <app-modal-header>
    <h3 id="request-decline-title" class="text-lg font-bold">
      {{ 'requests.decline_title' | translate }}
    </h3>
  </app-modal-header>
  <div appTvRow class="flex flex-wrap gap-2 mt-3 scroll-ring-safe">
    @for (key of reasons; track key) {
      <button
        type="button"
        class="btn btn-sm btn-outline"
        [class.btn-active]="isPicked(key)"
        [attr.aria-pressed]="isPicked(key)"
        (click)="pick(key)"
      >
        {{ key | translate }}
      </button>
    }
  </div>
  <textarea
    class="textarea textarea-bordered w-full mt-3"
    rows="3"
    [placeholder]="'requests.decline_reason_placeholder' | translate"
    [ngModel]="reasonText()"
    (ngModelChange)="reasonTextChange.emit($event)"
  ></textarea>
  <app-modal-footer>
    <button type="button" class="btn btn-ghost" (click)="close()">
      {{ 'common.cancel' | translate }}
    </button>
    <button
      type="button"
      class="btn btn-warning"
      [disabled]="submitBusy()"
      (click)="submitted.emit()"
    >
      {{ 'requests.decline_submit' | translate }}
    </button>
  </app-modal-footer>
</dialog>
