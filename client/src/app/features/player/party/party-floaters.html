<div class="pointer-events-none absolute inset-0 z-[56] overflow-hidden" aria-hidden="true">
  @for (r of party.reactions(); track r.key) {
    <span class="reaction" [style.left.%]="r.left" [attr.title]="r.username"><app-party-emoji [emoji]="r.emoji" /></span>
  }
  <!-- Under the top bar, the newest message last. -->
  <div
    class="absolute flex max-w-[70%] flex-col items-end gap-1"
    style="top: max(4.5rem, env(safe-area-inset-top)); right: max(1rem, env(safe-area-inset-right))"
  >
    @for (m of party.bubbles(); track m.id) {
      <div class="rounded-2xl bg-black/70 px-3 py-1.5 text-sm text-white">
        @if (m.system) {
          <span class="italic opacity-80">{{ m.system.by }}</span>
        } @else {
          <span class="font-semibold">{{ m.username }}</span>{{ 'party.chat_name_sep' | translate }}<span class="opacity-80">{{ m.text }}</span>
        }
      </div>
    }
  </div>
</div>
