<dialog #dialog class="modal">
  <div class="modal-box max-w-sm">
    <app-modal-header [title]="'party.reaction_settings' | translate" />
    <div class="flex flex-col gap-4 pt-2">
      <app-toggle-field
        [label]="'party.reaction_dock_show' | translate"
        [value]="party.reactionDock()"
        (valueChange)="party.setReactionDock($event)"
      />
      <app-toggle-field
        [label]="'party.reaction_keep_open' | translate"
        [value]="party.reactionKeepOpen()"
        (valueChange)="party.setReactionKeepOpen($event)"
      />
      <div class="flex flex-col gap-2">
        <div class="flex items-center justify-between gap-2">
          <span class="font-medium">{{ 'party.reaction_bar' | translate }}</span>
          <button type="button" class="link text-sm" (click)="reset()">{{ 'party.reaction_bar_reset' | translate }}</button>
        </div>
        <p class="text-xs" [class.text-warning]="full()" [class.opacity-70]="!full()">
          {{ (full() ? 'party.reaction_bar_full' : 'party.reaction_bar_hint') | translate: { max: max } }}
        </p>
        <div class="grid grid-cols-6 gap-1">
          @for (e of catalog.emojis(); track e) {
            @let i = catalog.bar().indexOf(e);
            <button
              type="button"
              class="btn btn-ghost btn-square relative h-11 w-full text-xl"
              [class.btn-active]="i >= 0"
              [class.ring-2]="i >= 0"
              [class.ring-primary]="i >= 0"
              [attr.aria-pressed]="i >= 0"
              (click)="toggle(e)"
            >
              {{ e }}
              @if (i >= 0) {
                <span class="badge badge-primary badge-xs absolute top-0 right-0">{{ i + 1 }}</span>
              }
            </button>
          }
        </div>
      </div>
      <p class="text-xs opacity-60">{{ 'party.reaction_credit' | translate }}</p>
    </div>
  </div>
  <form method="dialog" class="modal-backdrop"><button tabindex="-1">close</button></form>
</dialog>
