<div class="flex flex-col gap-4">
  <app-toggle-field
    [label]="'party.switch_playback_control' | translate"
    [disabled]="disabled()"
    [value]="value().policy === 'everyone'"
    (valueChange)="changed.emit({ policy: $event ? 'everyone' : 'host_only' })"
  />
  <app-toggle-field
    [label]="'party.switch_reactions' | translate"
    [disabled]="disabled()"
    [value]="value().reactionsEnabled"
    (valueChange)="changed.emit({ reactionsEnabled: $event })"
  />
  <app-toggle-field
    [label]="'party.switch_chat' | translate"
    [disabled]="disabled()"
    [value]="value().chatEnabled"
    (valueChange)="changed.emit({ chatEnabled: $event })"
  />
  <app-toggle-field
    [label]="'party.switch_link_sharing' | translate"
    [disabled]="disabled()"
    [value]="value().linkSharing"
    (valueChange)="changed.emit({ linkSharing: $event })"
  />
</div>
