@if (open() && !reactions.keepOpen()) {
  <!-- An outside tap only folds the row; it must not reach the player and wake its controls. -->
  <div class="dock-backdrop" (click)="fold()" (touchstart)="$event.stopPropagation()" (pointerdown)="$event.stopPropagation()"></div>
}
<div class="relative flex items-center" appTvRow>
  @if (settling()) {
    <div class="absorb" aria-hidden="true"></div>
  }
  <div class="emojis flex gap-0.5 rounded-full" [class.open]="open()" [attr.aria-hidden]="!open()">
    @for (e of reactions.bar(); track e; let i = $index) {
      <button
        type="button"
        class="emoji"
        [style.--i]="$count - 1 - i"
        [attr.tabindex]="open() ? 0 : -1"
        (click)="send(e, $event)"
      >{{ e }}</button>
    }
  </div>
  <button
    #toggle
    type="button"
    class="dock-toggle"
    [class.active]="open()"
    [attr.aria-label]="(open() ? 'party.reactions_hide' : 'party.reactions_show') | translate"
    [attr.aria-expanded]="open()"
    (click)="reactions.setRowOpen(!open())"
  >
    <svg lucideSmilePlus class="icon icon-closed h-5 w-5"></svg>
    <svg lucideX class="icon icon-open h-5 w-5"></svg>
  </button>
  @if (voice.joined() && !voice.listenOnly()) {
    <button
      type="button"
      class="dock-toggle mic"
      [class.active]="!voice.muted()"
      [attr.aria-label]="(voice.muted() ? 'party.voice_unmute' : 'party.voice_mute') | translate"
      [attr.aria-pressed]="!voice.muted()"
      (pointerdown)="micDown()"
      (pointerup)="micUp(true)"
      (pointercancel)="micUp(false)"
      (pointerleave)="micUp(false)"
      (contextmenu)="$event.preventDefault()"
      (click)="micClick($event)"
    >
      @if (voice.muted()) {
        <svg lucideMicOff class="h-5 w-5"></svg>
      } @else {
        <svg lucideMic class="h-5 w-5"></svg>
      }
    </button>
  }
</div>
