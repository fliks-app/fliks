<div class="flex items-center" appTvRow>
  <div class="emojis flex gap-0.5 rounded-full">
    @for (e of reactions.bar(); track e) {
      <button type="button" class="emoji" [attr.data-emoji]="e" (focus)="reactions.lastFocused = e" (click)="send(e, $event)">{{ e }}</button>
    }
  </div>
  @if (voice.joined() && !voice.listenOnly()) {
    <button
      type="button"
      class="dock-toggle mic"
      [class.active]="!voice.muted()"
      [attr.aria-label]="(voice.muted() ? 'party.voice_unmute' : 'party.voice_mute') | translate"
      [attr.aria-pressed]="!voice.muted()"
      (pointerdown)="micDown()"
      (pointerup)="micUp(true)"
      (pointercancel)="micUp(false)"
      (pointerleave)="micUp(false)"
      (contextmenu)="$event.preventDefault()"
      (click)="micClick($event)"
    >
      @if (voice.muted()) {
        <svg lucideMicOff class="h-5 w-5"></svg>
      } @else {
        <svg lucideMic class="h-5 w-5"></svg>
      }
    </button>
  }
</div>
