<!-- Local player (hidden when casting — Cast overlay is global in the layout) -->
<div
  #playerContainer
  appDefaultFocus="[data-default-focus]"
  class="player-container"
  [class.closing]="closing()"
  [class.player-hide-cursor]="!chrome.visible()"
  [class.native-player]="!!nativeEngine"
  [class.hidden]="castService.isConnected()"
  (mousemove)="chrome.onPointerMove()"
  (wheel)="chrome.wakeFromPointerGesture()"
  (click)="chrome.wakeFromPointerGesture()"
>
  <!-- Backdrop until video renders its first frame. Rendered for both
       web (Shaka) and native (ExoPlayer) — on native the WebView is
       transparent so the HTML backdrop covers the ExoPlayer surface
       behind it during the loading phase.

       Progressive load: thumb variant (e.g. `?size=thumb`, ~10 KB)
       paints first thanks to its smaller payload, then the full-res
       version stacked on top fades in once it has decoded. Falls
       back to the same image at both layers for remote / non-`/api/
       images/...` URLs. -->
  @if (!videoStarted()) {
    <div class="absolute inset-0 z-1 bg-black">
      @if (fanartThumbUrl()) {
        <img
          [src]="fanartThumbUrl()!"
          alt=""
          fetchpriority="high"
          decoding="async"
          class="absolute inset-0 w-full h-full object-cover"
        />
      }
      @if (fanartUrl()) {
        <img
          [src]="fanartUrl()!"
          alt=""
          fetchpriority="high"
          decoding="async"
          class="absolute inset-0 w-full h-full object-cover opacity-0 transition-opacity duration-300"
          (load)="$any($event.target).classList.remove('opacity-0')"
        />
      }
    </div>
  }

  <video
    #videoElement
    class="player-video"
    playsinline
    [class.opacity-0]="!videoStarted()"
    [class.controls-visible]="chrome.visible()"
    [class.controls-seek]="chrome.visible() && chrome.seekOsd()"
    [style.object-fit]="fillScreen() ? 'cover' : 'contain'"
  ></video>

  <app-player-error-overlay
    [error]="error()"
    [diagnostics]="errorDiagnostics()"
    [canRetry]="!videoStarted()"
    (retry)="onRetry()"
    (back)="onBack()"
  />

  @if (spinnerVisible()) {
    <div class="loading-overlay absolute inset-0 flex flex-col items-center justify-center gap-3 z-50 pointer-events-none">
      <span class="loading loading-spinner loading-lg text-white"></span>
      <!-- A long buffer is almost always a cold transcode start; say so rather
           than leaving a mute spinner over a black frame. -->
      @if (preparing()) {
        <p class="text-sm text-white/70">{{ 'player.preparing' | translate }}</p>
      }
    </div>
  }

  @if (adminMessage(); as msg) {
    <div
      class="absolute left-1/2 -translate-x-1/2 z-[60] w-[min(90%,28rem)]"
      style="top: max(1.5rem, env(safe-area-inset-top))"
    >
      <div class="alert alert-info shadow-lg">
        <svg lucideInfo class="h-5 w-5 shrink-0"></svg>
        <span class="text-sm flex-1 break-words">{{ msg }}</span>
        <button
          type="button"
          class="btn btn-ghost btn-xs btn-square"
          (click)="dismissAdminMessage()"
          [attr.aria-label]="'common.close_notification' | translate"
        >
          <svg lucideX class="h-4 w-4"></svg>
        </button>
      </div>
    </div>
  }

  @if (!inPipMode()) {
  <app-player-controls
    (interacted)="chrome.onInteraction()"
    [visible]="chrome.visible()"
    [seekOsd]="chrome.seekOsd()"
    [paused]="paused()"
    [loading]="loading()"
    [buffering]="buffering()"
    [videoStarted]="videoStarted()"
    [currentTime]="currentTime()"
    [duration]="duration()"
    [bufferedEnd]="bufferedEnd()"
    [volume]="volume()"
    [muted]="muted()"
    [playbackRate]="playbackRate()"
    [mediaTitle]="mediaTitle()"
    [logoUrl]="mediaLogoUrl()"
    [episodeTitle]="displayEpisodeTitle()"
    [hasNext]="upNext() !== null"
    [nextLabelKey]="nextLabelKey()"
    [queueItems]="preRollActive() ? [] : queueItems()"
    [queueIndex]="queueIndex()"
    (selectQueueItem)="playQueueItem($event)"
    [activeQualityLabel]="activeQualityLabel()"
    [isNative]="isNative"
    [isDesktop]="isDesktopNative"
    (togglePlay)="onTogglePlay()"
    (tapOverlay)="chrome.toggle()"
    (seek)="onSeek($event)"
    (seekDragChange)="onSeekDragChange($event)"
    (volumeChange)="onVolumeChange($event)"
    (toggleMute)="onToggleMute()"
    (toggleFullscreen)="onToggleFullscreen()"
    (togglePip)="onTogglePip()"
    [canLockOrientation]="canLockOrientation"
    [orientationLocked]="orientationLocked()"
    (toggleOrientationLock)="onToggleOrientationLock()"
    [availableSubtitles]="availableSubtitles()"
    [availableQualities]="availableQualities()"
    [activeSubtitleId]="activeSubtitleId()"
    [activeQualityId]="activeQualityId()"
    [availableAudioTracks]="availableAudioTracks()"
    [activeAudioTrackId]="activeAudioTrackId()"
    (selectSubtitle)="onSelectSubtitleById($event)"
    (selectQuality)="onSelectQualityById($event)"
    (selectAudioTrack)="onSelectAudioTrack($event)"
    [statsVisible]="statsVisible()"
    (toggleStats)="statsVisible.set(!statsVisible())"
    (toggleFillScreen)="fillScreen.set(!fillScreen())"
    (openMedia)="onOpenMedia()"
    [fillScreen]="fillScreen()"
    (speedChange)="onSpeedChange($event)"
    (back)="onBack()"
    [pipAvailable]="pipAvailable()"
    [canPickDevice]="(castService.isAvailable() || remoteService.targets().length > 0) && !device.isTv()"
    [castConnected]="castService.isConnected()"
    [castConnecting]="castService.connecting()"
    (pickDevice)="onPickDevice($event)"
    [spriteUrl]="spriteUrl()"
    [spriteMetadata]="spriteMetadata()"
    [chapters]="chapters()"
    [introMarker]="introMarker()"
    [outroMarker]="outroMarker()"
    [showSkipIntro]="skipIntroVisible()"
    [showNextCue]="nextEpisodeVisible()"
    [cueDurationMs]="cueRevealMs"
    (skipIntro)="skipIntro()"
    (next)="advance()"
    [showPreRollSkip]="preRollSkippable()"
    (skipPreRoll)="skipPreRoll()"
    (panelOpenChange)="chrome.onPanelOpenChange($event)"
  />
  }

  <app-player-stats-overlay
    [visible]="statsVisible()"
    [stats]="playerStats()"
    (close)="onCloseStats()"
  />
</div>
