<h1 class="text-2xl font-bold mb-4">{{ 'app_settings.licenses' | translate }}</h1>
@if (failed()) {
  <p class="text-sm opacity-70">{{ 'app_settings.licenses_unavailable' | translate }}</p>
} @else if (text() !== null) {
  <pre class="text-sm whitespace-pre-wrap break-words">{{ text() }}</pre>
} @else {
  <span class="loading loading-spinner"></span>
}
