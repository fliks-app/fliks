<div class="mb-6">
  <h1 class="text-2xl font-bold">{{ (isHistory ? 'acquisition_queue.history_title' : 'acquisition_queue.queue_title') | translate }}</h1>
  <p class="text-sm text-base-content/60 mt-1">{{ (isHistory ? 'acquisition_queue.history_subtitle' : 'acquisition_queue.queue_subtitle') | translate }}</p>
</div>
@if (isHistory) {
  <app-data-table
    [titleKey]="''"
    [listUrl]="historyUrl"
    [columns]="historyColumns"
    [filters]="historyFilters"
    [rowActions]="historyActions"
    [listActions]="historyListActions"
    [paged]="true"
    [pageSize]="25"
    [bulkSelect]="true"
    [refreshOn]="refreshOn"
    [resolveAction]="resolveAction"
    emptyKey="acquisition_queue.empty_history"
    loadErrorKey="acquisition_queue.load_error"
  />
} @else {
  <app-data-table
    [titleKey]="''"
    [listUrl]="queueUrl"
    [columns]="queueColumns"
    [rowActions]="queueActions"
    [paged]="true"
    [pageSize]="25"
    [refreshOn]="refreshOn"
    [rowPatches]="rowPatches"
    [resolveAction]="resolveAction"
    emptyKey="acquisition_queue.empty_queue"
    loadErrorKey="acquisition_queue.load_error"
  />
}
