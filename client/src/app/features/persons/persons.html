<div class="flex flex-col gap-4">
  <!-- Header -->
  <div class="flex flex-col gap-3">
    <h1 class="page-title">{{ 'persons.title' | translate }}</h1>
    <!-- Search + filter -->
    <div class="flex gap-2 items-center">
      <div class="relative flex-1">
        <svg lucideSearch class="absolute left-3 top-1/2 -translate-y-1/2 h-4 w-4 text-base-content/40 pointer-events-none z-10"></svg>
        <input
          type="text"
          [placeholder]="'common.search' | translate"
          class="input input-bordered input-sm w-full pl-9"
          [ngModel]="searchQuery()"
          (ngModelChange)="onSearch($event)"
        />
      </div>
      @if (!bookRole) {
      <select appTvSelect
        class="select select-bordered select-sm min-w-28"
        [ngModel]="filterRole()"
        (ngModelChange)="onFilterRole($event)"
      >
        <option value="">{{ 'persons.filter_all' | translate }}</option>
        <option value="Acting">{{ 'persons.filter_cast' | translate }}</option>
        <option value="Directing">{{ 'persons.filter_directing' | translate }}</option>
        <option value="Writing">{{ 'persons.filter_writing' | translate }}</option>
        <option value="Production">{{ 'persons.filter_production' | translate }}</option>
      </select>
      }
    </div>
  </div>

  @if (loading()) {
    <app-row-skeleton />
  } @else if (list.total() === 0) {
    <app-empty-state icon="users" [title]="'persons.empty' | translate" [hint]="'persons.empty_hint' | translate" />
  } @else {
    <div class="flex gap-2">
      <cdk-virtual-scroll-viewport
        [pageScrollWindow]="detached"
        [itemSize]="list.grid.rowHeight()"
        [minBufferPx]="list.grid.rowHeight() * 2"
        [maxBufferPx]="list.grid.rowHeight() * 4"
        class="flex-1 min-w-0 library-viewport"
      >
        <div
          *cdkVirtualFor="let row of list.grid.rows(); trackBy: list.grid.trackRow"
          #personRow
          class="pr-6 grid content-start grid-cols-3 sm:grid-cols-4 md:grid-cols-5 lg:grid-cols-6 xl:grid-cols-8 2xl:grid-cols-10 gap-3 sm:gap-4"
          [style.height.px]="list.grid.rowHeight()"
        >
          @for (person of row.items; track person.id) {
            <app-person-avatar-card
              [id]="'person-' + person.id"
              [link]="'/persons/' + person.id"
              [queryParams]="bookRole ? { role: bookRole } : null"
              [name]="person.name"
              [avatarUrl]="person.avatarUrl"
              [subtitle]="bookRole ? ('books_search.work_count' | translatePlural: (workCounts.get(person.id) ?? 0)) : person.departments.join(', ')"
            />
          }
        </div>
      </cdk-virtual-scroll-viewport>

      <!-- Alphabet sidebar -->
      <nav data-alpha-index class="fixed inset-y-0 right-3 z-20 flex flex-col items-center justify-center gap-0 select-none pointer-events-none">
        @for (letter of alphabet; track letter) {
          <button
            type="button"
            class="text-sm font-medium w-5 h-5 flex items-center justify-center rounded transition-colors pointer-events-auto"
            [class.bg-primary]="list.activeLetter() === letter"
            [class.text-primary-content]="list.activeLetter() === letter"
            [class.text-base-content/60]="list.activeLetter() !== letter && list.availableLetters().has(letter)"
            [class.text-base-content/15]="!list.availableLetters().has(letter)"
            [class.hover:bg-primary/20]="list.activeLetter() !== letter && list.availableLetters().has(letter)"
            [disabled]="!list.availableLetters().has(letter)"
            (click)="scrollToLetter(letter)"
          >
            {{ letter }}
          </button>
        }
      </nav>
    </div>

  }

  @if (list.total() > 0) {
    <div class="flex items-center gap-6 mt-6 px-2 py-3 border-t border-base-200 text-sm text-base-content/70">
      <div><span class="font-semibold">{{ 'persons.total' | translate }}</span> {{ list.total() }}</div>
    </div>
  }
</div>
