<div class="flex flex-col gap-4">
  @if (librariesLoading()) {
    <span class="loading loading-spinner loading-sm"></span>
  } @else if (libraries().length === 0) {
    <p class="text-sm text-base-content/60">{{ 'import_disk.no_libraries' | translate }}</p>
  } @else {
    <div class="flex flex-wrap items-end gap-3">
      <label class="form-control flex-1 min-w-64">
        <span class="label-text">{{ 'import_disk.folder_label' | translate }}</span>
        <input
          type="text"
          class="input input-bordered input-sm w-full font-mono"
          [placeholder]="'import_disk.folder_placeholder' | translate"
          [ngModel]="folderPath()"
          (ngModelChange)="folderPath.set($event)"
          (keydown.enter)="scan()"
        />
      </label>
      <button type="button" class="btn btn-outline btn-sm" (click)="browse()">
        {{ 'common.browse' | translate }}
      </button>
      <label class="form-control w-56">
        <span class="label-text">{{ 'import_disk.library_label' | translate }}</span>
        <select
          appTvSelect
          class="select select-bordered select-sm w-full"
          [ngModel]="libraryId()"
          (ngModelChange)="setLibrary(+$event)"
        >
          @for (lib of libraries(); track lib.id) {
            <option [ngValue]="lib.id">{{ lib.name }}</option>
          }
        </select>
      </label>
      <button
        type="button"
        class="btn btn-primary btn-sm"
        (click)="scan()"
        [disabled]="scanPanel()?.scanning() || !folderPath().trim()"
      >
        @if (scanPanel()?.scanning()) {
          <span class="loading loading-spinner loading-xs"></span>
        }
        {{ 'settings.libraries.scan_folder' | translate }}
      </button>
    </div>

    <div class="flex flex-wrap items-center gap-3">
      <span class="text-sm font-medium">{{ 'import_disk.method_label' | translate }}</span>
      <div class="join">
        <button type="button" class="btn btn-sm join-item"
          [class.btn-primary]="method() === 'copy'"
          (click)="method.set('copy')">
          {{ 'import_disk.method_copy' | translate }}
        </button>
        <button type="button" class="btn btn-sm join-item"
          [class.btn-primary]="method() === 'move'"
          (click)="method.set('move')">
          {{ 'import_disk.method_move' | translate }}
        </button>
      </div>
      <span class="text-xs text-base-content/50">
        {{ (method() === 'copy' ? 'import_disk.method_copy_hint' : 'import_disk.method_move_hint') | translate }}
      </span>
    </div>

    <app-orphan-scan-panel #panel [transfer]="method()" />
  }
</div>
