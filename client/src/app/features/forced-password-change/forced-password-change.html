<div class="min-h-screen flex items-center justify-center bg-base-200 p-4">
  <div class="card w-96 bg-base-100 shadow-xl">
    <div class="card-body">
      <h2 class="card-title text-2xl justify-center mb-2">
        {{ 'forced_password_change.title' | translate }}
      </h2>
      <p class="text-sm text-base-content/70 text-center mb-4">
        {{ 'forced_password_change.subtitle' | translate }}
      </p>

      @if (error()) {
        <div role="alert" class="alert alert-error mb-4">
          <span>{{ error() }}</span>
        </div>
      }

      <form [formGroup]="form" (ngSubmit)="onSubmit()">
        <fieldset class="fieldset">
          <label class="fieldset-label" for="new-password">{{ 'forced_password_change.new_password' | translate }}</label>
          <input
            id="new-password"
            type="password"
            class="input input-bordered w-full"
            formControlName="password"
            autocomplete="new-password"
            autofocus
          />
        </fieldset>

        <fieldset class="fieldset">
          <label class="fieldset-label" for="confirm-password">{{ 'forced_password_change.confirm' | translate }}</label>
          <input
            id="confirm-password"
            type="password"
            class="input input-bordered w-full"
            formControlName="confirm"
            autocomplete="new-password"
          />
          @if (mismatch()) {
            <p class="text-sm text-error mt-1">{{ 'forced_password_change.mismatch' | translate }}</p>
          }
        </fieldset>

        <div class="card-actions mt-6">
          <button
            type="submit"
            class="btn btn-primary w-full"
            [disabled]="loading() || form.invalid || mismatch()"
          >
            @if (loading()) {
              <span class="loading loading-spinner loading-sm"></span>
            }
            {{ 'forced_password_change.submit' | translate }}
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
