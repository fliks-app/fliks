<app-dropdown-menu placement="bottom-end">
  <button
    trigger
    type="button"
    class="btn btn-ghost btn-circle"
    [disabled]="castService.connecting()"
    [attr.aria-label]="'remote.picker_title' | translate"
    (click)="onTriggerPress()"
  >
    @if (castService.connecting()) {
      <span class="loading loading-spinner loading-sm"></span>
    } @else {
      <svg lucideCast [class]="castService.isConnected() || airPlay.routeActive() || airPlay.videoActive() ? 'h-5 w-5 md:h-6 md:w-6 text-info' : 'h-5 w-5 md:h-6 md:w-6'"></svg>
    }
  </button>

  <app-remote-picker-list />
</app-dropdown-menu>
