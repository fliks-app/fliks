<app-dropdown-menu placement="bottom-end">
  <button
    trigger
    type="button"
    [class]="label() ? 'btn btn-ghost btn-sm gap-1 md:gap-2' : 'btn btn-ghost btn-circle'"
    [disabled]="castService.connecting()"
    [attr.aria-label]="'remote.picker_title' | translate"
    (click)="onTriggerPress()"
  >
    @if (castService.connecting()) {
      <span class="loading loading-spinner loading-sm"></span>
    } @else {
      <svg lucideCast [class]="label() || castService.isConnected() || airPlay.routeActive() || airPlay.videoActive() ? 'h-5 w-5 md:h-6 md:w-6 text-info' : 'h-5 w-5 md:h-6 md:w-6'"></svg>
    }
    @if (label()) {
      <span class="max-w-24 truncate text-sm font-medium md:max-w-32">{{ label() }}</span>
    }
  </button>

  <app-remote-picker-list />
</app-dropdown-menu>
