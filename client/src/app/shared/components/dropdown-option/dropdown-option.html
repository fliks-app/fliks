<!-- `aria-current` is what the shared initial-focus rule looks for, so a menu
     opens on the current choice instead of at the top, and a screen reader
     announces it. The colour and the dot alone said it only visually. -->
<button
  type="button"
  class="dropdown-item"
  [class.text-primary]="selected()"
  [attr.aria-current]="selected() ? 'true' : null"
>
  @if (imageUrl()) {
    <img
      [cachedSrc]="imageUrl()! | resolveUrl:'thumb'"
      class="w-8 h-12 shrink-0 rounded object-cover bg-base-content/10"
      alt=""
      loading="lazy"
      decoding="async"
    />
  }
  <span class="flex-1 flex flex-col items-start gap-0 leading-tight text-left">
    <span>{{ head() }}</span>
    @if (sub()) {
      <span class="text-xs md:text-sm opacity-60">{{ sub() }}</span>
    }
  </span>
  @if (selected()) {
    <span class="h-2 w-2 rounded-full bg-primary shrink-0"></span>
  }
</button>
