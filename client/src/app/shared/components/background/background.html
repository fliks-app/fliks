<!-- Hidden below the `md` breakpoint so phones keep the existing inline
     `mobile-fanart-hero` and don't show a second image of the same
     fanart. Tablets (md+) get the global background. -->
<div class="fixed inset-0 -z-10 overflow-hidden pointer-events-none hidden md:block">
  @if (layerA()) {
    <img
      [src]="layerA()! | resolveUrl:'medium'"
      alt=""
      loading="eager"
      decoding="async"
      class="absolute inset-0 w-full h-full object-cover object-[50%_25%] transition-opacity duration-1500"
      [class.opacity-100]="activeLayer() === 'A' && imageVisible()"
      [class.opacity-0]="activeLayer() !== 'A' || !imageVisible()"
    />
  }
  @if (layerB()) {
    <img
      [src]="layerB()! | resolveUrl:'medium'"
      alt=""
      loading="eager"
      decoding="async"
      class="absolute inset-0 w-full h-full object-cover object-[50%_25%] transition-opacity duration-1500"
      [class.opacity-100]="activeLayer() === 'B' && imageVisible()"
      [class.opacity-0]="activeLayer() !== 'B' || !imageVisible()"
    />
  }
  <!-- Veil is permanent: when no background is set, the tint over
       the body's solid base-100 is a no-op (same colour); when an
       image is fading in/out beneath it, the tint stays constant
       so we never flash an un-tinted frame.
       Custom class (instead of Tailwind's `bg-base-100/N`) because
       Tailwind v4 emits `color-mix(in oklab, …)` for that helper,
       which Chromium 85 (Tizen TV) doesn't support — the preset-env
       fallback drops the alpha and the veil ends up 100% opaque,
       killing the fanart. Plain `rgba()` is universally supported. -->
  <div class="absolute inset-0 app-bg-veil"></div>
</div>
