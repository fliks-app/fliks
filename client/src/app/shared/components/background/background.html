<!-- Hidden below `md` so phones keep their inline `mobile-fanart-hero` instead of a second fanart image. -->
<div class="fixed inset-0 -z-10 overflow-hidden pointer-events-none hidden md:block">
  @for (url of layers(); track $index) {
    <img
      [cachedSrc]="url | resolveUrl:'medium'"
      alt=""
      loading="lazy"
      decoding="async"
      fetchpriority="low"
      (load)="onLoad($index, $event)"
      class="absolute inset-0 w-full h-full object-cover object-[50%_25%]"
      [class]="layerClass($index)"
    />
  }
  <!-- Permanent veil: a no-op over the solid base-100 and constant while an image fades. A custom class, not `bg-base-100/N`:
         Tailwind v4 emits `color-mix()`, which Chromium 85 (Tizen TV) drops, leaving the veil 100% opaque. -->
  <div class="absolute inset-0 z-30 app-bg-veil"></div>
</div>
