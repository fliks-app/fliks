<!-- Hidden below `md` so phones keep their inline `mobile-fanart-hero` instead of a second fanart image. -->
<div class="fixed inset-0 -z-10 overflow-hidden pointer-events-none hidden md:block">
  @for (layer of layers(); track $index) {
    <img
      [cachedSrc]="layer.url | resolveUrl:(layer.blur ? 'thumb' : 'medium')"
      alt=""
      loading="lazy"
      decoding="async"
      fetchpriority="low"
      (load)="onLoad($index, $event)"
      class="absolute inset-0 w-full h-full object-cover object-[50%_25%]"
      [class]="layerClass($index)"
      [style.filter]="layer.blur && !reduced ? 'blur(40px)' : null"
      [style.transform]="layer.blur && !reduced ? 'scale(1.15)' : null"
    />
  }
  <!-- Permanent veil: a no-op over the solid base-100 and constant while an image fades. A custom class, not `bg-base-100/N`:
         Tailwind v4 emits `color-mix()`, which Chromium 85 (Tizen TV) drops, leaving the veil 100% opaque. -->
  <div class="absolute inset-0 z-30 app-bg-veil" [class.app-bg-veil-off]="heroShown()"></div>
  <!-- Hero veil: the picture bright on the right, dark behind the text on the left and fading into the rows below. -->
  <div class="absolute inset-0 z-30 app-bg-hero-veil" [class.app-bg-hero-veil-on]="heroShown()" [attr.data-hero]="bg.hero()"></div>
</div>
