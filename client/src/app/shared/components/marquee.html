<div #box class="overflow-hidden whitespace-nowrap" [class.marquee-fade]="overflowing()">
  <span
    class="inline-flex"
    [class.marquee-run]="overflowing()"
    [style.--shift.px]="-(width() + gap)"
    [style.--duration.s]="(width() + gap) / 32"
  >
    <span #line class="inline-block"><ng-container *ngTemplateOutlet="content" /></span>
    @if (overflowing()) {
      <span class="inline-block" [style.padding-left.px]="gap" aria-hidden="true"><ng-container *ngTemplateOutlet="content" /></span>
    }
  </span>
</div>

<ng-template #content>{{ text() }}@if (secondary()) {<span class="font-normal opacity-60"> · {{ secondary() }}</span>}</ng-template>
