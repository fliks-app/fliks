@if (hasAnyContent()) {
  <app-detail-section [heading]="'media_info.details' | translate" persistKey="details" [defaultOpen]="false">
    @if (tagline()) {
      <p sectionLead class="italic text-base-content/70 text-lg mb-3">{{ tagline() }}</p>
    }

      <app-facts-grid [facts]="facts()" />
    @if (trailerKey()) {
      <button sectionTail type="button" class="btn btn-outline gap-2 mt-3" (click)="openTrailer()">
        <svg lucidePlay class="h-4 w-4"></svg>{{ 'discover.watch_trailer' | translate }}
      </button>
    }
  </app-detail-section>
}

<app-trailer-dialog #trailerDialog />
