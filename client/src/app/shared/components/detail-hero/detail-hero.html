@if (!desktopLayout()) {
  <app-mobile-fanart-hero class="block" [fanartUrl]="posterUrl()" [blur]="true" />
}

<div
  class="relative z-20 has-[.dropdown-open]:z-50 flex gap-4"
  [attr.data-hero-lead]="desktopLayout() ? null : ''"
  [class.-mt-24]="!desktopLayout()"
  [class.flex-col]="!desktopLayout()"
  [class.items-center]="!desktopLayout()"
  [class.lg:gap-10]="desktopLayout()"
  [class.gap-6]="desktopLayout()"
  [style.padding-top]="!desktopLayout() || !navbar.isHeroPage() || navbar.effectiveSidebarPinned() || tv.isTv() ? null : navbar.mobileNavbarVisible() ? 'calc(env(safe-area-inset-top, 0px) + 3rem)' : null"
>
  <app-hero-poster [url]="posterUrl()" [alt]="title()" [viewTransitionName]="viewTransitionName()" />

  <div class="min-w-0 self-stretch flex-1 flex flex-col gap-2 md:pt-2">
    <h1 class="text-3xl md:text-2xl lg:text-4xl font-bold tracking-tight">{{ title() }}</h1>
    <ng-content select="[heroMeta]" />

    <div appTvRow class="flex flex-wrap items-center gap-2 mt-4">
      <ng-content select="[heroActions]" />
      <button type="button" class="btn btn-ghost btn-circle" [class.text-error]="liked()" [attr.aria-label]="'likes.like' | translate" (click)="toggleLike()">
        <svg lucideHeart class="h-4 w-4" [attr.fill]="liked() ? 'currentColor' : 'none'"></svg>
      </button>
      <button type="button" class="btn btn-ghost btn-circle" [attr.aria-label]="'playlists.add_to_playlist' | translate" (click)="addToPlaylist()">
        <svg lucideListPlus class="h-4 w-4"></svg>
      </button>
      <button #more type="button" class="btn btn-ghost btn-circle" [attr.aria-label]="'common.more' | translate" (click)="openMenu(more)">
        <svg lucideEllipsisVertical class="h-5 w-5"></svg>
      </button>
    </div>

    <app-hero-progress class="block mt-2 max-w-md" [percent]="progressPercent()" [label]="progressLabel()" />

    @if (overview(); as text) {
      <app-synopsis class="mt-2" [text]="text" textClass="text-base-content/80 leading-relaxed" />
    }

    <ng-content />
  </div>
</div>

@if (media(); as m) {
  <app-media-library-dialog [media]="m" />
}
