<dialog
  #dialog
  class="modal"
  (keydown.arrowright)="go(index() + 1)"
  (keydown.arrowleft)="go(index() - 1)"
>
  <div class="modal-box w-11/12 max-w-4xl p-0 flex flex-col overflow-hidden">
    <app-modal-header flush>
      <div class="flex items-center gap-2">
        <svg lucideRocket class="h-5 w-5 text-primary"></svg>
        <h3 class="text-lg font-bold">{{ 'whats_new.title' | translate: { version } }}</h3>
      </div>
    </app-modal-header>

    <div
      #track
      class="flex min-h-0 overflow-x-auto snap-x snap-mandatory motion-safe:scroll-smooth py-6 [scrollbar-width:none] [&::-webkit-scrollbar]:hidden"
      (scroll)="onScroll(track)"
    >
      @for (slide of slides(); track $index) {
        <section class="w-full shrink-0 snap-center snap-always px-5 sm:px-6">
          @if (slide.image) {
            <img
              [src]="slide.image"
              [alt]="slide.alt"
              class="w-full aspect-video rounded-box object-cover bg-base-200"
            />
          }
          <h4 class="mt-5 text-xl font-bold">{{ slide.title }}</h4>
          <div class="changelog-md mt-1 opacity-75" [innerHTML]="slide.body | markdown"></div>
        </section>
      }
    </div>

    <app-modal-footer flush>
      <div class="flex w-full items-center justify-between gap-3">
        <button
          class="btn btn-ghost rounded-full px-5"
          [class.invisible]="index() === 0"
          (click)="go(index() - 1)"
        >
          {{ 'whats_new.previous' | translate }}
        </button>
        <div class="flex gap-2">
          @for (slide of slides(); track $index) {
            <button
              class="h-2 rounded-full transition-all"
              [class]="$index === index() ? 'w-6 bg-primary' : 'w-2 bg-base-content/40'"
              [attr.aria-label]="slide.title"
              [attr.aria-current]="$index === index()"
              (click)="go($index)"
            ></button>
          }
        </div>
        <button class="btn btn-primary rounded-full px-5 min-w-28" (click)="next()">
          {{ (index() === slides().length - 1 ? 'whats_new.done' : 'whats_new.next') | translate }}
        </button>
      </div>
    </app-modal-footer>
  </div>
  <form method="dialog" class="modal-backdrop">
    <button>{{ 'common.close' | translate }}</button>
  </form>
</dialog>
