<button
  type="button"
  class="flex w-fit max-w-[calc(100%+1rem)] items-center gap-2 -mx-2 -my-1 px-2 py-1 rounded-lg cursor-pointer text-lg font-bold text-left"
  [attr.aria-expanded]="open()"
  [title]="heading()"
  (click)="toggle()"
>
  <!-- text-left undoes the button's centred UA default, which only showed once a
       long heading wrapped; truncate keeps it on one line and the chevron beside it. -->
  <span class="truncate">{{ heading() }}</span>
  <svg
    lucideChevronDown
    class="h-4 w-4 shrink-0 opacity-60 transition-transform duration-200"
    [class.rotate-180]="open()"
    aria-hidden="true"
  ></svg>
</button>

<app-collapse [open]="open()">
  <div class="mt-3">
    <ng-content />
  </div>
</app-collapse>
