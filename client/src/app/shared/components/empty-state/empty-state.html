<div class="flex flex-col items-center gap-2 text-center py-12 px-4" data-testid="empty-state">
  <app-lucide-icon [name]="icon()" class="size-16 text-base-content/60" aria-hidden="true" />
  <h2 class="text-lg font-semibold">{{ title() }}</h2>
  @if (hint()) {
    <p class="text-sm text-base-content/60 max-w-md">{{ hint() }}</p>
  }
  <div class="flex flex-wrap justify-center gap-2 p-2 empty:hidden">
    <ng-content />
  </div>
</div>
