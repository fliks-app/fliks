<!-- While two layers overlap the scrim mask sits on the pair: masking each lets the outgoing picture paint through the incoming one's faded bottom. -->
<div class="relative -mx-4 -mt-4 hero-fanart-bleed" [class.hero-fanart-fade]="!!outgoing()">
  <!-- Keyed on the url so appImgFadeIn fades the new picture in; the name rides the image, not a wrapper (desktop morph pairs img with img). -->
  @for (url of incoming(); track url) {
    <img
      appImgFadeIn
      [instant]="!!outgoing()"
      [style.view-transition-name]="viewTransitionName()"
      [src]="url | resolveUrl: 'medium'"
      [alt]="imageAlt()"
      loading="eager"
      fetchpriority="high"
      (load)="onIncomingLoad()"
      [class.hero-fanart-fade]="!outgoing()"
      class="relative w-full min-h-[230px] h-[38svh] max-h-[53svh] landscape:min-h-0 landscape:h-auto landscape:max-h-[47vh] landscape:aspect-video object-cover object-[50%_25%]"
    />
  } @empty {
    <div
      class="w-full min-h-[230px] h-[38svh] max-h-[53svh] landscape:min-h-0 landscape:h-auto landscape:aspect-video landscape:max-h-[47vh] bg-base-300"
    ></div>
  }
  <!-- Outgoing picture held OVER the incoming one and faded once that loads: a fade on the incoming image is skipped for cached pictures. -->
  @if (outgoing(); as prev) {
    <img
      [src]="prev | resolveUrl: 'medium'"
      alt=""
      aria-hidden="true"
      [class.hero-swap-out]="fadingOut()"
      (animationend)="outgoing.set(null)"
      class="absolute inset-0 w-full h-full object-cover object-[50%_25%] pointer-events-none"
    />
  }
</div>
