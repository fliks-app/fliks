<div class="flex items-start justify-between gap-4 mb-4">
  @if (title()) {
    <h3 class="text-lg font-bold">{{ title() }}</h3>
  } @else {
    <ng-content />
  }
  <form method="dialog">
    <button
      class="btn btn-sm btn-circle btn-ghost shrink-0"
      [attr.aria-label]="'common.close' | translate"
    >
      ✕
    </button>
  </form>
</div>
