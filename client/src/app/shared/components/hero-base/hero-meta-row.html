@if (visible()) {
  <div class="flex flex-wrap items-center" [class.text-base-content/60]="!onPicture()" [class.text-base-content]="onPicture()" [style.text-shadow]="onPicture() ? 'var(--hero-text-shadow)' : null" [class.justify-center]="centered()" [class]="desktop() ? 'gap-x-4 gap-y-1 mt-3' : 'gap-x-3 gap-y-0.5 mt-2'">
    @if (rating()) {
      <span class="flex items-center text-warning font-semibold" [class]="desktop() ? 'gap-1' : 'gap-0.5'">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
        {{ rating()! | number:'1.1-1' }}
      </span>
    }
    @for (part of parts(); track $index) { <span>{{ part | translate }}</span> }
    @for (chip of chips(); track chip.label) { <span [class]="chip.cls">{{ chip.label | translate }}</span> }
  </div>
}
