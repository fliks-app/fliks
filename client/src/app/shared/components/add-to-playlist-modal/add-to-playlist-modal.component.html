<dialog #dialog class="modal">
  <div class="modal-box max-w-md">
    <app-modal-header [title]="'playlists.add_to_playlist_title' | translate" />

    @if (loading()) {
      <div class="flex justify-center py-8">
        <span class="loading loading-spinner loading-lg"></span>
      </div>
    } @else {
      @if (playlists().length) {
        <ul class="menu bg-base-200 rounded-box w-full mb-4">
          @for (p of playlists(); track p.id) {
            <li>
              <button
                type="button"
                [disabled]="busyId() !== null"
                (click)="addTo(p)"
              >
                @if (busyId() === p.id) {
                  <span class="loading loading-spinner loading-xs"></span>
                } @else {
                  <svg lucideListPlus class="h-5 w-5"></svg>
                }
                <span class="flex-1 text-left truncate">{{ p.name }}</span>
                <span class="badge badge-ghost">{{ p.itemCount }}</span>
              </button>
            </li>
          }
        </ul>
      } @else {
        <p class="text-base-content/60 text-sm mb-4">
          {{ 'playlists.empty' | translate }}
        </p>
      }

      <form class="flex gap-2" (ngSubmit)="createAndAdd()">
        <input
          type="text"
          class="input input-bordered input-sm flex-1"
          name="newName"
          [placeholder]="'playlists.new_placeholder' | translate"
          [ngModel]="newName()"
          (ngModelChange)="newName.set($event)"
        />
        <button
          type="submit"
          class="btn btn-primary btn-sm gap-1"
          [disabled]="creating() || !newName().trim()"
        >
          @if (creating()) {
            <span class="loading loading-spinner loading-xs"></span>
          } @else {
            <svg lucidePlus class="h-4 w-4"></svg>
          }
          {{ 'playlists.create' | translate }}
        </button>
      </form>

      <div class="modal-action">
        <button type="button" class="btn btn-sm" (click)="close()">
          {{ 'common.close' | translate }}
        </button>
      </div>
    }
  </div>
  <form method="dialog" class="modal-backdrop"><button tabindex="-1">close</button></form>
</dialog>
