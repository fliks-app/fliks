@if (errorText()) {
  <button
    type="button"
    class="link link-hover"
    (click)="open()"
  >
    <ng-container *ngTemplateOutlet="badgeOrLabel" />
  </button>
} @else {
  <ng-container *ngTemplateOutlet="badgeOrLabel" />
}

<ng-template #badgeOrLabel>
  @if (badgeClass(); as bc) {
    <span class="badge badge-sm" [class]="bc">{{ label() }}</span>
  } @else {
    {{ label() }}
  }
</ng-template>
