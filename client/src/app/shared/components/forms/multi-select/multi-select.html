<button
  #trigger
  type="button"
  class="select select-bordered select-sm w-full h-auto min-h-8 py-1 text-left flex items-center gap-1 flex-wrap"
  [disabled]="disabled()"
  (click)="toggleOpen()"
>
  @if (chips().length === 0) {
    <span class="text-base-content/50 truncate">{{ placeholder() }}</span>
  } @else {
    @for (opt of chips(); track opt.value) {
      <span class="badge badge-sm badge-primary gap-1 max-w-full">
        <span class="truncate">{{ opt.label }}</span>
        <!-- `mousedown` is where the trigger would take focus and paint its ring: a chip
             removal is not a visit to the field. -->
        <span
          role="button"
          tabindex="-1"
          class="hover:opacity-100"
          [class.cursor-pointer]="!disabled()"
          [class.opacity-70]="!disabled()"
          [class.opacity-40]="disabled()"
          [class.pointer-events-none]="disabled()"
          [attr.aria-disabled]="disabled() ? 'true' : null"
          (mousedown)="onChipMouseDown($event)"
          (click)="remove(opt.value, $event)"
          >✕</span
        >
      </span>
    }
    @if (overflowCount() > 0) {
      <span class="badge badge-sm badge-ghost">+{{ overflowCount() }}</span>
    }
  }
</button>

<app-popover-menu
  [open]="open()"
  [anchor]="anchor()"
  [width]="panelWidth()"
  placement="bottom-start"
  (closed)="open.set(false)"
>
  @if (showFilter()) {
    <!-- Pinned: the popover owns the scroll, so the filter would scroll away. Its background is
         the surface the popover reports, since a dropdown and a bottom sheet are not the same one. -->
    <div class="sticky top-0 z-10 pt-2 pb-1" style="background-color: var(--popover-surface, var(--color-base-200))">
      <input
        autofocus
        type="text"
        class="input input-bordered input-sm w-full"
        [placeholder]="'common.search' | translate"
        [ngModel]="query()"
        (ngModelChange)="query.set($event)"
      />
    </div>
  }
  <ul>
    @for (opt of filtered(); track opt.value) {
      <li>
        <label
          class="flex items-center gap-2 px-2 py-1.5 text-sm rounded hover:bg-base-300 cursor-pointer"
        >
          <input
            type="checkbox"
            class="checkbox checkbox-xs"
            [checked]="isPicked(opt.value)"
            (change)="toggleOption(opt.value)"
          />
          <span class="truncate" [title]="opt.label">{{ opt.label }}</span>
        </label>
      </li>
    } @empty {
      <li class="px-2 py-2 text-sm text-base-content/50 italic">—</li>
    }
  </ul>
</app-popover-menu>
