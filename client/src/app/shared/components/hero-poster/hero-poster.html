<div class="shrink-0 rounded-xl overflow-hidden"
     [class.w-[140px]]="mode() === 'poster'"
     [class.lg:w-[200px]]="mode() === 'poster'"
     [class.xl:w-[220px]]="mode() === 'poster'"
     [class.2xl:w-[280px]]="mode() === 'poster'"
     [class.w-[28%]]="mode() === 'still'"
     [class.3xl:w-[22%]]="mode() === 'still'">
  @if (url()) {
    <img
      appImgFadeIn
      [cachedSrc]="url()! | resolveUrl:(mode() === 'still' ? 'thumb' : 'medium')" [alt]="alt()"
      loading="eager" fetchpriority="high" decoding="async"
      [appSpoiler]="spoiler()"
      #posterSpoiler="spoiler"
      [revealLabel]="'spoilers.reveal' | translate"
      [class.scale-110]="posterSpoiler.masked()"
      class="w-full rounded-xl object-cover bg-base-300"
      [class.aspect-2/3]="mode() === 'poster'"
      [class.aspect-video]="mode() === 'still'"
      [style.view-transition-name]="viewTransitionName()"
    />
  } @else {
    <div
      class="rounded-xl bg-base-300 flex items-center justify-center text-base-content/30"
      [class.aspect-2/3]="mode() === 'poster'"
      [class.aspect-video]="mode() === 'still'"
    >
      @if (bookLike()) {
        <svg lucideBookOpen class="h-20 w-20" [strokeWidth]="1.5"></svg>
      } @else {
        <svg lucideFilm class="h-20 w-20" [strokeWidth]="1.5"></svg>
      }
    </div>
  }
</div>
