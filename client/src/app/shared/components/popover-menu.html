<!-- Projected content is captured in a template ref: ng-content inside @if doesn't project into both branches. -->
<ng-template #content><ng-content></ng-content></ng-template>

@if (open() && useDropdown()) {
  <!-- Transparent click-out backdrop; preventing pointerdown keeps the opener from blurring first, which flickers its focus ring. -->
  <div
    class="fixed inset-0 z-[100]"
    (pointerdown)="$event.preventDefault()"
    (click)="close()"
  ></div>
  <div
    data-tv-modal
    [attr.data-tv-submenu]="submenu() ? '' : null"
    (focusout)="onSubmenuFocusOut($event)"
    animate.leave="popover-pop-leaving"
    style="--popover-surface: var(--color-base-200)"
    class="popover-pop-in fixed z-[101] bg-base-200 rounded-box shadow-xl overflow-y-auto p-2 [scroll-padding:0.5rem] [scroll-behavior:smooth]"
    [style.top.px]="position().top"
    [style.bottom.px]="position().bottom"
    [style.left.px]="position().left"
    [style.min-width.px]="position().width"
    [style.max-height.px]="position().maxHeight"
  >
    @if (heading()) {
      <div class="menu-heading px-2 text-base-content/60">{{ heading() }}</div>
    }
    <ng-container *ngTemplateOutlet="content"></ng-container>
  </div>
}
@if (!useDropdown()) {
  <!-- Kept mounted so [open]->false plays the slide-down exit; the sheet gates <ng-content> itself, so content is instantiated only while visible. -->
  <app-bottom-sheet [open]="open()" [heading]="heading()" (closed)="close()">
    <div
      data-tv-modal
      [attr.data-tv-submenu]="submenu() ? '' : null"
      (focusout)="onSubmenuFocusOut($event)"
      style="--popover-surface: var(--color-neutral)"
      class="px-2 pb-2"
    >
      <ng-container *ngTemplateOutlet="content"></ng-container>
    </div>
  </app-bottom-sheet>
}
