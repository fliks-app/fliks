<dialog #dialog class="modal" role="dialog" aria-modal="true" (close)="onDialogClose()">
  <div class="modal-box">
    <app-modal-header [title]="title()" />
    <p class="py-4 whitespace-pre-line">{{ message() }}</p>
    @if (toggleLabel(); as tl) {
      <label class="label cursor-pointer items-start justify-start gap-3 pb-4">
        <input
          type="checkbox"
          class="checkbox checkbox-sm mt-0.5 shrink-0"
          [checked]="confirmService.toggle()"
          (change)="confirmService.toggle.set($any($event.target).checked)"
        />
        <span class="flex flex-col gap-0.5">
          <span class="label-text">{{ tl }}</span>
          @if (toggleHint(); as th) {
            <span class="text-sm text-base-content/60">{{ th }}</span>
          }
        </span>
      </label>
    }
    <app-modal-footer>
      @if (dismissLabel(); as dl) {
        <button class="btn btn-ghost" (click)="confirmService.dismiss()">{{ dl }}</button>
      }
      @if (!alertOnly()) {
        <button class="btn" (click)="confirmService.cancel()">
          {{ cancelLabel() }}
        </button>
      }
      <button class="btn" [class]="confirmBtnClass()" (click)="confirmService.accept()">
        {{ alertOnly() ? ('common.ok' | translate) : confirmLabel() }}
      </button>
    </app-modal-footer>
  </div>
  <form method="dialog" class="modal-backdrop">
    <button
      type="button"
      (click)="dismissLabel() ? confirmService.dismiss() : confirmService.cancel()"
      [attr.aria-label]="'common.close' | translate"
    >
      {{ 'common.close' | translate }}
    </button>
  </form>
</dialog>
