@if (auto.enabled) {
  <label class="flex items-center gap-2 text-sm">
    <span class="text-base-content/70">{{ 'downloads.auto_rule' | translate }}</span>
    <select class="select select-bordered select-sm w-auto" [value]="auto.seriesKeep(seriesId()) ?? 0" (change)="change($any($event.target).value)">
      <option value="0">{{ 'downloads.auto_off' | translate }}</option>
      @for (n of auto.KEEP_OPTIONS; track n) {
        <option [value]="n">{{ 'downloads.auto_next' | translate: { count: n } }}</option>
      }
    </select>
  </label>
}
