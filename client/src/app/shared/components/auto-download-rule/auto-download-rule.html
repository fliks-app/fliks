@if (auto.enabled) {
  <div class="flex items-center gap-2 text-sm">
    <span class="text-base-content/70">{{ 'downloads.auto_rule' | translate }}</span>
    <app-dropdown-menu placement="bottom-start">
      <button trigger type="button" class="select select-bordered select-sm w-fit text-left cursor-pointer">
        {{ label(auto.seriesKeep(seriesId()) ?? 0) }}
      </button>
      @for (n of options; track n) {
        <app-dropdown-option [head]="label(n)" [selected]="n === (auto.seriesKeep(seriesId()) ?? 0)" (click)="change(n)" />
      }
    </app-dropdown-menu>
  </div>
}
