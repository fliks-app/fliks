@if (output(); as o) {
  <div class="fixed inset-x-2 lg:inset-x-auto lg:right-4 lg:w-[27rem] z-40 flex items-center gap-1 rounded-box border border-base-300 bg-base-200/95 backdrop-blur-sm p-1 pr-2 shadow-xl"
       style="bottom: max(var(--chrome-bottom, 1rem), env(safe-area-inset-bottom, 0px))">
    <button type="button" class="flex min-w-0 flex-1 cursor-pointer items-center gap-3 rounded-box p-1 text-left disabled:cursor-default"
            [disabled]="!session.playing()" [attr.aria-label]="'remote.open_player' | translate" (click)="open()">
      <div class="h-12 w-12 shrink-0 overflow-hidden rounded-lg bg-base-300" [class.skeleton]="!o.isIdle() && !session.nowPlaying()">
        @if (artwork(); as art) {
          <img [cachedSrc]="art | resolveUrl:'thumb'" alt="" class="h-full w-full object-cover" />
        }
      </div>
      <span class="min-w-0">
        <span class="block truncate text-sm font-semibold">
          {{ o.isIdle() ? ('remote.idle_message' | translate) : session.nowPlaying()?.title }}
        </span>
        <span class="block truncate text-xs text-base-content/60">{{ session.deviceName() }}</span>
      </span>
    </button>
    @if (!o.isIdle() && !o.targetOffline()) {
      <button type="button" class="btn btn-ghost btn-circle" (click)="togglePlay()"
              [attr.aria-label]="(o.uiPaused() ? 'player.play' : 'player.pause') | translate">
        @if (o.uiPaused()) {
          <svg lucidePlay class="h-5 w-5"></svg>
        } @else {
          <svg lucidePause class="h-5 w-5"></svg>
        }
      </button>
    }
    <button type="button" class="btn btn-ghost btn-circle" (click)="o.disconnect()"
            [attr.aria-label]="'remote.disconnect_row' | translate">
      <svg lucideX class="h-5 w-5"></svg>
    </button>
  </div>
}
