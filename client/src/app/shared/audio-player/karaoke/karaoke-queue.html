@if (party.upNext().length) {
  <section class="flex flex-col gap-2 rounded-lg bg-base-200 p-3" data-testid="karaoke-queue" [attr.aria-label]="'karaoke.queue_title' | translate">
    <h3 class="font-medium" [class.text-xl]="tv()">{{ 'karaoke.queue_title' | translate }}</h3>
    <ol class="flex flex-col gap-1" data-testid="karaoke-queue-list">
      @for (r of party.upNext(); track r.itemId) {
        <li class="flex items-baseline gap-2" [class.text-lg]="tv()" data-testid="karaoke-queue-item">
          <span class="truncate font-medium">{{ r.title }}</span>
          <span class="shrink-0 text-sm text-base-content/60" data-testid="karaoke-queue-singer">{{ party.userName(r.addedBy) }}</span>
        </li>
      }
    </ol>
  </section>
}
