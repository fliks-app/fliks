<div
  #scroller
  class="scroll-ring-safe relative flex h-full flex-col gap-3 short:gap-0 [mask-image:linear-gradient(to_bottom,transparent,#000_8%,#000_92%,transparent)] tv:[mask-image:linear-gradient(to_bottom,transparent,#000_15%,#000_85%,transparent)]"
  [class.overflow-y-auto]="!large() && !tv()"
  [class.overflow-hidden]="large() || tv()"
  appTvSection
  data-testid="lyrics-lines"
  (wheel)="onManualScroll()"
  (touchmove)="onManualScroll()"
>
  <div class="h-[45%] shrink-0" aria-hidden="true"></div>
  @for (r of rows(); track $index; let i = $index) {
    <div [attr.data-line]="i" [class.mt-6]="!r.text">
      <button
        type="button"
        class="block w-full rounded-lg px-2 py-1 text-left short:py-0 transition-opacity disabled:cursor-default"
        [class]="(bgAgents().has(r.agentId ?? '') ? (large() ? ' text-xl' : ' text-base') : tv() ? ' text-[2.5rem]/tight font-bold' : ' text-2xl font-bold sm:text-4xl compact:sm:text-2xl short:text-xl short:sm:text-xl') + ' ' + rowOpacity(i, r)"
        [attr.aria-current]="activeSet().has(i) ? 'true' : null"
        [disabled]="!timed() || !seekable() || tv()"
        [style.color]="style(r.agentId)?.colour"
        (click)="seekTo(i)"
      >
        <span class="flex items-baseline gap-2">
          @if (style(r.agentId); as st) {
            <span class="w-[1.6em] shrink-0 whitespace-nowrap" aria-hidden="true" data-testid="lyrics-mark">{{ st.mark }}</span>
            <span class="sr-only">{{ (st.n ? 'karaoke.singer_n' : 'karaoke.singer_both') | translate: { n: st.n } }}</span>
          } @else if (duet()) {
            <span class="w-[1.6em] shrink-0" aria-hidden="true"></span>
          }
          <span class="min-w-0">
            @if (segments()[i]; as segs) {
              @for (s of segs; track $index) {
                @if (s.cue === null) {
                  <span class="whitespace-pre-wrap" [class.opacity-40]="!staged(r) && !gapLit(i, s.prev)">{{ s.text }}</span>
                } @else if (s.dim) {
                  <span class="opacity-40" data-testid="lyrics-guessed" [attr.data-cue]="s.cue">{{ s.text }}</span>
                } @else {
                  <span [class]="sweepOf(i, r)" data-testid="lyrics-sweep" [attr.data-cue]="s.cue" [style.--p]="wipe(i, s.cue)">{{ s.text }}</span>
                }
              }
            } @else {
              {{ r.text }}
            }
          </span>
        </span>
      </button>
      @if (layerRows(); as lr) {
        <p class="px-2 text-base text-base-content/60" [class.text-xl]="large()" data-testid="lyrics-layer">{{ lr[i]?.text }}</p>
      }
    </div>
  }
  <div class="h-[45%] shrink-0" aria-hidden="true"></div>
</div>
