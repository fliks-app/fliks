<ng-template #bar>
<div
  appTvRow
  animate.enter="mini-player-in"
  animate.leave="mini-player-out"
  class="flex items-center rounded-box border border-base-300 bg-base-200/95 transition-colors duration-300"
  [class]="docked() ? 'rail-bar relative gap-1 p-1' : 'fixed inset-x-2 z-40 gap-1 p-1 pb-1.5 pr-2 shadow-xl backdrop-blur-sm lg:inset-x-auto lg:right-4 lg:w-[27rem]'"
  [style.display]="visible() ? null : 'none'"
  [style.bottom]="docked() ? null : raised() ? 'calc(max(var(--chrome-bottom, 1rem), env(safe-area-inset-bottom, 0px)) + 4.25rem)' : 'max(var(--chrome-bottom, 1rem), env(safe-area-inset-bottom, 0px))'"
  [style.background-color]="tint()"
  [style.border-color]="tint()"
  [style.--color-base-content]="tint() ? 'oklch(97% 0 0)' : null"
  [class.opacity-60]="busy()"
  [attr.aria-busy]="busy() || null"
  [attr.data-player-bar]="opens()"
>
  <button type="button" class="flex min-w-0 flex-1 items-center rounded-box px-1 text-left disabled:cursor-default" [class]="docked() ? 'self-stretch' : 'gap-3 py-1'" [disabled]="openDisabled()" [attr.aria-label]="openLabel() || null" (click)="opened.emit()">
    <div [class.rail-ring]="docked() && percent() !== null" [style.--p]="percent()" class="shrink-0">
      <div data-morph="cover" class="relative h-10 w-10 flex shrink-0 items-center justify-center overflow-hidden rounded-md bg-base-300 text-base-content/20">
        <ng-content select="[barCover]" />
      </div>
    </div>
    <span class="min-w-0 flex-1" [class]="docked() ? 'rail-reveal rail-text' : 'contents'">
      <ng-content />
    </span>
  </button>
  <!-- D-pad: the whole bar is one focus stop; the remote's play key covers the toggle. -->
  @if (playing() !== null && !dpad) {
    <button type="button" class="btn btn-ghost btn-circle" [class.rail-reveal]="docked()" data-morph="toggle" [attr.aria-label]="(playing() ? 'player.pause' : 'player.play') | translate" (click)="toggled.emit()">
      @if (playing()) {
        <svg [lucideIcon]="icons.Pause" class="h-5 w-5"></svg>
      } @else {
        <svg [lucideIcon]="icons.Play" class="h-5 w-5"></svg>
      }
    </button>
  }
  @if (!dpad) {
    <span [class]="docked() ? 'rail-reveal flex items-center' : 'contents'">
      <ng-content select="[barActions]" />
    </span>
  }
  @if (percent() !== null && !docked()) {
    <div class="pointer-events-none absolute inset-x-3 -bottom-px h-[3px] overflow-hidden rounded-full bg-base-content/15" aria-hidden="true" data-testid="player-bar-progress">
      <div class="h-full rounded-full bg-base-content transition-[width] duration-300 ease-linear" [style.width.%]="percent()"></div>
    </div>
  }
</div>
</ng-template>
@if (!docked()) {
  <ng-container [ngTemplateOutlet]="bar" />
}
