apply plugin: 'com.android.application'

// Dev-only Cast receiver app ID from the repo's .env.local; release keeps the strings.xml one.
def castAppId = file('../../../.env.local').with {
    it.exists() ? it.readLines().findResult { l -> l.startsWith('FLIKS_CAST_APP_ID=') ? l.substring(18).trim().replaceAll(/^(['"])(.*)\1$/, '$2') : null } : null
}

// MMmmppNN from M.m.p[-pre.N]: NN is N for a prerelease, 99 for the release, so codes rise with versions.
// Derived from the source, not CI, so F-Droid rebuilds the same code.
static int versionCodeOf(String name) {
    def m = name =~ /^(\d+)\.(\d+)\.(\d+)(?:-[0-9A-Za-z]+\.(\d+))?$/
    if (!m.matches()) throw new GradleException("versionName ${name} is not M.m.p or M.m.p-pre.N")
    def (major, minor, patch) = (1..3).collect { m.group(it) as int }
    def pre = m.group(4) == null ? 99 : (m.group(4) as int)
    if (minor > 99 || patch > 99 || (m.group(4) != null && pre > 98)) throw new GradleException("versionName ${name} overflows the versionCode")
    return major * 1_000_000 + minor * 10_000 + patch * 100 + pre
}

android {
    namespace "media.fliks.app"
    buildFeatures { buildConfig true; resValues true }
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "media.fliks.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionName "7.2.1" // x-release-please-version
        versionCode = versionCodeOf(versionName)
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Signing config sourced from Gradle properties so the workflow
    // never writes secrets to disk. Only resolved when the keystore
    // file actually exists — local debug builds (no fliks-upload.jks
    // checked out) skip the release signing block entirely.
    // libre: no Google Play Services or Firebase, for F-Droid.
    flavorDimensions = ["variant"]
    productFlavors {
        proprietary {
            dimension "variant"
            isDefault = true
        }
        libre {
            dimension "variant"
        }
    }
    signingConfigs {
        release {
            def keystoreFile = file('fliks-upload.jks')
            if (keystoreFile.exists()) {
                storeFile keystoreFile
                storePassword = (project.findProperty('FLIKS_KEYSTORE_PASSWORD') ?: '')
                keyAlias = (project.findProperty('FLIKS_KEY_ALIAS') ?: '')
                keyPassword = (project.findProperty('FLIKS_KEY_PASSWORD') ?: '')
            }
        }
    }
    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            if (castAppId) {
                resValue "string", "cast_receiver_app_id", castAppId
            }
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Apply release signing only when the keystore file is
            // present — keeps `./gradlew assembleDebug` and any local
            // contributor build working out of the box.
            if (file('fliks-upload.jks').exists()) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

configurations.all {
    resolutionStrategy {
        force 'org.jetbrains.kotlin:kotlin-stdlib:2.4.21'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:2.4.21'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:2.4.21'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.activity:activity:$androidxActivityVersion"
    implementation "androidx.browser:browser:$androidxBrowserVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    testImplementation 'org.json:json:20260814'
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
    proprietaryImplementation 'com.google.android.gms:play-services-cast-framework:23.0.0'
    proprietaryImplementation 'androidx.mediarouter:mediarouter:1.9.0'
    // FCM only: no analytics library, auto-init is off in the manifest.
    proprietaryImplementation 'com.google.firebase:firebase-messaging:26.0.2'
    // ExoPlayer (Media3) for native HLS playback
    implementation 'androidx.media3:media3-exoplayer:1.10.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.10.1'
    implementation 'androidx.media3:media3-datasource:1.10.1'
    implementation 'androidx.media3:media3-ui:1.10.1'
    implementation 'androidx.media3:media3-session:1.10.1'
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
        // The debug app id has no Firebase client: debug builds skip FCM instead of failing.
        tasks.configureEach { if (it.name ==~ /process\w*DebugGoogleServices/) it.enabled = false }
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
