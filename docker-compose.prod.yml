services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: fliks
      POSTGRES_PASSWORD: ${DB_PASSWORD:-fliks}
      POSTGRES_DB: fliks
    volumes:
      - fliks_pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  fliks:
    image: ghcr.io/clementdelestre/fliks:v1.0.0
    ports:
      - "3000:3000"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: fliks
      DB_PASSWORD: ${DB_PASSWORD:-fliks}
      DB_NAME: fliks
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
    volumes:
      - /path/to/downloads:/downloads
      - /path/to/medias:/medias
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "992"  # render group for Intel GPU
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  fliks_pgdata:
