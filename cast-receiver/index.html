<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Release-please bumps the content on each release. Visible in the
       receiver's HTML for quick "what version is on the device?" checks
       via the Cast Console remote DevTools. -->
  <meta name="version" content="5.1.1"> <!-- x-release-please-version -->
  <title>Fliks Cast</title>
  <!--
    Cast receiver shell for Fliks. Hosted on a fixed URL so a single
    Cast Console app ID covers every Fliks user — the receiver is
    user-agnostic and just plays whatever stream URL the sender pushes
    via standard MediaInformation. The user's NAS authenticates by
    token, already inlined in the stream URL by the sender.
  -->
  <link rel="stylesheet" href="receiver.css">
  <!-- Preload the splash logo so the browser starts fetching + decoding
       it before the SDK script blocks parsing. The SVG renders the
       gradient mark crisply at any density with no raster decode jitter. -->
  <link rel="preload" as="image" href="fliks-icon.svg">
  <!-- CAF Receiver SDK. Loaded synchronously so cast.framework is
       available before our boot script runs. -->
  <script src="//www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
</head>
<body>
  <!-- Idle / splash overlay. Hidden by CAF once a stream loads, shown
       again on STOP. The image and copy are pure brand chrome — no
       per-user state. -->
  <div id="splash" class="splash">
    <img src="fliks-icon.svg" alt="Fliks" class="splash-logo" decoding="async">
    <div class="splash-tagline">Fliks</div>
  </div>

  <!-- The CAST_FRAMEWORK creates the <video> element on demand inside
       <cast-media-player>. We wrap it in a container only to layer the
       splash above it on idle. -->
  <cast-media-player id="player"></cast-media-player>

  <div id="edl-notice" class="edl-notice" role="status"></div>

  <div id="skip-cue" class="skip-cue" role="status"></div>

  <!-- Progress bar driven by PlayerDataBinder; replaces the default overlay of <cast-media-player>. -->
  <div id="bar" class="bar" aria-hidden="true">
    <div class="bar-title"></div>
    <div class="bar-subtitle"></div>
    <div class="bar-track">
      <div class="bar-buffered"></div>
      <div class="bar-bands"></div>
      <div class="bar-played"></div>
    </div>
    <div class="bar-times">
      <span class="bar-time bar-elapsed">0:00</span>
      <span class="bar-time bar-total">0:00</span>
    </div>
  </div>

  <!-- Party reactions and chat bubbles, relayed by a sender; filled by receiver.js. -->
  <div id="party-layer" class="party-layer" aria-hidden="true">
    <div class="party-reactions"></div>
    <div class="party-bubbles"></div>
  </div>

  <script src="edl.js"></script>
  <script src="cues.js"></script>
  <script src="receiver.js"></script>
</body>
</html>
