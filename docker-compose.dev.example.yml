# Dev stack: fliks-server (Rust) + Angular in watch mode on the mounted sources.
# Copy to `docker-compose.yml` (gitignored), point the media paths at your own
# library, then `docker compose up` → UI on http://localhost:4500.
# The client's npm dependencies live in its image, above the bind-mounted sources:
# `docker compose build client` after a package.json change.
# The engine is the front door (:3000, --upstream server:3001), as in production; server has no published port.
# The engine runs from the checkout at ${FLIKS_ENGINE_SRC:-../fliks-engine} (cargo watch); first build takes minutes.

services:
  engine:
    build:
      context: .
      target: engine-dev
    working_dir: /engine
    command: >
      cargo watch -w crates -x 'run --bin fliks-engine -- --listen 0.0.0.0:7400 --public-listen 0.0.0.0:3000 --upstream http://server:3001'
    environment:
      FLIKS_ENGINE_TOKEN: dev-engine-token
      CARGO_TARGET_DIR: /cargo-target
      XDG_CACHE_HOME: /tmp
    # Uncomment for Intel QSV/VAAPI. The render device is root:render, so a
    # non-root container user also needs the group_add line or the probe fails
    # and transcodes fall back to CPU. Your gid: `getent group render | cut -d: -f3`.
    # devices:
    #   - /dev/dri:/dev/dri
    # group_add: ['${FLIKS_RENDER_GID:-990}']
    ports:
      - '3000:3000'
    healthcheck:
      # Any HTTP status counts: /v1/hello answers 401 without the token.
      test: ['CMD-SHELL', 'curl -s -o /dev/null http://localhost:7400/v1/hello']
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 15m
    volumes:
      - ${FLIKS_ENGINE_SRC:-../fliks-engine}:/engine
      - engine-target:/cargo-target
      - engine-registry:/usr/local/cargo/registry
      # Engine reads media by path: same mount as the server.
      - ./.dev/medias:/medias

  server:
    build:
      context: .
      target: server-dev
    depends_on:
      postgres:
        condition: service_healthy
      engine:
        condition: service_healthy
    working_dir: /src/server
    # Files it writes under ./.dev/data stay yours; volumes made before this line was added are
    # root-owned: `docker compose down -v` once.
    user: '${FLIKS_UID:-1000}:${FLIKS_GID:-1000}'
    command: cargo watch -x 'run -p fliks-server'
    environment:
      PORT: 3001
      FLIKS_CAST_DIR: /src/server/public
      FLIKS_ENGINE_URL: http://engine:7400
      FLIKS_ENGINE_TOKEN: dev-engine-token
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: fliks
      DB_PASSWORD: password
      DB_NAME: fliks
      JWT_SECRET: dev-secret
      CORS_ORIGIN: http://localhost:4500
      CARGO_BUILD_JOBS: 4
      CARGO_TARGET_DIR: /cargo-target
      SQLX_OFFLINE: 'true'
      # TMDB_API_KEY: ''
      # TVDB_API_KEY: ''
      FLIKS_DATA_DIR: /src/data
    volumes:
      - ./server:/src/server
      - ./.dev/downloads:/downloads
      - ./.dev/medias:/medias
      - ./.dev/data:/src/data
      - server-target:/cargo-target
      - server-registry:/usr/local/cargo/registry

  client:
    build:
      context: ./client
      dockerfile: Dockerfile.dev
    working_dir: /src/client
    user: '${FLIKS_UID:-1000}:${FLIKS_GID:-1000}'
    command: npm run start:docker
    ports:
      - '4500:4500'
    tmpfs:
      - /src/client/node_modules
    volumes:
      - ./client:/src/client

  postgres:
    image: postgres:18.3-alpine
    environment:
      POSTGRES_DB: fliks
      POSTGRES_PASSWORD: password
      POSTGRES_USER: fliks
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U fliks']
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres:/var/lib/postgresql/18/docker

volumes:
  postgres:
  engine-target:
  engine-registry:
  server-target:
  server-registry:
