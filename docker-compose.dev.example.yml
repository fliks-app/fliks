# Dev stack: NestJS + Angular in watch mode on the mounted sources.
# Copy to `docker-compose.yml` (gitignored), point the media paths at your own
# library, then `docker compose up` → UI on http://localhost:4500.
# node_modules live in the images at /src, above the bind-mounted sources:
# `docker compose build` after any package.json change.
# The engine runs from the checkout at ${FLIKS_ENGINE_SRC:-../fliks-engine} (cargo watch); first build takes minutes.

services:
  backend:
    build:
      context: .
      target: dev
    depends_on:
      postgres:
        condition: service_healthy
      engine:
        condition: service_healthy
    # Uncomment for Intel QSV/VAAPI. The render node is root:render and the
    # non-root user below is not in that group, so both lines are needed or the
    # probe fails and transcodes fall back to CPU.
    # Your gid: `getent group render | cut -d: -f3`.
    # devices:
    #   - /dev/dri:/dev/dri
    # group_add: ['${FLIKS_RENDER_GID:-990}']
    working_dir: /src/backend
    # Build output lands in the mounted sources (backend/dist, client/.angular);
    # as root it would make the host's own build fail on EACCES.
    user: '${FLIKS_UID:-1000}:${FLIKS_GID:-1000}'
    command: npm run start:dev
    environment:
      NODE_ENV: development
      PORT: 3000
      CORS_ORIGIN: http://localhost:4500
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: fliks
      DB_PASSWORD: password
      DB_NAME: fliks
      JWT_SECRET: dev-secret
      FLIKS_ENGINE_URL: http://engine:7400
      FLIKS_ENGINE_TOKEN: dev-engine-token
      # TMDB_API_KEY: ''
      # TVDB_API_KEY: ''
      # Throwaway cache, container-only: /src is root-owned in the image, so the
      # non-root user it runs as needs a path it can actually write.
      FLIKS_TRANSCODE_DIR: /tmp/transcode
      FLIKS_DATA_DIR: /src/data
    ports:
      - '3000:3000'
    # Keeps the host's own node_modules out of the container.
    tmpfs:
      - /src/backend/node_modules
    volumes:
      - ./backend:/src/backend
      - ./.dev/downloads:/downloads
      - ./.dev/medias:/medias
      - ./.dev/data:/src/data

  engine:
    build:
      context: .
      target: engine-dev
    working_dir: /engine
    command: >
      cargo watch -w crates -x 'run --bin fliks-engine -- --listen 0.0.0.0:7400'
    environment:
      FLIKS_ENGINE_TOKEN: dev-engine-token
      CARGO_TARGET_DIR: /cargo-target
      XDG_CACHE_HOME: /tmp
    # Same QSV/VAAPI block as the backend.
    # devices:
    #   - /dev/dri:/dev/dri
    # group_add: ['${FLIKS_RENDER_GID:-990}']
    healthcheck:
      # Any HTTP status counts: /v1/hello answers 401 without the token.
      test: ['CMD-SHELL', 'curl -s -o /dev/null http://localhost:7400/v1/hello']
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 15m
    volumes:
      - ${FLIKS_ENGINE_SRC:-../fliks-engine}:/engine
      - engine-target:/cargo-target
      - engine-registry:/usr/local/cargo/registry
      # Engine reads media by path: same mount as the backend.
      - ./.dev/medias:/medias

  client:
    build:
      context: ./client
      dockerfile: Dockerfile.dev
    working_dir: /src/client
    user: '${FLIKS_UID:-1000}:${FLIKS_GID:-1000}'
    command: npm run start:docker
    ports:
      - '4500:4500'
    tmpfs:
      - /src/client/node_modules
    volumes:
      - ./client:/src/client
      # client/tsconfig.json resolves @fliks/plugin-contract/ui from ../backend.
      - ./backend/src/common/plugin-contract:/src/backend/src/common/plugin-contract:ro

  postgres:
    image: postgres:18.3-alpine
    environment:
      POSTGRES_DB: fliks
      POSTGRES_PASSWORD: password
      POSTGRES_USER: fliks
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U fliks']
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres:/var/lib/postgresql/18/docker

volumes:
  postgres:
  engine-target:
  engine-registry:
