name: Fliks
options:
  bundleIdPrefix: app.fliks
  deploymentTarget:
    macOS: "13.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    MACOSX_DEPLOYMENT_TARGET: "13.0"

targets:
  Fliks:
    type: application
    platform: macOS
    sources:
      - path: Fliks
        excludes:
          - "*.entitlements"
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.fliks.macos
        INFOPLIST_FILE: Fliks/Info.plist
        CODE_SIGN_ENTITLEMENTS: Fliks/Fliks.entitlements
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: false
        LD_RUNPATH_SEARCH_PATHS:
          - "@executable_path/../Frameworks"
        # No dock icon — menu bar only
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
    entitlements:
      path: Fliks/Fliks.entitlements
      properties: {}

