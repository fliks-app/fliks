[workspace]
resolver = "3"
members = [".", "examples/*"]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"

[package]
name = "fliks-plugin-sdk"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Guest SDK for Fliks plugins (pluginApi 2, wasm32-wasip2)"

[dependencies]
wit-bindgen = "=0.62.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fliks-plugin-route = { path = "../plugin-route" }
# Pinned: wasip2's WASI minor must stay the world's (0.2.12), or the component imports drift.
wasip2 = "=1.0.4"
wstd = { version = "=0.6.8", default-features = false }
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }

[features]
# Native tooling for plugin repositories (build/package/verify, component tests); a wasm32 build
# of the SDK never includes it.
build = ["dep:fliks-server", "dep:wit-parser", "dep:ed25519-dalek", "dep:base64"]
harness = [
  "build",
  "fliks-server/parity",
  "dep:tokio",
  "dep:tokio-rustls",
  "dep:axum",
  "dep:tower",
  "dep:sqlx",
  "dep:tracing-subscriber",
]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
fliks-server = { path = "../server", optional = true }
wit-parser = { version = "0.259", optional = true }
ed25519-dalek = { version = "2", optional = true }
base64 = { version = "0.22", optional = true }
tokio = { version = "1", features = ["net", "rt", "time"], optional = true }
axum = { version = "0.8", default-features = false, optional = true }
tower = { version = "0.5", features = ["util"], optional = true }
tokio-rustls = { version = "0.26", default-features = false, optional = true }
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio"], optional = true }
tracing-subscriber = { version = "0.3", optional = true }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

# The download-plugin-sized stand-in: big code, so no LTO.
[profile.big]
inherits = "release"
opt-level = 1
lto = false
codegen-units = 16
