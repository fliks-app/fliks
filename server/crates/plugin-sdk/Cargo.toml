[workspace]
resolver = "3"
members = [".", "examples/*"]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"

[package]
name = "fliks-plugin-sdk"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Guest SDK for Fliks plugins (pluginApi 2, wasm32-wasip2)"

[dependencies]
wit-bindgen = "=0.62.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fliks_domain = { path = "../domain" }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

# The download-plugin-sized stand-in: big code, so no LTO.
[profile.big]
inherits = "release"
opt-level = 1
lto = false
codegen-units = 16
