[package]
name = "fixture-provider"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
fliks-plugin-sdk = { path = "../.." }
fliks-plugin-sdk-provider = { path = "../../provider" }
serde_json = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
fliks-plugin-sdk = { path = "../..", features = ["build"] }
