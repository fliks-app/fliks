[package]
name = "fliks-server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "fliks-server"
path = "src/main.rs"

[dependencies]
axum = "0.8"
chrono.workspace = true
httpdate = "1"
serde.workspace = true
serde_json.workspace = true
tower-http = { version = "0.6", features = ["cors", "fs", "trace"] }
tracing = "0.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio", "macros", "json", "chrono", "migrate"] }
fliks-engine-core = { git = "https://github.com/fliks-app/engine", tag = "v0.3.1" }
fliks-engine = { git = "https://github.com/fliks-app/engine", tag = "v0.3.1" }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart"] }
tokio = { version = "1", features = ["time"] }
