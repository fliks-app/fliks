[package]
name = "fliks-server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "fliks-server"
path = "src/main.rs"

[features]
# Test seams for the parity runs; never enabled in a release build.
parity = []

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
dunce = "1"
emojis = "0.9"
jsonwebtoken = { version = "11", default-features = false, features = ["rust_crypto"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-webpki-roots", "gzip", "deflate", "brotli", "zstd"] }
serde_path_to_error = "0.1"
fliks_domain = { path = "../domain" }
chrono.workspace = true
httpdate = "1"
serde.workspace = true
serde_json.workspace = true
tower-http = { version = "0.7", features = ["compression-br", "compression-gzip", "cors", "fs", "trace"] }
tracing = "0.1"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
sqlx = { version = "0.9", features = ["postgres", "runtime-tokio", "macros", "json", "chrono", "migrate"] }
fliks-engine-core = { git = "https://github.com/fliks-app/engine", tag = "v1.8.0" }
utoipa = "5"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
getrandom = "0.4"
bcrypt = "0.17"
sha1 = "0.10"
sha2 = "0.11"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
base64 = "0.23"
subtle = "2"
tower = { version = "0.5", features = ["util"] }
percent-encoding = "2"
md-5 = "0.11"
croner = "4.0.1"
miniz_oxide = "0.9"
flate2 = "1"
bytes = "1"
url = "2"
chrono-tz = "0.10.4"
regex.workspace = true
wasmtime = { version = "=50.0.0", default-features = false, features = ["anyhow", "async", "component-model", "cranelift", "parallel-compilation", "runtime", "std"] }
wasmtime-wasi = { version = "=50.0.0", default-features = false, features = ["p2"] }
wasmtime-wasi-http = { version = "=50.0.0", default-features = false, features = ["p2"] }
tokio-postgres = { version = "0.7", features = ["with-serde_json-1", "with-chrono-0_4"] }
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1"
anyhow = "1"
http = "1"
http-body = "1"
ed25519-dalek = "3"
nodejs-semver = "7"
unicode-normalization = "0.1"

[dev-dependencies]
# The integration tests reroute vetted addresses through `Net::route`.
fliks-server = { path = ".", features = ["parity"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart"] }
tokio = { version = "1", features = ["time", "test-util"] }
tokio-stream = "0.1"
rcgen = "0.14"
zip = { version = "9", default-features = false, features = ["deflate"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[target.'cfg(target_os = "linux")'.dependencies]
mimalloc = "0.1"
