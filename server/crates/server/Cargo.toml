[package]
name = "fliks-server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "fliks-server"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
jsonwebtoken = { version = "10", default-features = false, features = ["rust_crypto"] }
reqwest = { version = "0.12", default-features = false, features = ["json"] }
serde_path_to_error = "0.1"
fliks_domain = { path = "../domain" }
chrono.workspace = true
httpdate = "1"
serde.workspace = true
serde_json.workspace = true
tower-http = { version = "0.6", features = ["cors", "fs", "trace"] }
tracing = "0.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio", "macros", "json", "chrono", "migrate"] }
fliks-engine-core = { git = "https://github.com/fliks-app/engine", tag = "v0.3.2" }
utoipa = "5"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
getrandom = "0.3"
bcrypt = "0.17"
sha2 = "0.10"
base64 = "0.22"
subtle = "2"
fliks-engine = { git = "https://github.com/fliks-app/engine", tag = "v0.3.2" }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart"] }
tokio = { version = "1", features = ["time"] }
