[workspace]
resolver = "3"
members = ["crates/domain", "crates/plugin-route", "crates/server"]

[workspace.package]
version = "6.0.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/fliks-app/fliks"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["serde", "clock"] }
regex = "1"
fancy-regex = "0.20"
regress = "0.12"
unicode-normalization = "0.1"

# Backtraces keep line numbers; full debuginfo made a 1 GB dev binary and slow incremental builds.
[profile.dev]
debug = "line-tables-only"

# Optimised deps: an unoptimised Cranelift makes every wasm compile in the plugin tests minutes long.
[profile.dev.package."*"]
opt-level = 1


# No LTO: the compile is the critical path of every release build.
[profile.release]
strip = "symbols"
