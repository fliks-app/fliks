# Builds and publishes the Fliks Docker image to GHCR on:
#   - every release tag `v*`           → semver tags (1.2.3, 1.2, 1, latest)
#   - every push to main               → `main` tag for downstream tests
#   - manual workflow_dispatch         → `manual-<sha>` tag, ad-hoc rebuilds
#
# Build topology:
#   - Releases (`v*` tag) and `main` pushes: matrix on linux/amd64 +
#     linux/arm64, each on its native runner (no QEMU emulation). Two
#     parallel single-arch builds → merge job combines digests into one
#     multi-arch manifest.
#   - workflow_dispatch (test images): amd64 only — most ad-hoc test
#     deployments are TrueNAS SCALE / generic x86 servers, and an arm64
#     build under emulation used to add ~3 min per iteration. The matrix
#     degenerates to one element; the merge job still runs and creates a
#     single-platform manifest with the requested tag.
#
# First push leaves the package private — flip it to Public once via
# https://github.com/orgs/fliks-app/packages → fliks → settings →
# Change visibility. After that, TrueNAS users (and anyone else) can
# `docker pull ghcr.io/fliks-app/fliks:<version>` without auth.
name: Publish Docker image

on:
  push:
    branches: [main]
    tags: ['v*']
    # Path filters don't apply to tag pushes.
    paths-ignore:
      - '**/*.md'
      - 'appletv/**'
      - 'cast-receiver/**'
      - 'desktop/**'
      - 'docs/**'
      - 'macos/**'
      - 'plan/**'
      - 'store/**'
      - 'tools/**'
      - 'windows/**'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Custom tag to publish (e.g. "test", "preview-foo"). Builds from the branch you trigger the workflow on.'
        required: false
        default: 'test'
      engine_image:
        description: 'Engine image to build on (e.g. "ghcr.io/fliks-app/engine:sha-abc1234"). Empty = the Dockerfile default.'
        required: false
        default: ''

permissions:
  contents: read
  packages: write

# A newer main push supersedes a running one; a tag build always finishes.
concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      platforms: ${{ steps.set.outputs.platforms }}
      reuse: ${{ steps.reuse.outputs.reuse }}
    steps:
      # A tag on a commit whose main push already published `sha-<sha>` re-tags that image.
      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: reuse
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]] \
            && docker buildx imagetools inspect "$REGISTRY/$IMAGE_NAME:sha-$GITHUB_SHA" > /dev/null 2>&1; then
            echo "reuse=true" >> "$GITHUB_OUTPUT"
          else
            echo "reuse=false" >> "$GITHUB_OUTPUT"
          fi

      - id: set
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo 'platforms=[{"platform":"linux/amd64","runner":"ubuntu-latest"}]' >> "$GITHUB_OUTPUT"
          else
            echo 'platforms=[{"platform":"linux/amd64","runner":"ubuntu-latest"},{"platform":"linux/arm64","runner":"ubuntu-24.04-arm"}]' >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: setup
    if: needs.setup.outputs.reuse != 'true'
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.setup.outputs.platforms) }}
    runs-on: ${{ matrix.target.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Sanitize platform for cache key
        id: sanitize
        run: echo "tag=$(echo '${{ matrix.target.platform }}' | tr '/' '-')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: Dockerfile
          # Named, not implied: without it the build takes whatever stage ends the
          # file, and a stage appended after `runtime` ships as the release image.
          target: runtime
          platforms: ${{ matrix.target.platform }}
          # push-by-digest: each matrix job pushes its single-arch image
          # under a content-addressable digest only (no human tag). The
          # merge job stitches the digests into a multi-arch manifest and
          # applies the actual tags.
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            TMDB_API_KEY=${{ secrets.TMDB_API_KEY }}
            TVDB_API_KEY=${{ secrets.TVDB_API_KEY }}
            ${{ github.event.inputs.engine_image && format('ENGINE_IMAGE={0}', github.event.inputs.engine_image) || '' }}
          # In the registry, not `gha`: the layers (compiled Rust dependencies included) would
          # take half the repository's 10 GB Actions cache. Ad-hoc builds read it, never replace it.
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-${{ steps.sanitize.outputs.tag }}
          cache-to: ${{ github.event_name != 'workflow_dispatch' && format('type=registry,ref={0}/{1}:buildcache-{2},mode=max,image-manifest=true', env.REGISTRY, env.IMAGE_NAME, steps.sanitize.outputs.tag) || '' }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: digests-${{ steps.sanitize.outputs.tag }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: [setup, build]
    # `build` is skipped when the tag re-tags the image of its main push.
    if: ${{ !cancelled() && needs.setup.result == 'success' && needs.build.result != 'failure' && needs.build.result != 'cancelled' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download digests
        if: needs.setup.outputs.reuse != 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=ref,event=branch
            type=raw,value=sha-${{ github.sha }},enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=manual-{{sha}},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=raw,value=${{ github.event.inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '' }}

      - name: Create manifest and push
        env:
          REUSE: ${{ needs.setup.outputs.reuse }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        run: |
          if [ "$REUSE" = true ]; then
            src="$IMAGE:sha-$GITHUB_SHA"
          else
            src=$(printf "$IMAGE@sha256:%s " $(ls /tmp/digests))
          fi
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") $src

      - name: Inspect image
        run: |
          docker buildx imagetools inspect ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
