# Builds a self-contained Fliks Windows server (tray app + embedded
# PostgreSQL + Node + tri-vendor FFmpeg).
#
# Packaged with Velopack (per-user Setup.exe + update feed on the `win-server`
# channel; the desktop client owns `win` in the same release).
# PR / workflow_dispatch → builds the Setup.exe as a workflow artifact (fast: the
#   vendored binaries and the client/backend build are cached).
# Release tag `v*`       → also pulls the previous release for a delta package
#   and uploads the release files, which the tray's updater reads.
#
# Sibling of macos-dmg.yml (SwiftUI server host). Keep the two in sync.
name: Build Windows server

on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - 'windows/**'
      - '.github/workflows/windows-installer.yml'
  workflow_dispatch:

# Cancel a superseded run when a new commit is pushed to the same ref.
concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-installer:
    runs-on: windows-latest
    env:
      IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      # Real-time scanning of every file written (npm ci, the bundle copy, vpk's zip) is a
      # large share of the Windows build time; the runner is throwaway.
      - name: Disable Defender real-time scanning
        run: Set-MpPreference -DisableRealtimeMonitoring $true

      - uses: actions/checkout@v6

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            # Velopack only takes SemVer2.
            base=$(node -p "require('./backend/package.json').version")
            echo "version=${base}-dev.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            backend/package-lock.json

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # Vendored binaries (~430 MB) rarely change — key on the fetch script,
      # which pins the versions. fetch-vendored.ps1 is idempotent, so a cache
      # hit turns it into a no-op.
      - name: Cache vendored binaries
        uses: actions/cache@v4
        with:
          path: windows/Vendored
          key: win-vendored-${{ hashFiles('windows/Scripts/fetch-vendored.ps1') }}

      # Client + backend build outputs, keyed on their sources + lockfiles.
      # A change touching only windows/** (the tray) hits this cache and skips
      # the slow web build entirely.
      - name: Cache web build
        id: webcache
        uses: actions/cache@v4
        with:
          path: |
            client/dist
            backend/dist
            backend/node_modules
          key: win-web-${{ hashFiles('client/package-lock.json', 'client/src/**', 'client/angular.json', 'client/tsconfig*.json', 'backend/package-lock.json', 'backend/src/**', 'backend/tsconfig*.json', 'backend/nest-cli.json') }}

      - name: Install vpk
        run: dotnet tool install -g vpk --version 1.2.161

      - name: Fetch vendored binaries
        working-directory: windows
        run: .\Scripts\fetch-vendored.ps1

      - name: Build client
        if: steps.webcache.outputs.cache-hit != 'true'
        working-directory: client
        run: |
          npm ci
          npx ng build --configuration=production

      - name: Build backend
        if: steps.webcache.outputs.cache-hit != 'true'
        working-directory: backend
        run: |
          npm ci
          npm run build
          npm ci --omit=dev

      - name: Build bundle
        working-directory: windows
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TVDB_API_KEY: ${{ secrets.TVDB_API_KEY }}
        run: .\Scripts\build-app.ps1 -SkipWeb -Version "${{ steps.version.outputs.version }}"

      # A delta needs the previous full package next to the new one. The first Velopack
      # release has none, which is not an error.
      - name: Download previous release
        if: env.IS_TAG == 'true'
        continue-on-error: true
        working-directory: windows
        run: vpk download github --repoUrl https://github.com/${{ github.repository }} --channel win-server --outputDir build\Releases

      - name: Make setup
        working-directory: windows
        env:
          CERT_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: >
          .\Scripts\make-setup.ps1
          -Version "${{ steps.version.outputs.version }}"
          -CertBase64 "$env:CERT_BASE64"
          -CertPassword "$env:CERT_PASSWORD"

      - name: Upload setup artifact
        uses: actions/upload-artifact@v4
        with:
          name: FliksServer-${{ steps.version.outputs.version }}-Setup
          path: windows/build/Setup/*-Setup.exe
          if-no-files-found: error
          # Already compressed: zipping it again only costs time.
          compression-level: 0

      # The update feed alone, to test an update against a local folder (FLIKS_UPDATE_SOURCE).
      - name: Upload update feed artifact
        uses: actions/upload-artifact@v4
        with:
          name: FliksServer-${{ steps.version.outputs.version }}-feed
          path: |
            windows/build/Releases/*-${{ steps.version.outputs.version }}-full.nupkg
            windows/build/Releases/releases.win-server.json
          if-no-files-found: error
          compression-level: 0

      # `gh release upload` only POSTs the assets; editing the release itself (as
      # `vpk upload github` or the action we used before do) is refused with the job token.
      # The previous release's packages pulled for the delta stay out, and Velopack's bare
      # Setup.exe is replaced by the installer that wraps it.
      - name: Attach to GitHub Release
        if: env.IS_TAG == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $files = Get-ChildItem windows/build/Releases -File |
            Where-Object { ($_.Extension -ne '.nupkg' -or $_.Name -like "*-$env:VERSION-*") -and $_.Name -notlike '*-Setup.exe' } |
            ForEach-Object FullName
          $files += "windows/build/Setup/Fliks-Server-$env:VERSION-Setup.exe"
          gh release upload "${{ github.ref_name }}" @files --clobber
