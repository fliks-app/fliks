# Builds a self-contained Fliks Windows server (tray app + embedded
# PostgreSQL + Node + tri-vendor FFmpeg).
#
# PR / workflow_dispatch → builds and uploads the runnable bundle (fast: the
#   vendored binaries and the client/backend build are cached, and the NSIS
#   installer is skipped — the bundle is what you run to test).
# Release tag `v*`       → also packages the NSIS installer and attaches it to
#   the release.
#
# Sibling of macos-dmg.yml (SwiftUI server host). Keep the two in sync.
name: Build Windows server

on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - 'windows/**'
      - '.github/workflows/windows-installer.yml'
  workflow_dispatch:

# Cancel a superseded run when a new commit is pushed to the same ref.
concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-installer:
    runs-on: windows-latest
    env:
      IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v6

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            backend/package-lock.json

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # Vendored binaries (~430 MB) rarely change — key on the fetch script,
      # which pins the versions. fetch-vendored.ps1 is idempotent, so a cache
      # hit turns it into a no-op.
      - name: Cache vendored binaries
        uses: actions/cache@v4
        with:
          path: windows/Vendored
          key: win-vendored-${{ hashFiles('windows/Scripts/fetch-vendored.ps1') }}

      # Client + backend build outputs, keyed on their sources + lockfiles.
      # A change touching only windows/** (the tray) hits this cache and skips
      # the slow web build entirely.
      - name: Cache web build
        id: webcache
        uses: actions/cache@v4
        with:
          path: |
            client/dist
            backend/dist
            backend/node_modules
          key: win-web-${{ hashFiles('client/package-lock.json', 'client/src/**', 'client/angular.json', 'client/tsconfig*.json', 'backend/package-lock.json', 'backend/src/**', 'backend/tsconfig*.json', 'backend/nest-cli.json') }}

      - name: Install NSIS
        if: env.IS_TAG == 'true'
        run: choco install nsis --no-progress -y

      - name: Fetch vendored binaries
        working-directory: windows
        run: .\Scripts\fetch-vendored.ps1

      - name: Build client
        if: steps.webcache.outputs.cache-hit != 'true'
        working-directory: client
        run: |
          npm ci
          npx ng build --configuration=production

      - name: Build backend
        if: steps.webcache.outputs.cache-hit != 'true'
        working-directory: backend
        run: |
          npm ci
          npm run build
          npm ci --omit=dev

      - name: Build bundle
        working-directory: windows
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TVDB_API_KEY: ${{ secrets.TVDB_API_KEY }}
        run: .\Scripts\build-app.ps1 -SkipWeb -Version "${{ steps.version.outputs.version }}"

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: Fliks-Server-${{ steps.version.outputs.version }}-win-x64-bundle
          path: windows/build/Bundle
          if-no-files-found: error

      # NSIS packaging only on release tags — PR/dispatch builds stop at the
      # bundle above.
      - name: Make installer
        if: env.IS_TAG == 'true'
        working-directory: windows
        env:
          CERT_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: >
          .\Scripts\make-installer.ps1
          -Version "${{ steps.version.outputs.version }}"
          -CertBase64 "$env:CERT_BASE64"
          -CertPassword "$env:CERT_PASSWORD"

      - name: Upload installer artifact
        if: env.IS_TAG == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Fliks-Server-${{ steps.version.outputs.version }}-win-x64
          path: windows/build/Fliks-Setup-*.exe
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: env.IS_TAG == 'true'
        # `gh release upload` only POSTs the asset. The action we used before
        # PATCHes the release first to sync its fields, and that call is
        # refused ("Resource not accessible by integration") even with
        # contents: write — attaching a file never needed it.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" windows/build/Fliks-Setup-*.exe --clobber
        working-directory: ${{ github.workspace }}
