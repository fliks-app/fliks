# Builds a self-contained Fliks Windows server (tray app + embedded
# PostgreSQL + tri-vendor FFmpeg + fliks-engine and fliks-server).
#
# Packaged with Velopack (per-user Setup.exe + update feed on the `win-server`
# channel; the desktop client owns `win` in the same release).
# PR / main / dispatch   → builds the Setup.exe as a workflow artifact (fast: the
#   vendored binaries and the client build are cached).
# Release tag `v*`       → also pulls the previous release for a delta package
#   and uploads the release files, which the tray's updater reads.
#
# Sibling of macos-server-dmg.yml (SwiftUI server host). Keep the two in sync.
name: Build Windows server

on:
  # main seeds the caches: a PR only restores caches from its own branch or the base branch.
  # Path filters don't apply to tag pushes.
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'windows/**'
      - 'server/**'
      - '!server/**/*.md'
      - '.github/workflows/windows-installer.yml'
  # A server-only PR is covered by the Windows clippy job of server.yml.
  pull_request:
    paths:
      - 'windows/**'
      - '.github/workflows/windows-installer.yml'
  workflow_dispatch:

# Cancel a superseded PR run; a main run must finish to save the caches.
concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write

jobs:
  build-installer:
    permissions:
      contents: write
      id-token: write
      attestations: write
    # Release PRs only bump versions; the tag build covers them.
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    runs-on: windows-latest
    env:
      IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      # Real-time scanning of every file written (npm ci, the bundle copy, vpk's zip) is a
      # large share of the Windows build time; the runner is throwaway.
      - name: Disable Defender real-time scanning
        run: Set-MpPreference -DisableRealtimeMonitoring $true

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve version
        id: version
        uses: ./.github/actions/resolve-version

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json

      - uses: ./.github/actions/setup-rust

      # Dependencies only: the workspace crates rebuild every run, which keeps the cache small.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          workspaces: server

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '8.0.x'

      # Vendored binaries (~430 MB) rarely change — key on the fetch script,
      # which pins the versions. fetch-vendored.ps1 is idempotent, so a cache
      # hit turns it into a no-op.
      - name: Cache vendored binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: windows/Vendored
          key: win-vendored-${{ hashFiles('windows/Scripts/fetch-vendored.ps1') }}

      # Client build output, keyed on every client file that can reach it (public/, i18n, ngsw-config...).
      # A change touching only windows/** (the tray) hits this cache and skips
      # the slow web build entirely.
      - name: Cache web build
        id: webcache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: client/dist
          key: win-web-${{ hashFiles('client/**', '!client/dist/**', '!client/node_modules/**', '!client/.angular/**', '!client/android/**', '!client/ios/**') }}

      - name: Install vpk
        run: dotnet tool install -g vpk --version 1.2.161

      - name: Fetch vendored binaries
        working-directory: windows
        run: .\Scripts\fetch-vendored.ps1

      - name: Build client
        if: steps.webcache.outputs.cache-hit != 'true'
        working-directory: client
        run: |
          npm ci
          npx ng build --configuration=production

      - name: Build bundle
        working-directory: windows
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TVDB_API_KEY: ${{ secrets.TVDB_API_KEY }}
        run: .\Scripts\build-app.ps1 -SkipWeb -Version "${{ steps.version.outputs.version }}"

      # A delta needs the previous full package next to the new one. The first Velopack
      # release has none, which is not an error.
      - name: Download previous release
        if: env.IS_TAG == 'true'
        continue-on-error: true
        working-directory: windows
        run: vpk download github --repoUrl https://github.com/${{ github.repository }} --channel win-server --outputDir build\Releases

      - name: Make setup
        working-directory: windows
        env:
          CERT_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: >
          .\Scripts\make-setup.ps1
          -Version "${{ steps.version.outputs.version }}"
          -CertBase64 "$env:CERT_BASE64"
          -CertPassword "$env:CERT_PASSWORD"

      - name: Upload setup artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: FliksServer-${{ steps.version.outputs.version }}-Setup
          path: windows/build/Setup/*-Setup.exe
          if-no-files-found: error
          # Already compressed: zipping it again only costs time.
          compression-level: 0

      - name: Attest build provenance
        if: env.IS_TAG == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: windows/build/Setup/*-Setup.exe

      # `gh release upload` only POSTs the assets; editing the release itself (as
      # `vpk upload github` or the action we used before do) is refused with the job token.
      # The previous release's packages pulled for the delta stay out, and Velopack's bare
      # Setup.exe is replaced by the installer that wraps it.
      - name: Attach to GitHub Release
        if: env.IS_TAG == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $files = Get-ChildItem windows/build/Releases -File |
            Where-Object { ($_.Extension -ne '.nupkg' -or $_.Name -like "*-$env:VERSION-*") -and $_.Name -notlike '*-Setup.exe' } |
            ForEach-Object FullName
          $files += "windows/build/Setup/Fliks-Server-$env:VERSION-Setup.exe"
          gh release upload "${{ github.ref_name }}" @files --clobber
