# Every PR check in one workflow. `changes` picks the areas a change touches; `ci-ok`, the one required check,
# passes when every job it needs succeeded or was skipped.
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# A newer PR push supersedes a running one; a main run must finish to save the caches.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Full debuginfo of the optimised deps fills the runner disk and the cache; file:line is enough.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  changes:
    runs-on: ubuntu-latest
    # A release PR waits for its base commit's main run.
    timeout-minutes: 75
    permissions:
      contents: read
      actions: read
    env:
      RELEASE_PR: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'release-please--') && github.event.pull_request.head.repo.full_name == github.repository }}
    outputs:
      server: ${{ steps.diff.outputs.server }}
      client: ${{ steps.diff.outputs.client }}
      desktop: ${{ steps.diff.outputs.desktop }}
      libmpv_mac: ${{ steps.diff.outputs.libmpv_mac }}
      receiver: ${{ steps.diff.outputs.receiver }}
      tvos: ${{ steps.diff.outputs.tvos }}
      macos: ${{ steps.diff.outputs.macos }}
    steps:
      # Depth 2: a PR checks out its merge commit, whose first parent is the base branch tip.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - run: .github/scripts/main-is-green.test.sh && .github/scripts/route-retention.test.sh
      # Early signal on the release PR; release-please.yml gates the tag itself. The script comes from the
      # base branch, never from the PR. Only a branch of this repository is a release PR (a fork's is a PR).
      - name: the release PR's base commit is green on main
        if: env.RELEASE_PR == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch -q --depth=1 origin "$BASE"
          git show "$BASE:.github/scripts/main-is-green.sh" > "$RUNNER_TEMP/main-is-green.sh"
          bash "$RUNNER_TEMP/main-is-green.sh" "$BASE"
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          out() { printf 'server=%s\nclient=%s\ndesktop=%s\nlibmpv_mac=%s\nreceiver=%s\ntvos=%s\nmacos=%s\n' "$1" "$1" "$1" "$1" "$1" "$1" "$1" >> "$GITHUB_OUTPUT"; }
          # Release PRs only bump versions (main re-runs everything after the merge); drafts wait for review.
          if [[ "$RELEASE_PR" == true || "$DRAFT" == true ]]; then out false; exit 0; fi
          case "$EVENT" in
            pull_request) base=$(git rev-parse HEAD^1) ;;
            *) base= ;;
          esac
          # A push to main runs every area: a superseded pending run must not skip a commit's jobs.
          if [ -z "$base" ] || ! git fetch -q --depth=1 origin "$base"; then out true; exit 0; fi
          files=$(git diff --name-only "$base" HEAD | grep -v '\.md$' || true)
          if grep -qE '^(\.github/(workflows/ci\.yml|actions/|scripts/)|scripts/check-added-lines|rust-toolchain\.toml$)' <<< "$files"; then out true; exit 0; fi
          hit() { grep -qE "$1" <<< "$files" && echo true || echo false; }
          {
            echo "server=$(hit '^(server/|engine\.lock$)')"
            echo "client=$(hit '^(client/|server/fixtures/)')"
            echo "desktop=$(hit '^desktop/')"
            echo "tvos=$(hit '^(appletv/|server/parity/scenarios/|client/public/i18n/)')"
            echo "macos=$(hit '^(macos/|scripts/embedded-postgres\.conf$)')"
            echo "receiver=$(hit '^(cast-receiver/|server/public/emoji/)')"
            echo "libmpv_mac=$(hit '^desktop/(scripts/(build-libmpv-mac|verify-libmpv-mac|verify-minos-mac)\.sh|native/(binding\.gyp|player_mac/))')"
          } | tee -a "$GITHUB_OUTPUT"

  # Added lines only: older files carry dashes. A data fixture that tests a dash spells it with its escape.
  no-em-dash:
    needs: changes
    if: github.event_name == 'pull_request' && (needs.changes.outputs.server == 'true' || needs.changes.outputs.client == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the merge base with the target branch needs the history
      - name: the banned-shape script catches what it should
        run: scripts/check-added-lines.test.sh
      - name: banned shapes in added server and client lines
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags origin "$BASE_REF"
          git diff -U0 --no-color FETCH_HEAD...HEAD -- server client ':!*.md' | scripts/check-added-lines.sh

  lint:
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres: &postgres
        image: postgres:18
        env:
          POSTGRES_USER: fliks
          POSTGRES_PASSWORD: fliks
          POSTGRES_DB: fliks
          # Throwaway DB: no fsync, and room for the per-test pools of the parallel nextest run.
          POSTGRES_INITDB_ARGS: -c max_connections=500 -c fsync=off -c synchronous_commit=off -c full_page_writes=off
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fliks"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: server
    env:
      DATABASE_URL: postgres://fliks:fliks@localhost:5432/fliks
      # With DATABASE_URL set, query! would compile against the unmigrated DB; prepare --check forces online itself.
      SQLX_OFFLINE: 'true'
      # One target dir for both workspaces: the plugin SDK reuses the compiled dependencies (455 of 477 crates).
      CARGO_TARGET_DIR: ${{ github.workspace }}/server/target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          # PR caches would evict main's from the repository's 10 GB.
          save-if: ${{ github.ref == 'refs/heads/main' }}
          shared-key: server-lint
          workspaces: server
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: plugin SDK fmt and clippy (native and wasm32-wasip2)
        working-directory: server/crates/plugin-sdk
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo clippy --workspace --all-targets --target wasm32-wasip2 -- -D warnings
      # sqlx-cli lands in ~/.cargo/bin, which rust-cache restores: the install is a no-op after the first main run.
      # The migrations are plain SQL, so sqlx-cli applies them without building the server binary.
      - name: sqlx offline cache is current
        run: |
          if [ -d .sqlx ]; then
            cargo install sqlx-cli@0.9.0 --no-default-features --features postgres,rustls
            sqlx migrate run --source migrations
            cargo sqlx prepare --check --workspace -- --all-targets
          else
            echo "::notice::no .sqlx directory, sqlx prepare check skipped"
          fi
      # build.sh reads two probe fixtures of the pinned engine release; with PGHOST set it uses the runner's psql, no dump.
      # Each group seed is then applied on a copy of the template, as the parity runner does.
      - name: parity seeds build on the migrated schema
        env:
          PGHOST: localhost
          PGUSER: fliks
          PGPASSWORD: fliks
          PGOPTIONS: -c client_min_messages=warning
          FLIKS_ENGINE_FIXTURES: ${{ runner.temp }}/probe
        run: |
          ver=$(sed -n 's/^version=//p' ../engine.lock)
          mkdir -p "$FLIKS_ENGINE_FIXTURES"
          for n in h264-aac-mkv h264-aac-mp4; do
            curl -fsSL --retry 5 --retry-all-errors -o "$FLIKS_ENGINE_FIXTURES/$n.json" "https://raw.githubusercontent.com/fliks-app/engine/v$ver/fixtures/probe/$n.json"
          done
          parity/seed/build.sh
          for f in parity/seed/*.sql; do
            [ "$f" = parity/seed/base.sql ] && continue
            db=fliks_parity_$(basename "$f" .sql | tr - _)
            psql -v ON_ERROR_STOP=1 -q -d postgres -c "CREATE DATABASE $db TEMPLATE fliks_parity_tpl"
            psql -v ON_ERROR_STOP=1 -q -d "$db" -f "$f" >/dev/null
          done

  # Compiles the test binaries once; the `test-shard` jobs run them, so no shard pays the 4 minute compile.
  build:
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: server
    env:
      SQLX_OFFLINE: 'true'
      CARGO_TARGET_DIR: ${{ github.workspace }}/server/target
      # Faster build; panic messages keep their file:line, only backtraces lose it.
      CARGO_PROFILE_DEV_DEBUG: '0'
      ARCHIVE_DIR: ${{ github.workspace }}/nextest-archive
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          shared-key: server-test
          workspaces: server
      - uses: ./.github/actions/fixture-components
      - uses: taiki-e/install-action@9252097d36d2d3618ad98f5d873696a962b6897c # nextest
      # Includes the plugin host tests (`--test plugins`), which fail under CI without the fixture.
      - name: archive the test binaries
        run: |
          mkdir -p "$ARCHIVE_DIR"
          cargo nextest archive --workspace --archive-file "$ARCHIVE_DIR/tests.tar.zst"
          cp target/wasm32-wasip2/release/fixture_*.wasm "$ARCHIVE_DIR"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: nextest-archive
          path: ${{ env.ARCHIVE_DIR }}
          retention-days: 1
          compression-level: 0

  # The API contract checks run on the binary the build archived, in their own job: a red here must not skip the test shards.
  contract:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    env:
      ARCHIVE_DIR: ${{ github.workspace }}/nextest-archive
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: nextest-archive
          path: ${{ env.ARCHIVE_DIR }}
      - name: openapi.json is current
        run: |
          tar --zstd -xf "$ARCHIVE_DIR/tests.tar.zst" -C "$RUNNER_TEMP" target/debug/fliks-server
          "$RUNNER_TEMP/target/debug/fliks-server" openapi | diff - server/openapi.json
      # An operation the last release served and a client of that release may call goes only with the `wire-break` label
      # and a line in server/wire-breaks.txt, which keeps later PRs green.
      - name: no operation of the last release is gone
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag=$(gh release view --json tagName --jq .tagName)
          git fetch -q --depth=1 origin "refs/tags/$tag:refs/tags/$tag"
          git show "$tag:server/openapi.json" > "$RUNNER_TEMP/released-openapi.json"
          .github/scripts/route-retention.sh "$RUNNER_TEMP/released-openapi.json" server/openapi.json
      - name: wire-breaks.txt changes carry the wire-break label
        if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'wire-break')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if gh pr diff "$PR" --name-only | grep -qx server/wire-breaks.txt; then
            echo "server/wire-breaks.txt changed: a PR editing it needs the wire-break label." >&2
            exit 1
          fi

  test-shard:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    name: test shard ${{ matrix.shard }}/3
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    services:
      postgres: *postgres
    defaults:
      run:
        working-directory: server
    env:
      DATABASE_URL: postgres://fliks:fliks@localhost:5432/fliks
      SQLX_OFFLINE: 'true'
      S8_PG_ADMIN_URL: postgres://fliks:fliks@localhost:5432/postgres
      FLIKS_HARNESS_PG_URL: postgres://fliks:fliks@localhost:5432/postgres
      ARCHIVE_DIR: ${{ github.workspace }}/nextest-archive
      # Where the build job left the fixture components.
      FLIKS_TEST_WASM_DIR: ${{ github.workspace }}/nextest-archive
    steps:
      # The tests read the sources (migrations, fixtures, plugin templates, WIT) at the path the build compiled in.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: nextest-archive
          path: ${{ env.ARCHIVE_DIR }}
      # The restore test runs pg_dump against the Postgres 18 service; the runner image ships 16.
      - name: PostgreSQL 18 client tools
        run: ${{ github.workspace }}/.github/scripts/install-pg18-client.sh
      - uses: taiki-e/install-action@9252097d36d2d3618ad98f5d873696a962b6897c # nextest
      # Every test database is a copy of template1: migrate it once here, before any test connects to it.
      - name: migrate template1
        run: |
          tar --zstd -xf "$ARCHIVE_DIR/tests.tar.zst" -C "$RUNNER_TEMP" target/debug/fliks-server
          DB_NAME=template1 "$RUNNER_TEMP/target/debug/fliks-server" migrate
      # cargo-nextest itself: the archive needs no Rust toolchain, `cargo` would install the pinned one.
      - run: >-
          cargo-nextest nextest run --archive-file "$ARCHIVE_DIR/tests.tar.zst" --workspace-remap "${{ github.workspace }}/server"
          --partition count:${{ matrix.shard }}/3 --no-fail-fast --profile ci

  # The shipped tools are PostgreSQL 18's: the restore tests also run them against older servers than the shards':
  # 17 restores, 16 must refuse before touching anything (system.md rule 36).
  restore-pg:
    name: restore-pg${{ matrix.pg }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - pg: 16
            filter: test(a_server_before_17)
          - pg: 17
            filter: test(restore)
    services:
      postgres:
        image: postgres:${{ matrix.pg }}
        env:
          POSTGRES_USER: fliks
          POSTGRES_PASSWORD: fliks
          POSTGRES_DB: fliks
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fliks"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: server
    env:
      DATABASE_URL: postgres://fliks:fliks@localhost:5432/fliks
      SQLX_OFFLINE: 'true'
      S8_PG_ADMIN_URL: postgres://fliks:fliks@localhost:5432/postgres
      FLIKS_HARNESS_PG_URL: postgres://fliks:fliks@localhost:5432/postgres
      ARCHIVE_DIR: ${{ github.workspace }}/nextest-archive
      FLIKS_TEST_WASM_DIR: ${{ github.workspace }}/nextest-archive
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: nextest-archive
          path: ${{ env.ARCHIVE_DIR }}
      - name: PostgreSQL 18 client tools
        run: ${{ github.workspace }}/.github/scripts/install-pg18-client.sh
      - uses: taiki-e/install-action@9252097d36d2d3618ad98f5d873696a962b6897c # nextest
      - name: migrate template1
        run: |
          tar --zstd -xf "$ARCHIVE_DIR/tests.tar.zst" -C "$RUNNER_TEMP" target/debug/fliks-server
          DB_NAME=template1 "$RUNNER_TEMP/target/debug/fliks-server" migrate
      - run: >-
          cargo-nextest nextest run --archive-file "$ARCHIVE_DIR/tests.tar.zst" --workspace-remap "${{ github.workspace }}/server"
          -E '${{ matrix.filter }}' --no-fail-fast --profile ci -j 2

  plugin-sdk:
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres: *postgres
    defaults:
      run:
        working-directory: server
    env:
      DATABASE_URL: postgres://fliks:fliks@localhost:5432/fliks
      SQLX_OFFLINE: 'true'
      FLIKS_HARNESS_PG_URL: postgres://fliks:fliks@localhost:5432/postgres
      CARGO_TARGET_DIR: ${{ github.workspace }}/server/target
      FLIKS_TEST_WASM_DIR: ${{ github.workspace }}/server/target/wasm32-wasip2/release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          shared-key: server-plugin-sdk
          workspaces: server
      - uses: ./.github/actions/fixture-components
      - name: plugin SDK tests (harness on the fixture)
        working-directory: server/crates/plugin-sdk
        run: cargo test --workspace

  # Catches a Linux-only edit breaking the Windows target on main, before the release build does.
  windows-clippy:
    needs: changes
    if: needs.changes.outputs.server == 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: server
    env:
      SQLX_OFFLINE: 'true'
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          workspaces: server
      # What the Windows release build compiles: the integration tests are Unix-only.
      - run: cargo clippy --workspace --lib --bins -- -D warnings

  client:
    needs: changes
    if: needs.changes.outputs.client == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run check:i18n
      - run: npx ng test --watch=false

  cast-receiver:
    needs: changes
    if: needs.changes.outputs.receiver == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: node --test cast-receiver/*.test.js

  # The release-only widget build runs the Chromium 85 CSS guard; a dependency bump must trip it here.
  tizen:
    needs: changes
    if: needs.changes.outputs.client == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run tizen:build

  desktop:
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # The tests run .ts files directly: Node 24 strips the types.
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      # Scripts off: the Electron binary download is not needed to typecheck or test.
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test

  # The Windows media-controls addon (C++/WinRT) only compiles on Windows.
  desktop-win:
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci --ignore-scripts
      - name: Build the SMTC addon against the Electron 45 ABI
        working-directory: desktop/native
        run: ../node_modules/.bin/node-gyp rebuild --target=45.0.0 --dist-url=https://electronjs.org/headers --arch=x64
      - run: test -f native/build/Release/fliks_smtc_win.node

  # The macOS libmpv is built from source (LGPL, deployment target 13.0); the prefix is cached from main runs.
  desktop-mac:
    needs: changes
    if: needs.changes.outputs.libmpv_mac == 'true'
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      # Homebrew only supplies build tools: the script compiles every library itself.
      - run: brew install meson ninja pkgconf
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/fliks-libmpv-mac
          key: libmpv-mac-${{ hashFiles('desktop/scripts/build-libmpv-mac.sh') }}
      - run: bash desktop/scripts/build-libmpv-mac.sh
      - run: npm ci --ignore-scripts
        working-directory: desktop
      - name: Build the player addon against the Electron 45 ABI
        working-directory: desktop/native
        run: ../node_modules/.bin/node-gyp rebuild --target=45.0.0 --dist-url=https://electronjs.org/headers --arch=arm64
      - run: bash desktop/scripts/verify-minos-mac.sh

  android:
    needs: changes
    if: needs.changes.outputs.client == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 21

      # Main seeds the cache; a PR would only add a copy of its own that main never restores.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
        with:
          build-root-directory: client/android
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # Only what `assembleDebug` compiles against. The default package set
      # pulls the emulator, whose archive has arrived corrupt on the runner and
      # failed the job before a line of our code was built. `tools` is gone from
      # the SDK repository, and asking for it fails the whole step.
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: 'platform-tools platforms;android-36'

      - name: Install client dependencies
        run: npm ci

      - name: Build Angular client
        run: npm run build

      - name: Capacitor sync to Android shell
        run: npx cap sync android

      - name: Compile Android shell
        run: ./gradlew --no-daemon assembleDebug
        working-directory: client/android

      - name: Android unit tests
        run: ./gradlew --no-daemon testProprietaryDebugUnitTest
        working-directory: client/android

  ios:
    needs: changes
    if: needs.changes.outputs.client == 'true'
    runs-on: xcode-27
    timeout-minutes: 40
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json

      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: '27'

      - name: Install client dependencies
        run: npm ci

      - name: Build Angular client
        run: npm run build

      - name: Capacitor sync to iOS shell
        run: npx cap sync ios

      # Simulator destination + signing off: a device build would need a
      # provisioning profile, and the app plus its Live Activity widget compile
      # the same either way.
      - name: Compile iOS shell
        run: |
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
        working-directory: client/ios/App

  # Unit and server-contract tests on a simulator: ServerContractTests decode the parity scenarios and the i18n files.
  tvos:
    needs: changes
    # Pull requests only: a push to main must stay green without a simulator runner, main gates the release.
    if: github.event_name == 'pull_request' && needs.changes.outputs.tvos == 'true'
    runs-on: xcode-27
    timeout-minutes: 40
    defaults:
      run:
        working-directory: appletv
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: '27'
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate the Xcode project
        run: xcodegen generate --spec project.yml
      # Ad-hoc signed like the local simulator builds: the entitlements keep the Keychain usable.
      # The simulator is the last Apple TV listed (newest tvOS runtime); one retry on a fresh boot, the
      # runner sometimes reports a simulator with no native architecture.
      - name: Build and test tvOS app
        run: |
          for attempt in 1 2; do
            udid=$(xcrun simctl list devices available tvOS \
              | awk '/Apple TV/ { match($0, /[0-9A-F-]{36}/); id = substr($0, RSTART, RLENGTH) } END { print id }')
            test -n "$udid" || { echo "no tvOS simulator available"; exit 1; }
            xcrun simctl shutdown all || true
            xcrun simctl bootstatus "$udid" -b
            if xcodebuild \
              -project FliksTV.xcodeproj \
              -scheme FliksTV \
              -destination "id=$udid" \
              CODE_SIGN_IDENTITY="-" \
              CODE_SIGNING_REQUIRED=YES \
              CODE_SIGNING_ALLOWED=YES \
              test; then exit 0; fi
            echo "attempt $attempt failed"
          done
          exit 1

  # Swift compile of the macOS server host only: no bundle, no signing, no engine or Postgres fetch.
  macos:
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.macos == 'true'
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: macos
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate the Xcode project
        run: xcodegen generate
      - name: Compile the Swift app
        run: |
          xcodebuild -project Fliks.xcodeproj -scheme Fliks -configuration Debug \
            -derivedDataPath build ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO build

  # The tests the application role must keep passing, run as `fliks_app` the way a production install connects:
  # the only per-PR proof that a migration needs no superuser. The full suite runs under it nightly.
  test-app-role:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres: *postgres
    defaults:
      run:
        working-directory: server
    env:
      DATABASE_URL: postgres://fliks_app:fliks-app-test@localhost:5432/fliks
      SQLX_OFFLINE: 'true'
      S8_PG_ADMIN_URL: postgres://fliks:fliks@localhost:5432/postgres
      FLIKS_HARNESS_PG_URL: postgres://fliks:fliks@localhost:5432/postgres
      ARCHIVE_DIR: ${{ github.workspace }}/nextest-archive
      FLIKS_TEST_WASM_DIR: ${{ github.workspace }}/nextest-archive
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: nextest-archive
          path: ${{ env.ARCHIVE_DIR }}
      - name: PostgreSQL 18 client tools
        run: ${{ github.workspace }}/.github/scripts/install-pg18-client.sh
      - uses: taiki-e/install-action@9252097d36d2d3618ad98f5d873696a962b6897c # nextest
      - uses: ./.github/actions/app-role-db
        with:
          archive: ${{ env.ARCHIVE_DIR }}
      # The filterset is the `app-role` profile of .config/nextest.toml.
      - run: >-
          cargo-nextest nextest run --archive-file "$ARCHIVE_DIR/tests.tar.zst" --workspace-remap "${{ github.workspace }}/server"
          --no-fail-fast --profile app-role

  # The only required check: a skipped job (area untouched) counts as passed.
  ci-ok:
    if: always()
    needs: [changes, no-em-dash, lint, build, contract, test-shard, restore-pg, test-app-role, plugin-sdk, windows-clippy, client, tizen, cast-receiver, desktop, desktop-win, desktop-mac, android, ios, tvos, macos]
    runs-on: ubuntu-latest
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: jq -e 'all(.[]; .result == "success" or .result == "skipped")' <<< "$NEEDS"
