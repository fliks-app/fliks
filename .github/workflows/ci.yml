# Every PR check in one workflow. `changes` picks the areas a change touches; `ci-ok`, the one required check,
# passes when every job it needs succeeded or was skipped. The merge queue runs only the compile-level jobs (lint, tizen).
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

# A newer PR push supersedes a running one; a main run must finish to save the caches.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Full debuginfo of the optimised deps fills the runner disk and the cache; file:line is enough.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      server: ${{ steps.diff.outputs.server }}
      client: ${{ steps.diff.outputs.client }}
      desktop: ${{ steps.diff.outputs.desktop }}
    steps:
      # Depth 2: a PR checks out its merge commit, whose first parent is the base branch tip.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          DRAFT: ${{ github.event.pull_request.draft }}
          QUEUE_BASE: ${{ github.event.merge_group.base_sha }}
        run: |
          out() { printf 'server=%s\nclient=%s\ndesktop=%s\n' "$1" "$1" "$1" >> "$GITHUB_OUTPUT"; }
          # Release PRs only bump versions (main re-runs everything after the merge); drafts wait for review.
          if [[ "$HEAD_REF" == release-please--* || "$DRAFT" == true ]]; then out false; exit 0; fi
          case "$EVENT" in
            pull_request) base=$(git rev-parse HEAD^1) ;;
            merge_group) base=$QUEUE_BASE ;;
            *) base= ;;
          esac
          # A push to main runs every area: a superseded pending run must not skip a commit's jobs.
          if [ -z "$base" ] || ! git fetch -q --depth=1 origin "$base"; then out true; exit 0; fi
          files=$(git diff --name-only "$base" HEAD | grep -v '\.md$' || true)
          if grep -qE '^(\.github/(workflows/ci\.yml|actions/|scripts/)|rust-toolchain\.toml$)' <<< "$files"; then out true; exit 0; fi
          hit() { grep -qE "$1" <<< "$files" && echo true || echo false; }
          {
            echo "server=$(hit '^(server/|engine\.lock$)')"
            echo "client=$(hit '^client/')"
            echo "desktop=$(hit '^desktop/')"
          } | tee -a "$GITHUB_OUTPUT"

  # Added lines only: older files carry dashes. A data fixture that tests a dash spells it with its escape.
  no-em-dash:
    needs: changes
    if: github.event_name == 'pull_request' && (needs.changes.outputs.server == 'true' || needs.changes.outputs.client == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: no literal em dash in added server and client lines
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          git diff -U0 --no-color FETCH_HEAD HEAD -- server client ':!*.md' |
            awk -v d="$(printf '\342\200\224')" '/^\+\+\+ /{f=$2; next} /^\+/ && index($0,d){print f": "$0; bad=1} END{exit bad}'

  lint:
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres: &postgres
        image: postgres:18
        env:
          POSTGRES_USER: fliks
          POSTGRES_PASSWORD: fliks
          POSTGRES_DB: fliks
          # Throwaway DB: no fsync, and room for the per-test pools of the parallel nextest run.
          POSTGRES_INITDB_ARGS: -c max_connections=500 -c fsync=off -c synchronous_commit=off -c full_page_writes=off
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fliks"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: server
    env:
      DATABASE_URL: postgres://fliks:fliks@localhost:5432/fliks
      # With DATABASE_URL set, query! would compile against the unmigrated DB; prepare --check forces online itself.
      SQLX_OFFLINE: 'true'
      # One target dir for both workspaces: the plugin SDK reuses the compiled dependencies (455 of 477 crates).
      CARGO_TARGET_DIR: ${{ github.workspace }}/server/target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          # PR caches would evict main's from the repository's 10 GB.
          save-if: ${{ github.ref == 'refs/heads/main' }}
          shared-key: server-lint
          workspaces: server
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: plugin SDK fmt and clippy (native and wasm32-wasip2)
        working-directory: server/crates/plugin-sdk
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo clippy --workspace --all-targets --target wasm32-wasip2 -- -D warnings
      # sqlx-cli lands in ~/.cargo/bin, which rust-cache restores: the install is a no-op after the first main run.
      # The migrations are plain SQL, so sqlx-cli applies them without building the server binary.
      - name: sqlx offline cache is current
        run: |
          if [ -d .sqlx ]; then
            cargo install sqlx-cli@0.9.0 --no-default-features --features postgres,rustls
            sqlx migrate run --source migrations
            cargo sqlx prepare --check --workspace -- --all-targets
          else
            echo "::notice::no .sqlx directory, sqlx prepare check skipped"
          fi
      # build.sh reads two probe fixtures of the pinned engine release; with PGHOST set it uses the runner's psql, no dump.
      # Each group seed is then applied on a copy of the template, as the parity runner does.
      - name: parity seeds build on the migrated schema
        env:
          PGHOST: localhost
          PGUSER: fliks
          PGPASSWORD: fliks
          PGOPTIONS: -c client_min_messages=warning
          FLIKS_ENGINE_FIXTURES: ${{ runner.temp }}/probe
        run: |
          ver=$(sed -n 's/^version=//p' ../engine.lock)
          mkdir -p "$FLIKS_ENGINE_FIXTURES"
          for n in h264-aac-mkv h264-aac-mp4; do
            curl -fsSL --retry 5 --retry-all-errors -o "$FLIKS_ENGINE_FIXTURES/$n.json" "https://raw.githubusercontent.com/fliks-app/engine/v$ver/fixtures/probe/$n.json"
          done
          parity/seed/build.sh
          for f in parity/seed/*.sql; do
            [ "$f" = parity/seed/base.sql ] && continue
            db=fliks_parity_$(basename "$f" .sql | tr - _)
            psql -v ON_ERROR_STOP=1 -q -d postgres -c "CREATE DATABASE $db TEMPLATE fliks_parity_tpl"
            psql -v ON_ERROR_STOP=1 -q -d "$db" -f "$f" >/dev/null
          done

  # Compiles the test binaries once; the `test-shard` jobs run them, so no shard pays the 4 minute compile.
  build:
    needs: changes
    if: needs.changes.outputs.server == 'true' && github.event_name != 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: server
    env:
      SQLX_OFFLINE: 'true'
      CARGO_TARGET_DIR: ${{ github.workspace }}/server/target
      ARCHIVE_DIR: ${{ github.workspace }}/nextest-archive
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          shared-key: server-test
          workspaces: server
      - uses: ./.github/actions/fixture-components
      - uses: taiki-e/install-action@9252097d36d2d3618ad98f5d873696a962b6897c # nextest
      # Includes the plugin host tests (`--test plugins`), which fail under CI without the fixture.
      - name: archive the test binaries
        run: |
          mkdir -p "$ARCHIVE_DIR"
          cargo nextest archive --workspace --archive-file "$ARCHIVE_DIR/tests.tar.zst"
          cp target/wasm32-wasip2/release/fixture_*.wasm "$ARCHIVE_DIR"
      # The binary the archive build left in target/: `cargo run` would rebuild the deps without the dev-dependency features.
      - name: openapi.json is current
        run: target/debug/fliks-server openapi | diff - openapi.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: nextest-archive
          path: ${{ env.ARCHIVE_DIR }}
          retention-days: 1
          compression-level: 0

  test-shard:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    name: test shard ${{ matrix.shard }}/3
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    services:
      postgres: *postgres
    defaults:
      run:
        working-directory: server
    env:
      DATABASE_URL: postgres://fliks:fliks@localhost:5432/fliks
      SQLX_OFFLINE: 'true'
      S8_PG_ADMIN_URL: postgres://fliks:fliks@localhost:5432/postgres
      FLIKS_HARNESS_PG_URL: postgres://fliks:fliks@localhost:5432/postgres
      ARCHIVE_DIR: ${{ github.workspace }}/nextest-archive
      # Where the build job left the fixture components.
      FLIKS_TEST_WASM_DIR: ${{ github.workspace }}/nextest-archive
    steps:
      # The tests read the sources (migrations, fixtures, plugin templates, WIT) at the path the build compiled in.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: nextest-archive
          path: ${{ env.ARCHIVE_DIR }}
      # The restore test runs pg_dump against the Postgres 18 service; the runner image ships 16.
      - name: PostgreSQL 18 client tools
        run: ${{ github.workspace }}/.github/scripts/install-pg18-client.sh
      - uses: taiki-e/install-action@9252097d36d2d3618ad98f5d873696a962b6897c # nextest
      # cargo-nextest itself: the archive needs no Rust toolchain, `cargo` would install the pinned one.
      - run: >-
          cargo-nextest nextest run --archive-file "$ARCHIVE_DIR/tests.tar.zst" --workspace-remap "${{ github.workspace }}/server"
          --partition count:${{ matrix.shard }}/3 --no-fail-fast --profile ci

  plugin-sdk:
    needs: changes
    if: needs.changes.outputs.server == 'true' && github.event_name != 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres: *postgres
    defaults:
      run:
        working-directory: server
    env:
      DATABASE_URL: postgres://fliks:fliks@localhost:5432/fliks
      SQLX_OFFLINE: 'true'
      FLIKS_HARNESS_PG_URL: postgres://fliks:fliks@localhost:5432/postgres
      CARGO_TARGET_DIR: ${{ github.workspace }}/server/target
      FLIKS_TEST_WASM_DIR: ${{ github.workspace }}/server/target/wasm32-wasip2/release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          shared-key: server-plugin-sdk
          workspaces: server
      - uses: ./.github/actions/fixture-components
      - name: plugin SDK tests (harness on the fixture)
        working-directory: server/crates/plugin-sdk
        run: cargo test --workspace

  # Catches a Linux-only edit breaking the Windows target on main, before the release build does.
  windows-clippy:
    needs: changes
    if: needs.changes.outputs.server == 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: server
    env:
      SQLX_OFFLINE: 'true'
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          workspaces: server
      # What the Windows release build compiles: the integration tests are Unix-only.
      - run: cargo clippy --workspace --lib --bins -- -D warnings

  client:
    needs: changes
    if: needs.changes.outputs.client == 'true' && github.event_name != 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npx ng test --watch=false

  # The release-only widget build runs the Chromium 85 CSS guard; a dependency bump must trip it here.
  tizen:
    needs: changes
    if: needs.changes.outputs.client == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run tizen:build

  desktop:
    needs: changes
    if: needs.changes.outputs.desktop == 'true' && github.event_name != 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # The tests run .ts files directly: Node 24 strips the types.
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      # Scripts off: the Electron binary download is not needed to typecheck or test.
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test

  # The Windows media-controls addon (C++/WinRT) only compiles on Windows.
  desktop-win:
    needs: changes
    if: needs.changes.outputs.desktop == 'true' && github.event_name != 'merge_group'
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci --ignore-scripts
      - name: Build the SMTC addon against the Electron 45 ABI
        working-directory: desktop/native
        run: ../node_modules/.bin/node-gyp rebuild --target=45.0.0 --dist-url=https://electronjs.org/headers --arch=x64
      - run: test -f native/build/Release/fliks_smtc_win.node

  android:
    needs: changes
    if: needs.changes.outputs.client == 'true' && github.event_name != 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21

      # Main seeds the cache; a PR would only add a copy of its own that main never restores.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
        with:
          build-root-directory: client/android
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # Only what `assembleDebug` compiles against. The default package set
      # pulls the emulator, whose archive has arrived corrupt on the runner and
      # failed the job before a line of our code was built. `tools` is gone from
      # the SDK repository, and asking for it fails the whole step.
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: 'platform-tools platforms;android-36'

      - name: Install client dependencies
        run: npm ci

      - name: Build Angular client
        run: npm run build

      - name: Capacitor sync to Android shell
        run: npx cap sync android

      - name: Compile Android shell
        run: ./gradlew --no-daemon assembleDebug
        working-directory: client/android

      - name: Android unit tests
        run: ./gradlew --no-daemon testDebugUnitTest
        working-directory: client/android

  ios:
    needs: changes
    if: needs.changes.outputs.client == 'true' && github.event_name != 'merge_group'
    runs-on: macos-15
    timeout-minutes: 40
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json

      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: '26.3'

      - name: Install client dependencies
        run: npm ci

      - name: Build Angular client
        run: npx ng build --configuration=production

      - name: Capacitor sync to iOS shell
        run: npx cap sync ios

      # Simulator destination + signing off: a device build would need a
      # provisioning profile, and the app plus its Live Activity widget compile
      # the same either way.
      - name: Compile iOS shell
        run: |
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
        working-directory: client/ios/App

  # The only required check: a skipped job (area untouched, or left out of the merge queue) counts as passed.
  ci-ok:
    if: always()
    needs: [changes, no-em-dash, lint, build, test-shard, plugin-sdk, windows-clippy, client, tizen, desktop, desktop-win, android, ios]
    runs-on: ubuntu-latest
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: jq -e 'all(.[]; .result == "success" or .result == "skipped")' <<< "$NEEDS"
