# Pull request entry point: runs the path-scoped workflows and reports one always-present `ci-ok` check,
# the one to require in branch protection (a path-filtered job that never starts can't be required).
name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      client: ${{ steps.f.outputs.client }}
      server: ${{ steps.f.outputs.server }}
      engine: ${{ steps.f.outputs.engine }}
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: f
        with:
          filters: |
            client:
              - 'client/**'
              - 'desktop/**'
              - '!**/*.md'
              - '.github/workflows/client.yml'
              - '.github/workflows/native-build.yml'
              - '.github/workflows/ci.yml'
            server:
              - 'server/**'
              - '!server/**/*.md'
              - '.github/workflows/server.yml'
              - '.github/workflows/ci.yml'
            engine:
              - 'engine.lock'
              - 'Dockerfile'
              - 'server/crates/server/Cargo.toml'
              - 'server/Cargo.lock'
              - 'server/crates/plugin-sdk/Cargo.lock'
              - '.github/scripts/check-engine-lock.sh'
              - 'scripts/bump-engine.sh'
              - '.github/workflows/engine-lock.yml'

  client:
    needs: changes
    if: needs.changes.outputs.client == 'true'
    uses: ./.github/workflows/client.yml

  native:
    needs: changes
    if: needs.changes.outputs.client == 'true'
    uses: ./.github/workflows/native-build.yml

  server:
    needs: changes
    if: needs.changes.outputs.server == 'true'
    uses: ./.github/workflows/server.yml

  engine-lock:
    needs: changes
    if: needs.changes.outputs.engine == 'true'
    uses: ./.github/workflows/engine-lock.yml

  # Skipped jobs (nothing relevant changed) pass; failed or cancelled ones fail the gate.
  ci-ok:
    needs: [changes, client, native, server, engine-lock]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo '${{ toJSON(needs) }}'
          ! echo '${{ join(needs.*.result, ' ') }}' | grep -qE 'failure|cancelled'
