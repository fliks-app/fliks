# Compiles the Android and iOS shells on pull requests.
#
# The release workflows (`android-publish.yml`, `appstore-publish.yml`) only
# run on a `v*` tag, so until this existed nothing built the native code before
# it shipped: a Java or Swift compile error sailed through review and surfaced
# at release time, on the tag, with no obvious owner.
#
# Neither job signs anything — signing needs secrets a fork's PR can't reach,
# and a compile error is what we're after here, not a distributable artefact.
# Path filters keep the macOS runner (billed at 10x) off pull requests that
# don't touch the client.

name: Native build

on:
  pull_request:
    paths:
      - 'client/**'
      - '.github/workflows/native-build.yml'
  push:
    branches: [main]
    paths:
      - 'client/**'
      - '.github/workflows/native-build.yml'

concurrency:
  group: native-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21

      # Main seeds the cache; a PR would only add a copy of its own that main never restores.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
        with:
          build-root-directory: client/android
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # Only what `assembleDebug` compiles against. The default package set
      # pulls the emulator, whose archive has arrived corrupt on the runner and
      # failed the job before a line of our code was built. `tools` is gone from
      # the SDK repository, and asking for it fails the whole step.
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: 'platform-tools platforms;android-36'

      - name: Install client dependencies
        run: npm ci

      - name: Build Angular client
        run: npm run build

      - name: Capacitor sync to Android shell
        run: npx cap sync android

      - name: Compile Android shell
        run: ./gradlew --no-daemon assembleDebug
        working-directory: client/android

  ios:
    runs-on: macos-15
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json

      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: '26.3'

      - name: Install client dependencies
        run: npm ci

      - name: Build Angular client
        run: npx ng build --configuration=production

      - name: Capacitor sync to iOS shell
        run: npx cap sync ios

      # Simulator destination + signing off: a device build would need a
      # provisioning profile, and the app plus its Live Activity widget compile
      # the same either way.
      - name: Compile iOS shell
        run: |
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
        working-directory: client/ios/App
