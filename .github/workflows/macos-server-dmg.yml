# Builds a self-contained Fliks Server.app and packages it as a DMG,
# then uploads it as a GitHub Release asset.
#
# Triggers:
#   - release tag `v*` (from release-please) → attaches DMG to the release
#   - push to main / manual workflow_dispatch → uploads artifact for testing
#
# Sibling of windows-installer.yml. Keep the two in sync.
name: Build macOS server

on:
  # main seeds the caches: a tag or another branch can't restore a cache saved on a tag.
  # Path filters don't apply to tag pushes.
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'macos/**'
      - 'client/**'
      - 'server/**'
      - '!server/**/*.md'
      - '.github/workflows/macos-server-dmg.yml'
  workflow_dispatch:

# A main run must finish to save the caches.
concurrency:
  group: macos-server-dmg-${{ github.ref }}

permissions:
  contents: write

jobs:
  build-dmg:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6

      # ── Resolve version + patch Info.plist BEFORE build ──
      # The DMG name comes from Info.plist's CFBundleShortVersionString
      # (make-dmg.sh reads it via PlistBuddy). Without this step every
      # build shipped as Fliks-1.0.0-arm64.dmg regardless of the tag.
      - name: Resolve version
        id: version
        uses: ./.github/actions/resolve-version

      - name: Patch Info.plist with version
        run: |
          RAW="${{ steps.version.outputs.version }}"
          # CFBundleShortVersionString must be N[.N[.N]] per Apple — for
          # dev builds drop the suffix so the plist stays valid.
          SHORT="$(echo "$RAW" | grep -oE '^[0-9]+(\.[0-9]+){0,2}' || true)"
          [ -z "$SHORT" ] && SHORT="0.0.0"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $SHORT" macos/Fliks/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $SHORT" macos/Fliks/Info.plist
          echo "Patched Info.plist: CFBundleShortVersionString=$SHORT (from $RAW)"

      # ── Node.js for building the client ──
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json

      # ── Rust for fliks-server (built by build-app) ──
      - uses: ./.github/actions/setup-rust

      # Dependencies only: the workspace crates rebuild every run, which keeps the cache small.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          workspaces: server

      # ── Homebrew dependencies ──
      # ffmpeg is not installed here — fetch-vendored.sh downloads jellyfin-ffmpeg.
      - name: Install Homebrew dependencies
        run: brew install postgresql@18 xcodegen create-dmg

      # ── Fetch vendored PostgreSQL and ffmpeg (arm64) ──
      - name: Fetch vendored binaries
        working-directory: macos
        run: ./Scripts/fetch-vendored.sh

      # ── Build Angular client ──
      - name: Cache web build
        id: webcache
        uses: actions/cache@v4
        with:
          path: client/dist
          key: macos-web-${{ hashFiles('client/**', '!client/dist/**', '!client/node_modules/**', '!client/.angular/**', '!client/android/**', '!client/ios/**') }}

      - name: Build client
        if: steps.webcache.outputs.cache-hit != 'true'
        working-directory: client
        run: |
          npm ci
          npx ng build --configuration=production

      # ── Generate Xcode project ──
      - name: Generate Xcode project
        working-directory: macos
        run: xcodegen generate

      # ── Import the Developer ID cert into a throwaway keychain ──
      # build-app.sh signs the .app + every bundled binary with it (hardened
      # runtime + entitlements), so the DMG can be notarized below.
      - name: Import Developer ID certificate
        uses: ./.github/actions/import-keychain
        with:
          p12-base64: ${{ secrets.MAC_DEVELOPER_ID_CERT_P12_BASE64 }}
          password: ${{ secrets.MAC_DEVELOPER_ID_CERT_PASSWORD }}

      # ── Build .app + bundle resources + dylibs ──
      # API keys are baked into Info.plist via Xcode build settings,
      # then read at runtime by BuildConfig.swift. MAC_SIGN_IDENTITY tells
      # build-app.sh to Developer ID sign (hardened runtime) instead of ad-hoc;
      # the single imported cert matches the identity prefix uniquely.
      - name: Build Fliks Server.app
        working-directory: macos
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TVDB_API_KEY: ${{ secrets.TVDB_API_KEY }}
          MAC_SIGN_IDENTITY: Developer ID Application
        run: ./Scripts/build-app.sh --skip-web

      # ── Create DMG ──
      - name: Create DMG
        working-directory: macos
        run: ./Scripts/make-dmg.sh

      # ── Notarize + staple the DMG ──
      # Without notarization a downloaded DMG is blocked by Gatekeeper
      # ("damaged" / "Apple cannot check it"). notarytool reuses the App Store
      # Connect API key (same one the iOS build uses); --wait blocks on Apple's
      # verdict, then the ticket is stapled so it opens offline.
      - name: Stage notarization API key
        id: asc
        uses: ./.github/actions/stage-asc-key
        with:
          key-id: ${{ secrets.APPSTORE_API_KEY_ID }}
          key-p8-base64: ${{ secrets.APPSTORE_API_KEY_P8_BASE64 }}

      - name: Notarize and staple DMG
        env:
          KEY_P8: ${{ steps.asc.outputs.path }}
          KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
        run: |
          dmg="$(find macos/build -name 'Fliks-*.dmg' | head -1)"
          test -n "$dmg" || { echo "::error::DMG not found for notarization"; exit 1; }
          xcrun notarytool submit "$dmg" \
            --key "$KEY_P8" --key-id "$KEY_ID" --issuer "$ISSUER_ID" --wait
          xcrun stapler staple "$dmg"
          xcrun stapler validate "$dmg"

      # ── Upload DMG as artifact (always) ──
      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: Fliks-Server-${{ steps.version.outputs.version }}-arm64.dmg
          path: macos/build/Fliks-*.dmg
          if-no-files-found: error

      # ── Attach DMG to GitHub Release (tag pushes only) ──
      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        # `gh release upload` only POSTs the asset. The action we used before
        # PATCHes the release first to sync its fields, and that call is
        # refused ("Resource not accessible by integration") even with
        # contents: write — attaching a file never needed it.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" macos/build/Fliks-*.dmg --clobber
        working-directory: ${{ github.workspace }}
