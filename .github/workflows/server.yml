# Rust server and plugin SDK, in parallel jobs: lint (em dash, fmt, clippy, sqlx offline cache, parity seeds), build + test-shard (nextest
# archive with the plugin wasm fixture, openapi.json drift) aggregated by `test`, plugin SDK tests and Windows clippy. Parity is parity.yml.
name: Server

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths: &paths
      - 'server/**'
      - '!server/**/*.md'
      - '.github/workflows/server.yml'
  push:
    branches: [main]
    paths: *paths
  workflow_dispatch:

# A newer PR push supersedes a running one; a main run must finish to save the caches.
concurrency:
  group: server-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Full debuginfo of the optimised deps fills the runner disk and the cache; file:line is enough.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  lint:
    # Release PRs only bump versions; main re-runs this after the merge.
    if: ${{ !startsWith(github.head_ref, 'release-please--') && !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres: &postgres
        image: postgres:18
        env:
          POSTGRES_USER: fliks
          POSTGRES_PASSWORD: fliks
          POSTGRES_DB: fliks
          # Throwaway DB: no fsync, and room for the per-test pools of the parallel nextest run.
          POSTGRES_INITDB_ARGS: -c max_connections=500 -c fsync=off -c synchronous_commit=off -c full_page_writes=off
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fliks"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: server
    env:
      DATABASE_URL: postgres://fliks:fliks@localhost:5432/fliks
      # With DATABASE_URL set, query! would compile against the unmigrated DB; prepare --check forces online itself.
      SQLX_OFFLINE: 'true'
      # One target dir for both workspaces: the plugin SDK reuses the compiled dependencies (455 of 477 crates).
      CARGO_TARGET_DIR: ${{ github.workspace }}/server/target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Added lines only: older files carry dashes. A data fixture that tests a dash spells it —.
      - name: no literal em dash in added server and client lines
        if: github.event_name == 'pull_request'
        working-directory: ${{ github.workspace }}
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          git diff -U0 --no-color FETCH_HEAD HEAD -- server client ':!*.md' |
            awk -v d="$(printf '\342\200\224')" '/^\+\+\+ /{f=$2; next} /^\+/ && index($0,d){print f": "$0; bad=1} END{exit bad}'
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          # PR caches would evict main's from the repository's 10 GB.
          save-if: ${{ github.ref == 'refs/heads/main' }}
          shared-key: server-lint
          workspaces: server
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: plugin SDK fmt and clippy (native and wasm32-wasip2)
        working-directory: server/crates/plugin-sdk
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo clippy --workspace --all-targets --target wasm32-wasip2 -- -D warnings
      # sqlx-cli lands in ~/.cargo/bin, which rust-cache restores: the install is a no-op after the first main run.
      # The migrations are plain SQL, so sqlx-cli applies them without building the server binary.
      - name: sqlx offline cache is current
        run: |
          if [ -d .sqlx ]; then
            cargo install sqlx-cli@0.9.0 --no-default-features --features postgres,rustls
            sqlx migrate run --source migrations
            cargo sqlx prepare --check --workspace -- --all-targets
          else
            echo "::notice::no .sqlx directory, sqlx prepare check skipped"
          fi
      # build.sh reads two probe fixtures of the pinned engine release; with PGHOST set it uses the runner's psql, no dump.
      # Each group seed is then applied on a copy of the template, as the parity runner does.
      - name: parity seeds build on the migrated schema
        env:
          PGHOST: localhost
          PGUSER: fliks
          PGPASSWORD: fliks
          PGOPTIONS: -c client_min_messages=warning
          FLIKS_ENGINE_FIXTURES: ${{ runner.temp }}/probe
        run: |
          ver=$(sed -n 's/^version=//p' ../engine.lock)
          mkdir -p "$FLIKS_ENGINE_FIXTURES"
          for n in h264-aac-mkv h264-aac-mp4; do
            curl -fsSL --retry 5 --retry-all-errors -o "$FLIKS_ENGINE_FIXTURES/$n.json" "https://raw.githubusercontent.com/fliks-app/engine/v$ver/fixtures/probe/$n.json"
          done
          parity/seed/build.sh
          for f in parity/seed/*.sql; do
            [ "$f" = parity/seed/base.sql ] && continue
            db=fliks_parity_$(basename "$f" .sql | tr - _)
            psql -v ON_ERROR_STOP=1 -q -d postgres -c "CREATE DATABASE $db TEMPLATE fliks_parity_tpl"
            psql -v ON_ERROR_STOP=1 -q -d "$db" -f "$f" >/dev/null
          done

  # Compiles the test binaries once; the `test-shard` jobs run them, so no shard pays the 4 minute compile.
  build:
    if: ${{ !startsWith(github.head_ref, 'release-please--') && !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: server
    env:
      SQLX_OFFLINE: 'true'
      CARGO_TARGET_DIR: ${{ github.workspace }}/server/target
      ARCHIVE_DIR: ${{ github.workspace }}/nextest-archive
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          shared-key: server-test
          workspaces: server
      - uses: ./.github/actions/fixture-components
      - uses: taiki-e/install-action@9252097d36d2d3618ad98f5d873696a962b6897c # nextest
      # Includes the plugin host tests (`--test plugins`), which fail under CI without the fixture.
      - name: archive the test binaries
        run: |
          mkdir -p "$ARCHIVE_DIR"
          cargo nextest archive --workspace --archive-file "$ARCHIVE_DIR/tests.tar.zst"
          cp target/wasm32-wasip2/release/fixture_*.wasm "$ARCHIVE_DIR"
      # The binary the archive build left in target/: `cargo run` would rebuild the deps without the dev-dependency features.
      - name: openapi.json is current
        run: target/debug/fliks-server openapi | diff - openapi.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: nextest-archive
          path: ${{ env.ARCHIVE_DIR }}
          retention-days: 1
          compression-level: 0

  test-shard:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    name: test shard ${{ matrix.shard }}/3
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    services:
      postgres: *postgres
    defaults:
      run:
        working-directory: server
    env:
      DATABASE_URL: postgres://fliks:fliks@localhost:5432/fliks
      SQLX_OFFLINE: 'true'
      S8_PG_ADMIN_URL: postgres://fliks:fliks@localhost:5432/postgres
      FLIKS_HARNESS_PG_URL: postgres://fliks:fliks@localhost:5432/postgres
      ARCHIVE_DIR: ${{ github.workspace }}/nextest-archive
      # Where the build job left the fixture components.
      FLIKS_TEST_WASM_DIR: ${{ github.workspace }}/nextest-archive
    steps:
      # The tests read the sources (migrations, fixtures, plugin templates, WIT) at the path the build compiled in.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: nextest-archive
          path: ${{ env.ARCHIVE_DIR }}
      # The restore test runs pg_dump against the Postgres 18 service; the runner image ships 16.
      - name: PostgreSQL 18 client tools
        run: ${{ github.workspace }}/.github/scripts/install-pg18-client.sh
      - uses: taiki-e/install-action@9252097d36d2d3618ad98f5d873696a962b6897c # nextest
      - run: >-
          cargo nextest run --archive-file "$ARCHIVE_DIR/tests.tar.zst" --workspace-remap "${{ github.workspace }}/server"
          --partition count:${{ matrix.shard }}/3 --no-fail-fast --profile ci

  # The check name `test` of the former single job: green only if the build and every shard are.
  test:
    if: ${{ always() && !startsWith(github.head_ref, 'release-please--') && !github.event.pull_request.draft }}
    needs: [build, test-shard]
    runs-on: ubuntu-latest
    steps:
      - run: '[ "${{ needs.build.result }}" = success ] && [ "${{ needs.test-shard.result }}" = success ]'

  plugin-sdk:
    if: ${{ !startsWith(github.head_ref, 'release-please--') && !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres: *postgres
    defaults:
      run:
        working-directory: server
    env:
      DATABASE_URL: postgres://fliks:fliks@localhost:5432/fliks
      SQLX_OFFLINE: 'true'
      FLIKS_HARNESS_PG_URL: postgres://fliks:fliks@localhost:5432/postgres
      CARGO_TARGET_DIR: ${{ github.workspace }}/server/target
      FLIKS_TEST_WASM_DIR: ${{ github.workspace }}/server/target/wasm32-wasip2/release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          shared-key: server-plugin-sdk
          workspaces: server
      - uses: ./.github/actions/fixture-components
      - name: plugin SDK tests (harness on the fixture)
        working-directory: server/crates/plugin-sdk
        run: cargo test --workspace

  # Catches a Linux-only edit breaking the Windows target on main, before the release build does.
  windows-clippy:
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: server
    env:
      SQLX_OFFLINE: 'true'
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          workspaces: server
      # What the Windows release build compiles: the integration tests are Unix-only.
      - run: cargo clippy --workspace --lib --bins -- -D warnings
