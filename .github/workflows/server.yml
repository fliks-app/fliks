# Rust server: fmt, clippy, tests, sqlx offline cache and openapi.json drift. Linux only; parity runs locally.
name: Server

on:
  pull_request:
    branches: [main]
    paths:
      - 'server/**'
      - '.github/workflows/server.yml'
  push:
    branches: [main]
    paths:
      - 'server/**'
      - '.github/workflows/server.yml'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: fliks
          POSTGRES_PASSWORD: fliks
          POSTGRES_DB: fliks
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fliks"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: server
    env:
      DATABASE_URL: postgres://fliks:fliks@localhost:5432/fliks
      # With DATABASE_URL set, query! would compile against the unmigrated DB; prepare --check forces online itself.
      SQLX_OFFLINE: 'true'
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      # The restore test runs pg_dump against the Postgres 18 service; the runner image ships 16.
      - name: PostgreSQL 18 client tools
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-18
          echo /usr/lib/postgresql/18/bin >> "$GITHUB_PATH"
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # No query! macros yet, so no .sqlx cache: the check starts once the directory is committed.
      - name: sqlx offline cache is current
        run: |
          if [ -d .sqlx ]; then
            cargo install sqlx-cli --locked --no-default-features --features postgres,rustls
            cargo run -q -p fliks-server -- migrate
            cargo sqlx prepare --check --workspace
          else
            echo "::notice::no .sqlx directory, sqlx prepare check skipped"
          fi
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USERNAME: fliks
          DB_PASSWORD: fliks
          DB_NAME: fliks
      - name: openapi.json is current
        run: cargo run -q -p fliks-server -- openapi | diff - openapi.json
