# Rust server and plugin SDK: fmt, clippy (Linux, and Windows debug), tests (plugins on the wasm fixture), sqlx
# offline cache and openapi.json drift. Tests run on Linux; parity runs locally.
name: Server

on:
  pull_request:
    branches: [main]
    paths: &paths
      - 'server/**'
      - '!server/**/*.md'
      - '.github/workflows/server.yml'
  push:
    branches: [main]
    paths: *paths

# A newer PR push supersedes a running one; a main run must finish to save the caches.
concurrency:
  group: server-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Full debuginfo of the optimised deps fills the runner disk and the cache; file:line is enough.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  rust:
    # Release PRs only bump versions; main re-runs this after the merge.
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: fliks
          POSTGRES_PASSWORD: fliks
          POSTGRES_DB: fliks
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fliks"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: server
    env:
      DATABASE_URL: postgres://fliks:fliks@localhost:5432/fliks
      # With DATABASE_URL set, query! would compile against the unmigrated DB; prepare --check forces online itself.
      SQLX_OFFLINE: 'true'
      S8_PG_ADMIN_URL: postgres://fliks:fliks@localhost:5432/postgres
      FLIKS_HARNESS_PG_URL: postgres://fliks:fliks@localhost:5432/postgres
      # One target dir for both workspaces: the plugin SDK reuses the compiled dependencies (455 of 477 crates).
      CARGO_TARGET_DIR: ${{ github.workspace }}/server/target
      # Where `cargo xtask build` leaves the fixture.
      FLIKS_TEST_WASM_DIR: ${{ github.workspace }}/server/target/wasm32-wasip2/release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          # PR caches would evict main's from the repository's 10 GB.
          save-if: ${{ github.ref == 'refs/heads/main' }}
          workspaces: server
      # The restore test runs pg_dump against the Postgres 18 service; the runner image ships 16.
      - name: PostgreSQL 18 client tools
        run: ${{ github.workspace }}/.github/scripts/install-pg18-client.sh
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: plugin SDK fmt and clippy (native and wasm32-wasip2)
        working-directory: server/crates/plugin-sdk
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo clippy --workspace --all-targets --target wasm32-wasip2 -- -D warnings
      - name: build the fixture component
        working-directory: server/crates/plugin-sdk
        run: cargo xtask build examples/fixture-guest
      - uses: taiki-e/install-action@9252097d36d2d3618ad98f5d873696a962b6897c # nextest
      # Includes the plugin host tests (`--test plugins`), which fail under CI without the fixture.
      # nextest pools every test binary instead of running them one after another; this workspace has no doctests.
      - run: cargo nextest run --workspace
      - name: plugin SDK tests (harness on the fixture)
        working-directory: server/crates/plugin-sdk
        run: cargo test --workspace
      # The binary `cargo nextest` built: `cargo run` would rebuild the deps without the dev-dependency features.
      - name: openapi.json is current
        run: target/debug/fliks-server openapi | diff - openapi.json
      - name: sqlx offline cache is current
        run: |
          if [ -d .sqlx ]; then
            cargo install sqlx-cli@0.8.6 --locked --no-default-features --features postgres,rustls
            target/debug/fliks-server migrate
            cargo sqlx prepare --check --workspace
          else
            echo "::notice::no .sqlx directory, sqlx prepare check skipped"
          fi
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USERNAME: fliks
          DB_PASSWORD: fliks
          DB_NAME: fliks

  # Release builds only run on main and tags; this keeps a Linux-only edit from breaking the Windows target.
  windows-clippy:
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    runs-on: windows-latest
    defaults:
      run:
        working-directory: server
    env:
      SQLX_OFFLINE: 'true'
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          workspaces: server
      # What the Windows release build compiles: the integration tests are Unix-only.
      - run: cargo clippy --workspace --lib --bins -- -D warnings
