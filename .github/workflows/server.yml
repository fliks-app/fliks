# Rust server and plugin SDK: fmt, clippy, tests (plugins on the wasm fixture), sqlx offline cache and
# openapi.json drift. Linux only; parity runs locally.
name: Server

on:
  pull_request:
    branches: [main]
    paths:
      - 'server/**'
      - '.github/workflows/server.yml'
  push:
    branches: [main]
    paths:
      - 'server/**'
      - '.github/workflows/server.yml'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Full debuginfo of the optimised deps fills the runner disk and the cache; file:line is enough.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  rust:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: fliks
          POSTGRES_PASSWORD: fliks
          POSTGRES_DB: fliks
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fliks"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: server
    env:
      DATABASE_URL: postgres://fliks:fliks@localhost:5432/fliks
      # With DATABASE_URL set, query! would compile against the unmigrated DB; prepare --check forces online itself.
      SQLX_OFFLINE: 'true'
      S8_PG_ADMIN_URL: postgres://fliks:fliks@localhost:5432/postgres
      FLIKS_HARNESS_PG_URL: postgres://fliks:fliks@localhost:5432/postgres
      # Where `cargo xtask build` leaves the fixture: the SDK workspace's own target dir.
      FLIKS_TEST_WASM_DIR: ${{ github.workspace }}/server/crates/plugin-sdk/target/wasm32-wasip2/release
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            server
            server/crates/plugin-sdk
      # The restore test runs pg_dump against the Postgres 18 service; the runner image ships 16.
      - name: PostgreSQL 18 client tools
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-18
          echo /usr/lib/postgresql/18/bin >> "$GITHUB_PATH"
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: plugin SDK fmt and clippy (native and wasm32-wasip2)
        working-directory: server/crates/plugin-sdk
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo clippy --workspace --all-targets --target wasm32-wasip2 -- -D warnings
      - name: build the fixture component
        working-directory: server/crates/plugin-sdk
        run: cargo xtask build examples/fixture-guest
      # Includes the plugin host tests (`--test plugins`), which fail under CI without the fixture.
      - run: cargo test --workspace
      - name: plugin SDK tests (harness on the fixture)
        working-directory: server/crates/plugin-sdk
        run: cargo test --workspace
      # The binary `cargo test` built: `cargo run` would rebuild the deps without the dev-dependency features.
      - name: openapi.json is current
        run: target/debug/fliks-server openapi | diff - openapi.json
      - name: sqlx offline cache is current
        run: |
          if [ -d .sqlx ]; then
            cargo install sqlx-cli@0.8.6 --locked --no-default-features --features postgres,rustls
            target/debug/fliks-server migrate
            cargo sqlx prepare --check --workspace
          else
            echo "::notice::no .sqlx directory, sqlx prepare check skipped"
          fi
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USERNAME: fliks
          DB_PASSWORD: fliks
          DB_NAME: fliks
