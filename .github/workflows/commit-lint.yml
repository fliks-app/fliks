# Validates commit messages on push + PR. Mirrors the local husky hook
# (`.husky/commit-msg`) so a contributor who skipped local hooks can't
# land non-conventional commits on `main`.
name: Lint commit messages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  commitlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: wagoid/commitlint-github-action@b948419dd99f3fd78a6548d48f94e3df7f6bf3ed # v6

  # commitlint's parser is lenient about the body; release-please's is not, and
  # it drops what it can't parse without failing. Same parser, run loudly.
  release-parser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm install --no-save @conventional-commits/parser@0.4.1
      - name: Check messages against release-please's parser
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        # Judge a PR only on what it adds: the event's `base.sha` is frozen at
        # PR creation, so on a long-lived branch it drags in everything already
        # on main and re-reports history nobody can amend. On a push the range
        # is the single new commit — the squash message release-please reads.
        run: |
          if [ -n "$BASE_REF" ]; then
            git fetch -q --depth=1000 origin "$BASE_REF"
            range="origin/$BASE_REF..$HEAD"
          else
            range="$HEAD~1..$HEAD"
          fi
          node .github/scripts/check-commit-parse.mjs "$range"
