# Builds an unsigned LG webOS `.ipk` of the Fliks client on every
# release tag (`v*` produced by release-please) and on manual
# `workflow_dispatch`. The artifact is uploaded to the matching GitHub
# Release.
#
# Production signing happens at LG Content Manager submission time;
# `ares-package` is enough to produce a sideloadable `.ipk` for TVs in
# developer mode and for the LG Content Manager dropbox.
name: Publish LG webOS package

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        run: npm ci

      - name: Build webOS package
        run: npm run webos:build

      - name: Resolve artifact path
        id: art
        run: |
          ipk=$(ls dist/*.ipk | head -n1)
          echo "path=client/$ipk" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$ipk")" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.art.outputs.name }}
          path: ${{ steps.art.outputs.path }}

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ steps.art.outputs.path }}
          fail_on_unmatched_files: true
