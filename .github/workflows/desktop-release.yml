# Builds the Fliks ELECTRON DESKTOP client installers for all three desktop OSes:
#   - Linux   → .deb     (ubuntu-latest)
#   - macOS   → .dmg      (macos-latest)
#   - Windows → .exe/nsis (windows-latest)
#
# This is the thin Electron client under desktop/ — NOT the SwiftUI menu-bar
# server host under macos/, which has its own workflow (macos-dmg.yml). Keep the
# two separate; they share nothing.
#
# Build = three units assembled by electron-builder:
#   1. native C++ compositor addon (desktop/native) — node-gyp rebuild against
#      the Electron 42 ABI, linked to libmpv + SDL2 + GLES/EGL.
#   2. esbuild main/preload bundle  (cd desktop && npm run build).
#   3. the Angular client           (cd client && npx ng build), staged into
#      desktop/web so electron-builder ships it at resources/web.
#   + a vendored self-contained libmpv into desktop/native/vendor per OS.
#
# The native compositor addon (SDL2 + GLES/EGL) is LINUX-ONLY by design — it is
# the OSR self-compositor needed under Mutter/X11. macOS and Windows embed mpv
# natively instead (--wid into a child NSView/HWND, see desktop/src/main/window/
# backends), so they do NOT build the addon. All three OSes still produce an
# installer; mac/win playback lands with their embed backends + vendored libmpv.
name: Desktop release

on:
  workflow_dispatch:
  push:
    # release-please's `v*` tags ship the client installers on the main release
    # alongside the SwiftUI server-host DMG (macos-dmg.yml). `desktop-v*` stays
    # as a dedicated namespace for desktop-only test releases off-cycle.
    tags: ['v*', 'desktop-v*']

# Needed to attach installers to a GitHub Release on a tag push.
permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.os }} → ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Don't cancel the other OSes when one fails — we want to see every
      # platform's outcome on a single run while this is being stabilised.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: deb
            dist_script: dist:linux
            artifact_glob: desktop/release/*.deb
          - os: macos-latest
            label: dmg
            dist_script: dist:mac
            artifact_glob: desktop/release/*.dmg
          - os: windows-latest
            label: exe
            dist_script: dist:win
            artifact_glob: desktop/release/*.exe

    steps:
      - uses: actions/checkout@v6

      # ── Resolve the build version → baked into the installer filenames ──
      # A desktop-v* tag gives the release version; a manual/test run uses the
      # package.json version with a -dev.<sha> prerelease suffix. Both are valid
      # semver, so they can be injected into electron-builder
      # (-c.extraMetadata.version) and appear in the artifact names.
      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/desktop-v* ]]; then
            v="${GITHUB_REF#refs/tags/desktop-v}"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            v="${GITHUB_REF#refs/tags/v}"
          else
            base=$(node -p "require('./desktop/package.json').version")
            v="${base}-dev.$(git rev-parse --short HEAD)"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Resolved desktop version: $v"

      # desktop/package.json declares Node >= 20, but electron-builder 26's
      # transitive deps (@electron/rebuild, node-abi, app-builder-lib) require
      # Node >= 22.12, so the runner uses 22. The addon's Electron 42 ABI is
      # pinned via node-gyp --target/--dist-url and is independent of host Node.
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            desktop/package-lock.json
            client/package-lock.json

      # Cache the heavy downloads each run otherwise repeats: the Electron
      # binary + electron-builder helper tooling (app-builder, ~150-200 MB) and
      # the node-gyp Electron headers. setup-node above already caches the npm
      # store. Paths are listed for all three OSes; actions/cache skips the ones
      # that don't exist on a given runner. Keyed on the Electron major + lock.
      - name: Cache electron / electron-builder / node-gyp
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
            ~/.electron-gyp
            ~/.node-gyp
          key: ${{ runner.os }}-electron42-${{ hashFiles('desktop/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron42-

      # Linux-only: build deps for the native compositor addon (SDL2 + GLES/EGL
      # + libmpv headers). macOS/Windows don't build the addon (they embed mpv
      # natively), so they need no extra build deps here.
      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential python3 pkg-config \
            libsdl2-dev libgles2-mesa-dev libegl1-mesa-dev libmpv-dev

      # macOS embeds in-process libmpv (no SDL/GLES addon). `mpv` provides the
      # libmpv headers the addon compiles against + the dylib the vendor script
      # bundles; `dylibbundler` makes it self-contained (see Vendor step below).
      - name: Install macOS build deps
        if: runner.os == 'macOS'
        run: brew install mpv dylibbundler

      # ── Install node deps (desktop + client) ──
      - name: Install desktop deps
        working-directory: desktop
        run: npm ci

      - name: Install client deps
        working-directory: client
        run: npm ci

      # The self-contained libmpv (FFmpeg statically linked, symbols hidden) is
      # committed at desktop/native/vendor/libmpv.so.2 and bundled by
      # electron-builder (files: native/vendor/**, asarUnpacked). It's the only
      # OS that uses the compositor addon today; mac/win embed mpv natively and
      # vendor their own .dylib/.dll later.
      - name: Verify vendored libmpv (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          f=desktop/native/vendor/libmpv.so.2
          test -f "$f" || { echo "::error::vendored libmpv missing at $f"; exit 1; }
          test -z "$(nm -D "$f" 2>/dev/null | grep ' av_')" \
            || { echo "::error::libmpv exports av_* — not self-contained, will clash with Electron's libffmpeg"; exit 1; }
          echo "vendored libmpv OK: $(du -h "$f" | cut -f1)"

      # Windows embeds mpv via --wid by spawning a vendored mpv.exe. Download a
      # static x64 build (zhongfly/mpv-winbuild — maintained) into native/vendor,
      # which electron-builder ships via the native/vendor/** glob. UNTESTED on
      # real Windows hardware — playback verification needs a Windows box.
      - name: Vendor mpv (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          dest=desktop/native/vendor
          mkdir -p "$dest"
          url=$(curl -fsSL https://api.github.com/repos/zhongfly/mpv-winbuild/releases/latest \
            | grep -oE 'https://[^"]+' \
            | grep -E 'mpv-x86_64-[0-9][^"]*\.7z$' | head -1)
          test -n "$url" || { echo "::error::no mpv x86_64 .7z asset found"; exit 1; }
          echo "Downloading mpv: $url"
          curl -fsSL -o "$RUNNER_TEMP/mpv.7z" "$url"
          7z x -y -o"$dest" "$RUNNER_TEMP/mpv.7z" >/dev/null
          if [ ! -f "$dest/mpv.exe" ]; then
            sub=$(find "$dest" -name mpv.exe -printf '%h\n' | head -1)
            [ -n "$sub" ] && cp -rf "$sub"/. "$dest"/
          fi
          test -f "$dest/mpv.exe" || { echo "::error::mpv.exe missing after extract"; find "$dest" -maxdepth 2; exit 1; }
          rm -f "$dest/libmpv.so.2"  # the committed Linux lib isn't used on Windows
          echo "vendored mpv.exe ($(du -h "$dest/mpv.exe" | cut -f1)) + $(ls "$dest"/*.dll 2>/dev/null | wc -l) DLLs"

      # macOS embeds in-process libmpv (CAOpenGLLayer on the videoWin NSView).
      # Build a self-contained, relocatable libmpv.dylib (+ its deps) from the
      # Homebrew mpv: dylibbundler copies every non-system dep next to it and
      # rewrites load commands to @loader_path. macOS's two-level namespace keeps
      # the bundled FFmpeg distinct from Electron's libffmpeg.dylib. The script
      # also drops the committed Linux libmpv.so.2 (unused on mac). UNTESTED on a
      # real release box — local bring-up only so far.
      - name: Vendor libmpv (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: bash desktop/scripts/vendor-libmpv-mac.sh

      - name: Verify vendored libmpv (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          f=desktop/native/vendor/libmpv.dylib
          test -f "$f" || { echo "::error::vendored libmpv.dylib missing at $f"; exit 1; }
          # libmpv must export no FFmpeg symbols (else it clashes with Electron's
          # bundled libffmpeg.dylib) — the macOS analogue of the Linux av_* check.
          test -z "$(nm -gU "$f" 2>/dev/null | grep ' _av_')" \
            || { echo "::error::libmpv exports _av_ — not self-contained"; exit 1; }
          # nothing in the tree may point outside @loader_path + the system dirs.
          stray=$(otool -L desktop/native/vendor/*.dylib | grep -E '/opt/homebrew|/usr/local' || true)
          test -z "$stray" || { echo "::error::stray non-bundled deps:"; echo "$stray"; exit 1; }
          echo "vendored libmpv OK: $(du -sh desktop/native/vendor | cut -f1)"

      # ── Build the native compositor addon against the Electron 42 ABI ──
      # Linux-only: SDL2 + GLES/EGL OSR compositor (the Mutter/X11 model). macOS
      # and Windows embed mpv natively (--wid) and ship no addon — electron-
      # builder's native/build/Release/** glob simply matches nothing there.
      - name: Build native addon
        if: runner.os == 'Linux'
        working-directory: desktop/native
        shell: bash
        run: |
          ../node_modules/.bin/node-gyp rebuild \
            --target=42.4.0 \
            --dist-url=https://electronjs.org/headers \
            --arch=x64

      # macOS: build the in-process libmpv addon (fliks_player_mac) for arm64.
      # binding.gyp gates this target on OS=='mac' and finds the libmpv headers
      # under the Homebrew prefix (mpv installed above).
      - name: Build native addon (macOS)
        if: runner.os == 'macOS'
        working-directory: desktop/native
        shell: bash
        run: |
          ../node_modules/.bin/node-gyp rebuild \
            --target=42.4.0 \
            --dist-url=https://electronjs.org/headers \
            --arch=arm64

      # ── Build the esbuild main/preload bundle (dist/**) ── CONFIDENT.
      - name: Build main + preload bundle
        working-directory: desktop
        run: npm run build

      # ── Build the Angular client and stage it where electron-builder expects ──
      # angular.json emits to client/dist/client/browser. electron-builder ships
      # desktop/web → resources/web (read at runtime via process.resourcesPath).
      - name: Build Angular client
        working-directory: client
        run: npx ng build --configuration=production

      - name: Stage client into desktop/web
        shell: bash
        run: |
          rm -rf desktop/web
          mkdir -p desktop/web
          cp -r client/dist/client/browser/. desktop/web/

      # ── Package the installer for this OS ──
      # electron-builder publishes to a Release when GH_TOKEN is set and the ref
      # is a tag; we keep that explicit via the attach step below instead, so we
      # disable auto-publish here and just produce the artifact.
      # No GH_TOKEN here: with a token set, electron-builder auto-configures a
      # GitHub publisher and tries to build auto-update metadata (latest*.yml),
      # which crashes in computeChannelNames (Cannot read properties of null
      # reading 'channel'). We don't auto-update via electron-builder — the
      # release artifacts are attached by the softprops step below — so build
      # with publishing fully off.
      - name: Build installer
        working-directory: desktop
        shell: bash
        run: npm run ${{ matrix.dist_script }} -- --publish never -c.extraMetadata.version=${{ steps.version.outputs.version }}

      # ── Upload the installer as a workflow artifact (always) ──
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: fliks-desktop-${{ matrix.label }}-${{ steps.version.outputs.version }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: error

      # ── Attach to the GitHub Release on a desktop tag push ──
      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/desktop-v')
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ matrix.artifact_glob }}
