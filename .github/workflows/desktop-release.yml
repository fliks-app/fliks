# Builds the Fliks ELECTRON DESKTOP client installers for all three desktop OSes:
#   - Linux   → .deb     (ubuntu-latest)
#   - macOS   → .dmg      (macos-latest)
#   - Windows → Velopack Setup.exe (windows-latest): electron-builder --dir, then vpk
#
# This is the thin Electron client under desktop/ — NOT the SwiftUI menu-bar
# server host under macos/, which has its own workflow (macos-server-dmg.yml).
# Keep the two separate; they share nothing.
#
# Build = three units assembled by electron-builder:
#   1. native C++ compositor addon (desktop/native) — node-gyp rebuild against
#      the Electron 45 ABI, linked to libmpv + SDL2 + GLES/EGL.
#   2. esbuild main/preload bundle  (cd desktop && npm run build).
#   3. the Angular client           (cd client && npx ng build), staged into
#      desktop/web so electron-builder ships it at resources/web.
#   + a vendored self-contained libmpv into desktop/native/vendor per OS.
#
# Release checklist: refresh the Windows mpv pin when convenient. Upstream
# (zhongfly/mpv-winbuild) deletes releases after about a month, so we vendor
# the exact 7z we build against into a Fliks-owned release instead of pointing
# at upstream directly:
#   1. Pick a build from https://github.com/zhongfly/mpv-winbuild/releases,
#      download its `mpv-x86_64-*.7z` asset, and check it against that
#      release's own `sha256.txt`.
#   2. `gh release create mpv-winbuild-<upstream-tag> --repo fliks-app/fliks
#      --prerelease --latest=false --notes "..." path/to/mpv-x86_64-*.7z`
#   3. Update MPV_VENDOR_TAG / MPV_VENDOR_ASSET / MPV_VENDOR_SHA256 below.
# The tag must never start with `v`; every `v*`/`desktop-v*` tag trigger in
# this repo's workflows would otherwise fire on it.
#
# The native compositor addon (SDL2 + GLES/EGL) is LINUX-ONLY by design — it is
# the OSR self-compositor needed under Mutter/X11. macOS and Windows embed mpv
# natively instead (--wid into a child NSView/HWND, see desktop/src/main/window/
# backends), so they do NOT build the compositor. macOS builds the in-process
# libmpv addon and Windows the small SMTC (media controls) addon.
name: Desktop release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to stamp (default: the released version + -dev.<run>). Use to re-cut one platform installer for an existing release.'
        required: false
  push:
    # release-please's `v*` tags ship the client installers on the main release
    # alongside the SwiftUI server-host DMG (macos-server-dmg.yml). `desktop-v*` stays
    # as a dedicated namespace for desktop-only test releases off-cycle.
    tags: ['v*', 'desktop-v*']

# Needed to attach installers to a GitHub Release on a tag push.
permissions:
  contents: write

jobs:
  build:
    permissions:
      contents: write
      id-token: write
      attestations: write
    name: ${{ matrix.os }} → ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Don't cancel the other OSes when one fails — we want to see every
      # platform's outcome on a single run while this is being stabilised.
      fail-fast: false
      matrix:
        include:
          # Linux ships both .deb (no in-app update — dpkg needs root) and
          # AppImage (electron-updater self-updates it). macOS ships the .dmg
          # (first install) plus a .zip (the artifact Squirrel.Mac updates from).
          # Pinned, not `latest`: the committed libmpv.so.2 is a noble build and
          # the runtime libs bundled beside it have to be the SONAMEs it asks
          # for, which only noble packages.
          - os: ubuntu-24.04
            label: deb
            dist_script: dist:linux
            artifact_glob: |
              desktop/release/*.deb
              desktop/release/*.AppImage
              desktop/release/latest-linux.yml
          - os: macos-latest
            label: dmg
            dist_script: dist:mac
            artifact_glob: |
              desktop/release/*.dmg
              desktop/release/*.zip
              desktop/release/latest-mac.yml
          - os: windows-latest
            label: exe
            dist_script: dist:win
            artifact_glob: |
              desktop/release/setup/*-Setup.exe

    steps:
      # Real-time scanning of every file written (npm ci, electron-builder, vpk's zip) is a
      # large share of the Windows build time; the runner is throwaway.
      - name: Disable Defender real-time scanning
        if: runner.os == 'Windows'
        shell: pwsh
        run: Set-MpPreference -DisableRealtimeMonitoring $true

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The version is baked into the installer filenames and electron-builder's extraMetadata.
      - name: Resolve version
        id: version
        uses: ./.github/actions/resolve-version
        with:
          override: ${{ inputs.version }}

      # desktop/package.json declares Node >= 20, but electron-builder 26's
      # transitive deps (@electron/rebuild, node-abi, app-builder-lib) require
      # Node >= 22.12, so the runner uses 22. The addon's Electron 45 ABI is
      # pinned via node-gyp --target/--dist-url and is independent of host Node.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            desktop/package-lock.json
            client/package-lock.json

      # Cache the heavy downloads each run otherwise repeats: the Electron
      # binary + electron-builder helper tooling (app-builder, ~150-200 MB) and
      # the node-gyp Electron headers. setup-node above already caches the npm
      # store. Paths are listed for all three OSes; actions/cache skips the ones
      # that don't exist on a given runner. Keyed on the Electron major + lock.
      - name: Cache electron / electron-builder / node-gyp
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
            ~/.electron-gyp
            ~/.node-gyp
          key: ${{ runner.os }}-electron45-${{ hashFiles('desktop/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron45-

      # Linux-only: build deps for the native compositor addon (SDL2 + GL/EGL
      # + libmpv headers). macOS/Windows don't build the compositor (they embed mpv
      # natively), so they need no extra build deps here.
      - name: Install Linux build deps
        if: runner.os == 'Linux'
        # libmpv-dev's recommends and man-db's index rebuild after each package took ~7 minutes.
        run: |
          sudo rm -f /var/lib/man-db/auto-update
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential python3 pkg-config patchelf \
            libsdl2-dev libgl1-mesa-dev libegl1-mesa-dev libmpv-dev

      # macOS embeds in-process libmpv (no SDL/GLES addon). `mpv` provides the
      # libmpv headers the addon compiles against + the dylib the vendor script
      # bundles; `dylibbundler` makes it self-contained (see Vendor step below).
      - name: Install macOS build deps
        if: runner.os == 'macOS'
        run: brew install mpv dylibbundler

      # ── Install node deps (desktop + client) ──
      - name: Install desktop deps
        working-directory: desktop
        run: npm ci

      - name: Install client deps
        working-directory: client
        run: npm ci

      # The self-contained libmpv (FFmpeg statically linked, symbols hidden) is
      # committed at desktop/native/vendor/libmpv.so.2 and bundled by
      # electron-builder (files: native/vendor/**, asarUnpacked). It's the only
      # OS that uses the compositor addon today; mac/win embed mpv natively and
      # vendor their own .dylib/.dll later.
      - name: Vendor libmpv runtime deps (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: bash desktop/scripts/vendor-libmpv-linux.sh

      - name: Verify vendored libmpv (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: bash desktop/scripts/verify-libmpv-linux.sh

      # From a Fliks-owned release (MPV_VENDOR_TAG): zhongfly/mpv-winbuild prunes its
      # releases after about a month. Refresh the pin per the checklist at the top.
      - name: Vendor mpv (Windows)
        if: runner.os == 'Windows'
        shell: bash
        env:
          MPV_VENDOR_TAG: "mpv-winbuild-2026-09-28-e470f8986e"
          MPV_VENDOR_ASSET: "mpv-x86_64-20260928-git-e470f8986e.7z"
          MPV_VENDOR_SHA256: "ddef3932aed791cdc3f2585e5798802e55171ab9dce06d3275bdd9ed2967774d"
        run: bash desktop/scripts/fetch-mpv-windows.sh

      # macOS embeds in-process libmpv (CAOpenGLLayer on the videoWin NSView).
      # Build a self-contained, relocatable libmpv.dylib (+ its deps) from the
      # Homebrew mpv: dylibbundler copies every non-system dep next to it and
      # rewrites load commands to @loader_path. macOS's two-level namespace keeps
      # the bundled FFmpeg distinct from Electron's libffmpeg.dylib. The script
      # also drops the committed Linux libmpv.so.2 (unused on mac). UNTESTED on a
      # real release box — local bring-up only so far.
      - name: Vendor libmpv (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: bash desktop/scripts/vendor-libmpv-mac.sh

      - name: Verify vendored libmpv (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: bash desktop/scripts/verify-libmpv-mac.sh

      # ── Build the native compositor addon against the Electron 45 ABI ──
      # Linux-only: SDL2 + GLES/EGL OSR compositor (the Mutter/X11 model). macOS
      # and Windows embed mpv natively (--wid) and have their own addons below.
      - name: Build native addon
        if: runner.os == 'Linux'
        working-directory: desktop/native
        shell: bash
        run: |
          ../node_modules/.bin/node-gyp rebuild \
            --target=45.0.0 \
            --dist-url=https://electronjs.org/headers \
            --arch=x64

      # macOS: build the in-process libmpv addon (fliks_player_mac) for arm64.
      # binding.gyp gates this target on OS=='mac' and finds the libmpv headers
      # under the Homebrew prefix (mpv installed above).
      - name: Build native addon (macOS)
        if: runner.os == 'macOS'
        working-directory: desktop/native
        shell: bash
        run: |
          ../node_modules/.bin/node-gyp rebuild \
            --target=45.0.0 \
            --dist-url=https://electronjs.org/headers \
            --arch=arm64

      # Windows: the System Media Transport Controls addon (fliks_smtc_win, C++/WinRT).
      - name: Build native addon (Windows)
        if: runner.os == 'Windows'
        working-directory: desktop/native
        shell: bash
        run: |
          ../node_modules/.bin/node-gyp rebuild \
            --target=45.0.0 \
            --dist-url=https://electronjs.org/headers \
            --arch=x64

      # ── Build the esbuild main/preload bundle (dist/**) ── CONFIDENT.
      - name: Build main + preload bundle
        working-directory: desktop
        run: npm run build

      # ── Build the Angular client and stage it where electron-builder expects ──
      # angular.json emits to client/dist/client/browser. electron-builder ships
      # desktop/web → resources/web (read at runtime via process.resourcesPath).
      - name: Build Angular client
        working-directory: client
        run: npx ng build --configuration=production

      - name: Stage client into desktop/web
        shell: bash
        run: |
          rm -rf desktop/web
          mkdir -p desktop/web
          cp -r client/dist/client/browser/. desktop/web/

      # macOS: stage the App Store Connect API key so electron-builder's notarize
      # step (notarytool) can authenticate. Same key the iOS App Store build uses.
      - name: Stage notarization API key (macOS)
        if: runner.os == 'macOS'
        id: asc
        uses: ./.github/actions/stage-asc-key
        with:
          key-id: ${{ secrets.APPSTORE_API_KEY_ID }}
          key-p8-base64: ${{ secrets.APPSTORE_API_KEY_P8_BASE64 }}

      # electron-builder's own CSC_LINK path runs set-key-partition-list with the .p12 password,
      # which macOS 26 rejects (electron-builder #10066): hand it our keychain via CSC_KEYCHAIN.
      - name: Import signing certificate (macOS)
        if: runner.os == 'macOS'
        id: keychain
        uses: ./.github/actions/import-keychain
        with:
          p12-base64: ${{ secrets.MAC_DEVELOPER_ID_CERT_P12_BASE64 }}
          password: ${{ secrets.MAC_DEVELOPER_ID_CERT_PASSWORD }}

      - name: Export the signing keychain (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: echo "CSC_KEYCHAIN=${{ steps.keychain.outputs.keychain }}" >> "$GITHUB_ENV"

      # ── Package the installer for this OS ──
      # With the github `publish` provider configured in electron-builder.yml,
      # `--publish always` (tag builds) generates the auto-update metadata
      # (latest.yml / latest-mac.yml / latest-linux.yml) and uploads it + the
      # installers to the matching GitHub Release; electron-updater in the app
      # reads it from there. Non-tag (workflow_dispatch / dev) runs build with
      # `--publish never` and only produce workflow artifacts. The explicit
      # provider also fixes the old computeChannelNames crash that happened when
      # GH_TOKEN was set without a configured publisher.
      - name: Build installer
        working-directory: desktop
        shell: bash
        # macOS-only notarization env, empty on Linux/Windows. The signing
        # identity comes from the CSC_KEYCHAIN exported by the import step.
        # GH_TOKEN lets electron-builder publish to the GitHub Release on tag builds.
        env:
          APPLE_API_KEY: ${{ steps.asc.outputs.path }}
          APPLE_API_KEY_ID: ${{ runner.os == 'macOS' && secrets.APPSTORE_API_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ runner.os == 'macOS' && secrets.APPSTORE_API_ISSUER_ID || '' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Windows publishes through Velopack below.
          if [[ "$RUNNER_OS" != Windows && ( "$GITHUB_REF" == refs/tags/v* || "$GITHUB_REF" == refs/tags/desktop-v* ) ]]; then
            publish=always
          else
            publish=never
          fi
          version=${{ steps.version.outputs.version }}
          # release-please marks a suffixed version as a pre-release; electron-builder skips a type mismatch.
          [[ "$version" == *-* ]] && type=prerelease || type=release
          npm run ${{ matrix.dist_script }} -- --publish "$publish" -c.extraMetadata.version="$version" -c.publish.releaseType="$type"

      # ── Windows: pack win-unpacked into the Velopack Setup.exe + update feed ──
      # Default `win` channel; the Windows server uses `win-server` in the same release.
      - name: Install vpk
        if: runner.os == 'Windows'
        run: dotnet tool install -g vpk --version 1.2.161

      # A delta needs the previous full package next to the new one; the first
      # Velopack release has none, which is not an error.
      - name: Download previous Velopack release
        if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/')
        continue-on-error: true
        working-directory: desktop
        run: vpk download github --repoUrl https://github.com/${{ github.repository }} --outputDir release/velopack

      - name: Pack Velopack release
        if: runner.os == 'Windows'
        working-directory: desktop
        run: >
          vpk pack --packId FliksDesktop --packVersion ${{ steps.version.outputs.version }}
          --packDir release/win-unpacked --runtime win-x64 --mainExe Fliks.exe --packTitle Fliks --packAuthors Fliks
          --icon build/icon.ico --splashImage build/splash.png --aumid media.fliks.desktop
          --noPortable --outputDir release/velopack

      # The Fliks installer window around Velopack's silent Setup.exe (windows/Fliks.Setup).
      - name: Build installer
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          dotnet build windows/Fliks.Setup/Fliks.Setup.csproj -c Release -o desktop/release/setup `
            -p:PackId=FliksDesktop -p:MainExe=Fliks.exe -p:ProductTitle=Fliks `
            "-p:PayloadPath=$PWD/desktop/release/velopack/FliksDesktop-win-Setup.exe" `
            "-p:SetupIcon=$PWD/desktop/build/icon.ico" `
            "-p:AssemblyName=Fliks-Client-$env:VERSION-Setup"
          if ($LASTEXITCODE -ne 0) { throw "installer build failed ($LASTEXITCODE)" }

      # `gh release upload` only POSTs the assets (editing the release is refused with the
      # job token); the previous release's packages pulled for the delta stay out, and
      # Velopack's bare Setup.exe is replaced by the installer that wraps it.
      - name: Attach Velopack release
        if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $files = Get-ChildItem desktop/release/velopack -File |
            Where-Object { ($_.Extension -ne '.nupkg' -or $_.Name -like "*-$env:VERSION-*") -and $_.Name -notlike '*-Setup.exe' } |
            ForEach-Object FullName
          $files += "desktop/release/setup/Fliks-Client-$env:VERSION-Setup.exe"
          gh release upload "${{ github.ref_name }}" @files --clobber

      - name: Attest build provenance
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: ${{ matrix.artifact_glob }}

      # ── Upload the installers + update metadata as a workflow artifact ──
      # On tag builds electron-builder already attached these to the Release; the
      # workflow artifact is for inspection / non-tag runs.
      - name: Upload installer artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: fliks-desktop-${{ matrix.label }}-${{ steps.version.outputs.version }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: warn
          # Installers and packages are already compressed.
          compression-level: 0
