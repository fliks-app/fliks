# Compiles the tvOS app on pull requests: `tvos-publish.yml` only builds on a tag,
# so a Swift error in appletv/ otherwise surfaces at release time. Unsigned, like native-build.

name: tvOS build

on:
  pull_request:
    paths:
      - 'appletv/**'
      - '.github/workflows/tvos-build.yml'
  push:
    branches: [main]
    paths:
      - 'appletv/**'
      - '.github/workflows/tvos-build.yml'

concurrency:
  group: tvos-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tvos:
    runs-on: macos-15
    defaults:
      run:
        working-directory: appletv
    steps:
      - uses: actions/checkout@v6

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # The .xcodeproj isn't versioned — XcodeGen rebuilds it from project.yml.
      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        run: xcodegen generate --spec project.yml

      - name: Compile tvOS app
        run: |
          xcodebuild \
            -project FliksTV.xcodeproj \
            -scheme FliksTV \
            -configuration Debug \
            -destination 'generic/platform=tvOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
