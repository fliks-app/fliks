# The engine release in engine.lock, the Dockerfile engine image (tag and digest), the server's engine
# crate tag and the Cargo.lock files move together (scripts/bump-engine.sh); a hand edit of one of them goes red here.
name: Engine lock

on:
  pull_request:
    branches: [main]
    paths:
      - 'engine.lock'
      - 'Dockerfile'
      - 'server/crates/server/Cargo.toml'
      - 'server/Cargo.lock'
      - 'server/crates/plugin-sdk/Cargo.lock'
      - '.github/scripts/check-engine-lock.sh'
      - 'scripts/bump-engine.sh'
      - '.github/workflows/engine-lock.yml'

permissions:
  contents: read

concurrency:
  group: engine-lock-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Engine pins agree with each other and with the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/scripts/check-engine-lock.sh
