# The engine release in engine.lock, the Dockerfile engine image (tag and digest), the server's engine
# crate tag and the Cargo.lock files move together (scripts/bump-engine.sh); a hand edit of one of them goes red here.
name: Engine lock

on:
  pull_request:
    branches: [main]
    paths:
      - 'engine.lock'
      - 'Dockerfile'
      - 'server/crates/server/Cargo.toml'
      - 'server/Cargo.lock'
      - 'server/crates/plugin-sdk/Cargo.lock'
      - '.github/scripts/check-engine-lock.sh'
      - 'scripts/bump-engine.sh'
      - '.github/workflows/engine-lock.yml'

permissions:
  contents: read

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Engine pins agree with each other and with the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/scripts/check-engine-lock.sh
