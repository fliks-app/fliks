# Deploys the Cast receiver shell to GitHub Pages on every push to main
# that touches cast-receiver/. The receiver is static (no build step) —
# we just publish the directory as-is. The published URL is what gets
# registered once in the Google Cast Developer Console.
#
# After the first successful run, enable Pages in the repo settings:
#   Settings → Pages → Source = "GitHub Actions"
# Then register the URL `https://<owner>.github.io/<repo>/` (or your
# custom domain) in the Cast Console as the receiver app's URL.
name: Deploy Cast receiver

on:
  push:
    branches: [main]
    paths:
      - 'cast-receiver/**'
      - 'server/public/emoji/**'
      - '.github/workflows/deploy-cast-receiver.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: cp -r server/public/emoji cast-receiver/emoji
      # The Cast OS has no emoji font and its Chrome cannot read COLRv1: ship Noto's CBDT build.
      - run: |
          mkdir -p cast-receiver/fonts
          base=https://raw.githubusercontent.com/googlefonts/noto-emoji/v2.051/fonts
          curl -fsSL -o cast-receiver/fonts/NotoColorEmoji.ttf "$base/NotoColorEmoji.ttf"
          curl -fsSL -o cast-receiver/fonts/LICENSE "$base/LICENSE"
          echo "72a635cb3d2f3524c51620cdde406b217204e8a6a06c6a096ff8ed4b5fd6e27b  cast-receiver/fonts/NotoColorEmoji.ttf" | sha256sum -c
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: cast-receiver
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
