# Angular unit tests (client/**/*.spec.ts), the Tizen widget build and the Electron desktop typecheck and tests.
# None ran in CI before: native-build.yml only compiles the shells.
name: Client

on:
  pull_request:
    branches: [main]
    paths: &paths
      - 'client/**'
      - 'desktop/**'
      - '!**/*.md'
      - '.github/workflows/client.yml'
  push:
    branches: [main]
    paths: *paths

concurrency:
  group: client-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  client:
    # Release PRs only bump versions; main re-runs this after the merge.
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npx ng test --watch=false

  # The release-only widget build runs the Chromium 85 CSS guard; a dependency bump must trip it here.
  tizen:
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run tizen:build

  desktop:
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # The tests run .ts files directly: Node 24 strips the types.
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      # Scripts off: the Electron binary download is not needed to typecheck or test.
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test

  # The Windows media-controls addon (C++/WinRT) only compiles on Windows.
  desktop-win:
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci --ignore-scripts
      - name: Build the SMTC addon against the Electron 45 ABI
        working-directory: desktop/native
        run: ../node_modules/.bin/node-gyp rebuild --target=45.0.0 --dist-url=https://electronjs.org/headers --arch=x64
      - run: test -f native/build/Release/fliks_smtc_win.node
