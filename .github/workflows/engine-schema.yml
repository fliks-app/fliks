# The engine's wire types are generated from the openapi.json of the release pinned in engine.lock.
# A hand edit, or a bump that forgot to regenerate, goes red here.
name: Engine schema

on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/src/modules/engine/**'
      - 'engine.lock'
      - 'scripts/bump-engine.sh'
      - '.github/workflows/engine-schema.yml'

jobs:
  schema:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6

      - name: Find the openapi.json of the pinned release
        id: release
        run: |
          v="$(sed -n 's/^version=//p' engine.lock)"
          if gh release view "v$v" -R fliks-app/engine --json assets -q '.assets[].name' | grep -qx openapi.json; then
            echo "version=$v" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::engine v$v has no openapi.json asset, schema check skipped"
          fi

      - if: steps.release.outputs.version
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - if: steps.release.outputs.version
        working-directory: backend
        run: npm ci --ignore-scripts

      - if: steps.release.outputs.version
        run: |
          scripts/bump-engine.sh --schema "${{ steps.release.outputs.version }}"
          git diff --exit-code -- backend/src/modules/engine/schema.d.ts
