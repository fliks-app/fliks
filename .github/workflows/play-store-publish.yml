# Builds a signed AAB of the Fliks Android client and uploads it to
# the Play Store internal track on every release tag (`v*` produced by
# release-please) plus on manual `workflow_dispatch` for ad-hoc
# re-uploads to other tracks.
#
# On tag builds it also assembles a signed APK and attaches it to the
# GitHub release (release-please created it for the tag) as
# `Fliks-<version>.apk`, for direct sideloading outside the Play Store.
#
# To backfill the APK on an already-published release, run the workflow
# via `workflow_dispatch` with the `apk_tag` input (e.g. `v1.8.0`): it
# checks out that tag, builds + attaches the signed APK, and skips the
# Play Store upload entirely.
#
# To (re)publish to the Amazon Appstore only (e.g. after a Play Store-only
# failure, or to retry without rebuilding), dispatch with `amazon_tag` set:
# it downloads that tag's already-attached APK and skips the Android build.
#
# Promotion from `internal` → `alpha`/`beta`/`production` stays a
# manual click in Play Console; this workflow never touches anything
# beyond what the dispatch input asks for.
#
# Required repo secrets (one-shot setup, see
# `plans/play-store-automation.plan.md`):
#   - ANDROID_UPLOAD_KEYSTORE_BASE64
#   - ANDROID_UPLOAD_KEYSTORE_PASSWORD
#   - ANDROID_UPLOAD_KEY_ALIAS
#   - ANDROID_UPLOAD_KEY_PASSWORD
#   - PLAY_STORE_SERVICE_ACCOUNT_JSON
#   - AMAZON_APPSTORE_CLIENT_ID, AMAZON_APPSTORE_CLIENT_SECRET, AMAZON_APPSTORE_APP_ID
name: Publish Android to Stores

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      track:
        description: 'Play Store track'
        type: choice
        options: [internal, alpha, beta, production]
        default: internal
      apk_tag:
        description: 'Existing release tag to (re)build a signed APK for and attach to its GitHub release, e.g. v1.8.0. APK-only — skips the Play Store upload. Leave empty for a normal Play Store run.'
        type: string
        default: ''
      amazon_tag:
        description: 'Existing release tag to (re)publish to the Amazon Appstore only, e.g. v1.8.0. Skips the Android build and the Play Store upload entirely. Leave empty for a normal run.'
        type: string
        default: ''

permissions:
  # `write` so the signed APK can be attached to the GitHub release that
  # release-please created for the `v*` tag.
  contents: write

jobs:
  build-and-publish:
    # `amazon_tag` re-publishes an already-attached APK to Amazon only.
    if: github.event.inputs.amazon_tag == ''
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v6
        with:
          # `apk_tag` rebuilds an already-released tag (its tree carries the
          # old workflow, so we run main's workflow against the tag's source).
          # Otherwise build the triggering ref.
          ref: ${{ github.event.inputs.apk_tag || github.ref }}
          # Full history needed so `git rev-list --count HEAD` produces
          # a meaningful commit count for the versionCode.
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v4

      - name: Install client dependencies
        run: npm ci

      - name: Build Angular client
        run: npm run build

      - name: Capacitor sync to Android shell
        run: npx cap sync android

      - name: Compute versionCode from commit count
        id: vcode
        run: echo "value=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"
        working-directory: ${{ github.workspace }}

      - name: Decode upload keystore
        run: |
          echo "${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}" \
            | base64 -d > android/app/fliks-upload.jks

      - name: Assemble signed release AAB
        # Skipped in APK-only mode (`apk_tag` dispatch) — that path attaches a
        # sideload build to an existing release and never touches Play Store.
        if: github.event.inputs.apk_tag == ''
        env:
          ORG_GRADLE_PROJECT_FLIKS_VERSION_CODE: ${{ steps.vcode.outputs.value }}
          ORG_GRADLE_PROJECT_FLIKS_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_FLIKS_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_FLIKS_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew bundleRelease

      - name: Upload the signed AAB for the Play Store job
        if: github.event.inputs.apk_tag == ''
        uses: actions/upload-artifact@v4
        with:
          name: signed-aab
          path: client/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 1

      # Signed APK for direct sideloading, attached to the GitHub release.
      # Runs on every `v*` tag push, and on an `apk_tag` dispatch that targets
      # an already-released tag. Same release signingConfig that signs the AAB.
      - name: Assemble signed release APK
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.apk_tag != ''
        env:
          ORG_GRADLE_PROJECT_FLIKS_VERSION_CODE: ${{ steps.vcode.outputs.value }}
          ORG_GRADLE_PROJECT_FLIKS_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_FLIKS_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_FLIKS_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew assembleRelease

      - name: Stage signed APK with a versioned name
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.apk_tag != ''
        id: apk
        run: |
          tag="${{ github.event.inputs.apk_tag }}"
          [ -z "$tag" ] && tag="$GITHUB_REF_NAME"
          dest="Fliks-${tag#v}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/$dest"
          echo "path=$dest" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Attach signed APK to the GitHub release
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.apk_tag != ''
        # `gh release upload` only POSTs the asset. The action we used before
        # PATCHes the release first to sync its fields, and that call is
        # refused ("Resource not accessible by integration") even with
        # contents: write — attaching a file never needed it.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ steps.apk.outputs.tag }}" "${{ steps.apk.outputs.path }}" --clobber
        working-directory: ${{ github.workspace }}

  # Separate job so a Play Store failure (rejected release notes, a transient API
  # error) can't skip amazon-appstore, which only needs the APK-attach job above.
  publish-play-store:
    needs: build-and-publish
    if: github.event.inputs.apk_tag == ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v4
        with:
          name: signed-aab
          path: client/android/app/build/outputs/bundle/release

      - name: Extract latest release notes from CHANGELOG.md
        working-directory: client
        # release-please writes one section per release in the format
        # `## [X.Y.Z]` (followed by the date). Awk grabs everything
        # between the first such header and the next one — that is
        # the body of the most recent release. The result is dropped
        # into the path the upload action reads (en-US default).
        run: |
          mkdir -p android/app/src/main/play/release-notes/en-US
          awk '
            /^## \[/ { count++; if (count > 1) exit }
            count == 1 { print }
          ' ../CHANGELOG.md \
            | tail -n +2 \
            > android/app/src/main/play/release-notes/en-US/default.txt
          # Play Store rejects empty release notes — fail loudly rather
          # than upload a blank section.
          if [ ! -s android/app/src/main/play/release-notes/en-US/default.txt ]; then
            echo "::error::Could not extract release notes from CHANGELOG.md"
            exit 1
          fi

      - name: Upload to Play Store
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
          packageName: media.fliks.app
          releaseFiles: client/android/app/build/outputs/bundle/release/app-release.aab
          # `tracks`, not `track`: the singular is deprecated and the action already converts
          # it internally. A single value is accepted, so the dispatch input stays a choice.
          tracks: ${{ github.event.inputs.track || 'internal' }}
          # `draft` is required while the app itself is in draft status
          # in Play Console (no production release ever submitted).
          # Once the app is approved + published live, this can flip to
          # `completed` so each upload rolls out automatically to the
          # selected track.
          status: draft
          # Commit the edit normally so Google sends the changes for review:
          # the track auto-reviews and the Edit API rejects the upload when
          # changesNotSentForReview is set on it.
          whatsNewDirectory: client/android/app/src/main/play/release-notes

  # Replaces the APK of the Amazon Appstore listing (Fire TV + Fire tablets) with the one
  # just attached to the release, then commits the edit, which sends it to Amazon review.
  amazon-appstore:
    needs: build-and-publish
    # `always()`: build-and-publish is skipped (not failed) on an amazon-only
    # dispatch, and a skipped dependency would otherwise skip this job too.
    if: always() && (needs.build-and-publish.result == 'success' || github.event.inputs.amazon_tag != '') && (startsWith(github.ref, 'refs/tags/v') || github.event.inputs.amazon_tag != '')
    runs-on: ubuntu-latest
    # Two tags racing for the same open Amazon edit (`reuse-any-open-edit` below)
    # would clobber each other's changes; serialize per app, not per tag.
    concurrency:
      group: amazon-appstore
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      AMAZON_TAG: ${{ github.event.inputs.amazon_tag || github.ref_name }}
      APP: https://developer.amazon.com/api/appstore/v1/applications/${{ secrets.AMAZON_APPSTORE_APP_ID }}
    steps:
      - name: Download the signed APK from the release
        run: gh release download "$AMAZON_TAG" -R "$GITHUB_REPOSITORY" -p 'Fliks-*.apk' -O fliks.apk

      - name: Replace the APK and commit the edit
        env:
          CLIENT_ID: ${{ secrets.AMAZON_APPSTORE_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.AMAZON_APPSTORE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          # Only an error body is printed: a successful one carries the token.
          resp=$(curl -sS --fail-with-body https://api.amazon.com/auth/o2/token \
            -d grant_type=client_credentials -d scope=appstore::apps:readwrite \
            --data-urlencode "client_id=$CLIENT_ID" --data-urlencode "client_secret=$CLIENT_SECRET") \
            || { echo "::error::Amazon token request failed: $resp"; exit 1; }
          token=$(jq -r '.access_token // empty' <<<"$resp")
          [ -n "$token" ] || { echo "::error::Amazon token response has no access_token"; exit 1; }
          auth="Authorization: Bearer $token"
          # Amazon explains a refusal only in the body, so a failed call prints it.
          api() {
            local out
            out=$(curl -sS --fail-with-body -H "$auth" "$@") \
              || { echo "::error::Amazon ${*: -1} failed: $out" >&2; return 1; }
            printf '%s' "$out"
          }
          etag() { api -D - "$1" | awk 'tolower($1)=="etag:" {print $2}' | tr -d '\r'; }

          # Only one edit can be open per app: reuse the one a failed run left behind.
          edit=$(curl -s -H "$auth" "$APP/edits" | jq -r '.id // empty' 2>/dev/null || true)
          [ -n "$edit" ] || edit=$(api -X POST "$APP/edits" | jq -r .id)

          apk=$(api "$APP/edits/$edit/apks" | jq -r '.[0].id')
          api -X PUT -H "If-Match: $(etag "$APP/edits/$edit/apks/$apk")" \
            -H 'Content-Type: application/octet-stream' -H 'fileName: fliks.apk' \
            --data-binary @fliks.apk "$APP/edits/$edit/apks/$apk/replace" > /dev/null

          # Validation refuses an edit without release notes for en-US. fr-FR is
          # optional: only a listing the app already has is updated.
          notes() {
            local url="$APP/edits/$edit/listings/$1" listing
            listing=$(curl -sf -H "$auth" "$url") || { [ "$1" != en-US ] && return 0; api "$url"; return 1; }
            jq --arg n "$2" '.recentChanges = $n' <<<"$listing" \
              | api -X PUT -H "If-Match: $(etag "$url")" -H 'Content-Type: application/json' \
                  --data-binary @- "$url" > /dev/null
          }
          notes en-US 'Bug fixes and improvements.'
          notes fr-FR 'Corrections de bugs et améliorations.'

          api -X POST "$APP/edits/$edit/validate" > /dev/null
          api -X POST -H "If-Match: $(etag "$APP/edits/$edit")" "$APP/edits/$edit/commit" > /dev/null
