# Builds a signed AAB of the Fliks Android client and sends it to the
# Play Store production track for review on every stable release tag
# (`v*` produced by release-please), or to the track a manual
# `workflow_dispatch` names. Google publishes it once approved.
#
# On tag builds it also assembles a signed APK and attaches it to the
# GitHub release (release-please created it for the tag) as
# `Fliks-<version>.apk`, for direct sideloading outside the Play Store,
# next to `android-version.json` (AGP's output metadata), which F-Droid's
# update check reads from the latest release.
#
# To backfill the APK on an already-published release, run the workflow
# via `workflow_dispatch` with the `apk_tag` input (e.g. `v1.8.0`): it
# checks out that tag, builds + attaches the signed APK, and skips the
# Play Store upload entirely.
#
# To (re)publish to the Amazon Appstore only (e.g. after a Play Store-only
# failure, or to retry without rebuilding), dispatch with `amazon_tag` set:
# it downloads that tag's already-attached APK and skips the Android build.
# A tag that lands while Amazon still reviews the previous release is skipped
# with a warning (the next tag ships); an `amazon_tag` dispatch then fails.
#
# Required repo secrets (one-shot setup, see
# `plans/play-store-automation.plan.md`):
#   - ANDROID_UPLOAD_KEYSTORE_BASE64
#   - ANDROID_UPLOAD_KEYSTORE_PASSWORD
#   - ANDROID_UPLOAD_KEY_ALIAS
#   - ANDROID_UPLOAD_KEY_PASSWORD
#   - ANDROID_GOOGLE_SERVICES_JSON_BASE64 (optional: without it the build has no push)
#   - PLAY_STORE_SERVICE_ACCOUNT_JSON
#   - AMAZON_APPSTORE_CLIENT_ID, AMAZON_APPSTORE_CLIENT_SECRET, AMAZON_APPSTORE_APP_ID
name: Publish Android to Stores

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      track:
        description: 'Play Store track'
        type: choice
        options: [internal, alpha, beta, production]
        default: internal
      apk_tag:
        description: 'Existing release tag to (re)build a signed APK for and attach to its GitHub release, e.g. v1.8.0. APK-only — skips the Play Store upload. Tags up to v7.0.1 predate the build flavors and cannot be rebuilt. Leave empty for a normal Play Store run.'
        type: string
        default: ''
      amazon_tag:
        description: 'Existing release tag to (re)publish to the Amazon Appstore only, e.g. v1.8.0. Skips the Android build and the Play Store upload entirely. Leave empty for a normal run.'
        type: string
        default: ''

permissions:
  # `write` so the signed APK can be attached to the GitHub release that
  # release-please created for the `v*` tag.
  contents: write

jobs:
  build-and-publish:
    permissions:
      contents: write
      id-token: write
      attestations: write
    # `amazon_tag` re-publishes an already-attached APK to Amazon only.
    if: github.event.inputs.amazon_tag == ''
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `apk_tag` rebuilds an already-released tag (its tree carries the
          # old workflow, so we run main's workflow against the tag's source).
          # Otherwise build the triggering ref.
          ref: ${{ github.event.inputs.apk_tag || github.ref }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: client/package-lock.json

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 21

      # Read-only: a tag can't save a cache other refs restore; ci.yml's android job seeds it from main.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
        with:
          build-root-directory: client/android
          cache-read-only: true

      # Only what the build compiles against; the default set pulls the emulator (see ci.yml).
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: 'platform-tools platforms;android-36'

      - name: Install client dependencies
        run: npm ci

      - name: Build Angular client
        run: npm run build

      - name: Capacitor sync to Android shell
        run: npx cap sync android

      - name: Decode upload keystore
        run: |
          echo "${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}" \
            | base64 -d > android/app/fliks-upload.jks

      # Optional: a build without it (forks) compiles without Firebase and reports push unavailable.
      - name: Decode Firebase config
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > android/app/google-services.json
          fi

      # One Gradle run for both outputs: the AAB (skipped in APK-only mode, `apk_tag`) and,
      # on a tag or an `apk_tag` dispatch, the sideload APK with the same release signingConfig.
      - name: Assemble signed release
        env:
          ORG_GRADLE_PROJECT_FLIKS_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_FLIKS_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_FLIKS_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
          APK_TAG: ${{ github.event.inputs.apk_tag }}
        run: |
          tasks=()
          [ -z "$APK_TAG" ] && tasks+=(bundleProprietaryRelease)
          if [[ "$GITHUB_REF" == refs/tags/v* || -n "$APK_TAG" ]]; then tasks+=(assembleProprietaryRelease); fi
          cd android
          ./gradlew "${tasks[@]}"

      - name: Upload the signed AAB for the Play Store job
        if: github.event.inputs.apk_tag == ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: signed-aab
          path: client/android/app/build/outputs/bundle/proprietaryRelease/app-proprietary-release.aab
          retention-days: 1

      - name: Stage signed APK with a versioned name
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.apk_tag != ''
        id: apk
        run: |
          tag="${{ github.event.inputs.apk_tag }}"
          [ -z "$tag" ] && tag="$GITHUB_REF_NAME"
          dest="Fliks-${tag#v}.apk"
          cp android/app/build/outputs/apk/proprietary/release/app-proprietary-release.apk "$GITHUB_WORKSPACE/$dest"
          cp android/app/build/outputs/apk/proprietary/release/output-metadata.json "$GITHUB_WORKSPACE/android-version.json"
          echo "path=$dest" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.apk_tag != ''
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: ${{ steps.apk.outputs.path }}

      - name: Attach signed APK to the GitHub release
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.apk_tag != ''
        # `gh release upload` only POSTs the asset. The action we used before
        # PATCHes the release first to sync its fields, and that call is
        # refused ("Resource not accessible by integration") even with
        # contents: write — attaching a file never needed it.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ steps.apk.outputs.tag }}" "${{ steps.apk.outputs.path }}" android-version.json --clobber
        working-directory: ${{ github.workspace }}

  # Separate job so a Play Store failure (rejected release notes, a transient API
  # error) can't skip amazon-appstore, which only needs the APK-attach job above.
  publish-play-store:
    needs: build-and-publish
    # Pre-releases (v5.1.0-beta.1) ship the APK on GitHub only, never to a store.
    if: github.event.inputs.apk_tag == '' && !(startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, '-'))
    runs-on: ubuntu-latest
    # A new edit invalidates the open one, so two runs must not overlap.
    concurrency:
      group: play-store
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: signed-aab
          path: client/android/app/build/outputs/bundle/release

      # A stable tag goes to production, a dispatch to the track it names. Committing while other changes are
      # in review would cancel that review, so a tag is then skipped with a warning and a dispatch fails.
      - name: Send to the Play Store for review
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
        run: >-
          python3 -I .github/scripts/play-publish.py
          client/android/app/build/outputs/bundle/release/app-proprietary-release.aab
          ${{ github.event.inputs.track || 'production' }}

  # Replaces the APK of the Amazon Appstore listing (Fire TV + Fire tablets) with the one
  # just attached to the release, then commits the edit, which sends it to Amazon review.
  amazon-appstore:
    needs: build-and-publish
    # `always()`: build-and-publish is skipped (not failed) on an amazon-only
    # dispatch, and a skipped dependency would otherwise skip this job too.
    if: always() && !(startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, '-')) && (needs.build-and-publish.result == 'success' || github.event.inputs.amazon_tag != '') && (startsWith(github.ref, 'refs/tags/v') || github.event.inputs.amazon_tag != '')
    runs-on: ubuntu-latest
    # Two tags racing for the same open Amazon edit (reused by amazon-publish.sh)
    # would clobber each other's changes; serialize per app, not per tag.
    concurrency:
      group: amazon-appstore
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      AMAZON_TAG: ${{ github.event.inputs.amazon_tag || github.ref_name }}
      AMAZON_DISPATCH: ${{ github.event.inputs.amazon_tag != '' }}
      APP: https://developer.amazon.com/api/appstore/v1/applications/${{ secrets.AMAZON_APPSTORE_APP_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts
      - name: Download the signed APK from the release
        run: gh release download "$AMAZON_TAG" -R "$GITHUB_REPOSITORY" -p 'Fliks-*.apk' -O fliks.apk

      - name: Replace the APK and commit the edit
        env:
          CLIENT_ID: ${{ secrets.AMAZON_APPSTORE_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.AMAZON_APPSTORE_CLIENT_SECRET }}
        run: .github/scripts/amazon-publish.sh fliks.apk
