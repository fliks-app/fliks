name: Set up Rust
description: Installs the toolchain pinned by rust-toolchain.toml.
runs:
  using: composite
  steps:
    - shell: bash
      run: rustup toolchain install
    # libarchive2-sys (Linux only) builds libarchive with cmake and links these libraries.
    - if: runner.os == 'Linux'
      shell: bash
      run: sudo apt-get update -qq && sudo apt-get install -y -qq cmake libclang-dev liblz4-dev libacl1-dev libxml2-dev libbz2-dev liblzma-dev libzstd-dev
