version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"

  # Minor and patch bumps land as one PR per directory; majors stay separate.
  - package-ecosystem: npm
    directories: [/desktop, /tools]
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: "chore"
      include: scope

  - package-ecosystem: npm
    directory: /client
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: "chore"
      include: scope
    ignore:
      # Angular's compiler and typescript-eslint need the TS 6 JS API, which TS 7 does not ship.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: cargo
    directories: [/server, /server/crates/plugin-sdk]
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: "chore"
      include: scope

  # ENGINE_IMAGE is owned by scripts/bump-engine.sh, which pins the engine release, digest and checksums together.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: ghcr.io/fliks-app/engine
    commit-message:
      prefix: "chore"
      include: scope

  - package-ecosystem: gradle
    directory: /client/android
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: "chore"
      include: scope
