<!doctype html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="utf-8">
  <title>Fliks</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#1d232a">
  <!-- Pre-paint theme + background. Without this the WebView shows a default
       white frame between Capacitor splash and Angular's CSS bundle parsing,
       and would flash again if the user is on the light theme but we hardcoded
       a dark bg. We mirror ThemeService.getInitialTheme() inline (persisted
       'fliks-theme' → matchMedia fallback) so data-theme and the bg are set
       on the very first paint. daisyUI overrides them once styles.css parses. -->
  <style>html, body { margin: 0; }</style>
  <script>
    (function () {
      try {
        var stored = localStorage.getItem('fliks-theme');
        var theme = (stored === 'dark' || stored === 'light')
          ? stored
          : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
        document.documentElement.style.background = theme === 'dark' ? '#1d232a' : '#ffffff';
      } catch (_) { /* localStorage may be unavailable — fall back to the static data-theme */ }
    })();
  </script>
  <script src="https://www.gstatic.com/cv/js/sender/v1/cast_sender.js?loadCastFramework=1" async></script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
