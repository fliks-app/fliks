<div class="flex flex-col gap-4">
  <div>
    <h1 class="sr-only lg:not-sr-only text-2xl font-bold">{{ pageHeadingKey() | translate }}</h1>
    <p class="text-sm text-base-content/60 mt-1">{{ 'activity.subtitle' | translate }}</p>
  </div>

  <!-- Tabs -->
  <div role="tablist" class="tabs tabs-bordered">
    <a
      role="tab"
      class="tab"
      routerLink="/activity"
      routerLinkActive="tab-active"
      [routerLinkActiveOptions]="{ exact: true }"
    >
      {{ 'activity.tab_queue' | translate }}
    </a>
    <a
      role="tab"
      class="tab"
      routerLink="/activity/subtitles"
      routerLinkActive="tab-active"
    >
      {{ 'activity.tab_subtitles' | translate }}
    </a>
  </div>

  <!-- Tab content -->
  <router-outlet />
</div>
