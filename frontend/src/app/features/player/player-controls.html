<!-- Top bar: back + title -->
<div
  class="absolute top-0 left-0 right-0 z-40 flex items-center gap-3 px-4 py-3 bg-gradient-to-b from-black/70 to-transparent transition-opacity duration-300"
  [class.opacity-0]="!visible()"
  [class.pointer-events-none]="!visible()"
>
  <button type="button" class="btn btn-ghost btn-sm btn-circle text-white" (click)="back.emit()">
    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" /></svg>
  </button>
  <div class="flex flex-col min-w-0">
    <span class="text-white text-sm font-medium truncate">{{ mediaTitle() }}</span>
    @if (episodeTitle()) {
      <span class="text-white/60 text-xs truncate">{{ episodeTitle() }}</span>
    }
  </div>
</div>

<!-- Center play/pause overlay on tap -->
<div
  class="absolute inset-0 z-30 flex items-center justify-center cursor-pointer"
  (click)="togglePlay.emit()"
  (dblclick)="toggleFullscreen.emit()"
>
  @if (paused()) {
    <div class="transition-opacity duration-200" [class.opacity-0]="!visible()">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-16 w-16 text-white drop-shadow-lg" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
    </div>
  }
</div>

<!-- Bottom controls bar -->
<div
  class="absolute bottom-0 left-0 right-0 z-40 bg-gradient-to-t from-black/80 to-transparent px-4 pb-4 pt-10 transition-opacity duration-300"
  [class.opacity-0]="!visible()"
  [class.pointer-events-none]="!visible()"
>
  <!-- Timeline -->
  <div class="flex items-center gap-2 mb-2">
    <span class="text-white text-xs tabular-nums w-12 text-right">{{ formatTime(currentTime()) }}</span>
    <input
      type="range"
      class="range range-xs range-primary flex-1"
      [min]="0"
      [max]="duration() || 1"
      [value]="currentTime()"
      (input)="onSeek($event)"
    />
    <span class="text-white text-xs tabular-nums w-12">{{ formatTime(duration()) }}</span>
  </div>

  <!-- Buttons row -->
  <div class="flex items-center justify-between">
    <div class="flex items-center gap-1">
      <!-- Previous episode -->
      @if (hasPrevEpisode()) {
        <button type="button" class="btn btn-ghost btn-sm btn-circle text-white" (click)="prevEpisode.emit()">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="currentColor" viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
        </button>
      }

      <!-- Rewind 10s -->
      <button type="button" class="btn btn-ghost btn-sm btn-circle text-white" (click)="seek.emit(currentTime() - 10)">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12.066 11.2a1 1 0 000 1.6l5.334 4A1 1 0 0019 16V8a1 1 0 00-1.6-.8l-5.333 4zM4.066 11.2a1 1 0 000 1.6l5.334 4A1 1 0 0011 16V8a1 1 0 00-1.6-.8l-5.334 4z"/></svg>
      </button>

      <!-- Play/Pause -->
      <button type="button" class="btn btn-ghost btn-sm btn-circle text-white" (click)="togglePlay.emit()">
        @if (paused()) {
          <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        } @else {
          <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="currentColor" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
        }
      </button>

      <!-- Forward 10s -->
      <button type="button" class="btn btn-ghost btn-sm btn-circle text-white" (click)="seek.emit(currentTime() + 10)">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 rotate-180" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12.066 11.2a1 1 0 000 1.6l5.334 4A1 1 0 0019 16V8a1 1 0 00-1.6-.8l-5.333 4zM4.066 11.2a1 1 0 000 1.6l5.334 4A1 1 0 0011 16V8a1 1 0 00-1.6-.8l-5.334 4z"/></svg>
      </button>

      <!-- Next episode -->
      @if (hasNextEpisode()) {
        <button type="button" class="btn btn-ghost btn-sm btn-circle text-white" (click)="nextEpisode.emit()">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="currentColor" viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
        </button>
      }

      <!-- Volume -->
      <div class="flex items-center gap-1 ml-2">
        <button type="button" class="btn btn-ghost btn-sm btn-circle text-white" (click)="toggleMute.emit()">
          @if (volume() === 0) {
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="currentColor" viewBox="0 0 24 24"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51A8.796 8.796 0 0021 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06a8.99 8.99 0 003.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>
          } @else {
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="currentColor" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
          }
        </button>
        <input
          type="range"
          class="range range-xs w-20"
          [min]="0"
          [max]="1"
          [step]="0.05"
          [value]="volume()"
          (input)="onVolumeChange($event)"
        />
      </div>
    </div>

    <div class="flex items-center gap-1">
      <!-- Speed -->
      <div class="dropdown dropdown-top dropdown-end">
        <button tabindex="0" type="button" class="btn btn-ghost btn-sm text-white text-xs">
          {{ playbackRate() }}x
        </button>
        <ul tabindex="0" class="dropdown-content menu bg-base-300 rounded-box p-1 shadow-lg mb-2 w-20">
          @for (r of speedOptions; track r) {
            <li><a class="text-xs" [class.font-bold]="playbackRate() === r" (click)="speedChange.emit(r)">{{ r }}x</a></li>
          }
        </ul>
      </div>

      <!-- Subtitles -->
      <button type="button" class="btn btn-ghost btn-sm btn-circle text-white" (click)="toggleSubtitlePicker.emit()">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 8h10M7 12h4m1 8l-4-4H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-3l-4 4z" /></svg>
      </button>

      <!-- Stats -->
      <button type="button" class="btn btn-ghost btn-sm btn-circle text-white" (click)="toggleStats.emit()">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" /></svg>
      </button>

      <!-- PiP -->
      <button type="button" class="btn btn-ghost btn-sm btn-circle text-white" (click)="togglePip.emit()">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4" /></svg>
      </button>

      <!-- Fullscreen -->
      <button type="button" class="btn btn-ghost btn-sm btn-circle text-white" (click)="toggleFullscreen.emit()">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4" /></svg>
      </button>
    </div>
  </div>
</div>
