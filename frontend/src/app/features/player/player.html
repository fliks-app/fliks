<div
  class="relative w-screen h-screen bg-black overflow-hidden"
  (mousemove)="showControls()"
  (touchstart)="showControls()"
>
  <video
    #videoElement
    class="w-full h-full object-contain pb-12"
    playsinline
  ></video>

  @if (error()) {
    <div class="absolute inset-0 flex items-center justify-center z-50">
      <div class="text-center text-white">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12 mx-auto mb-4 text-error" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
        <p class="text-lg font-medium">{{ 'player.error' | translate }}</p>
        <p class="text-sm text-white/60 mt-1">{{ error() }}</p>
        <button class="btn btn-ghost btn-sm mt-4" (click)="onBack()">{{ 'player.back' | translate }}</button>
      </div>
    </div>
  }

  @if (loading() || buffering()) {
    <div class="absolute inset-0 flex items-center justify-center z-50 pointer-events-none">
      <span class="loading loading-spinner loading-lg text-white"></span>
    </div>
  }

  <app-player-controls
    [visible]="controlsVisible()"
    [paused]="paused()"
    [currentTime]="currentTime()"
    [duration]="duration()"
    [volume]="volume()"
    [playbackRate]="playbackRate()"
    [mediaTitle]="mediaTitle()"
    [episodeTitle]="episodeTitle()"
    [hasNextEpisode]="false"
    [hasPrevEpisode]="false"
    (togglePlay)="onTogglePlay()"
    (seek)="onSeek($event)"
    (volumeChange)="onVolumeChange($event)"
    (toggleMute)="onToggleMute()"
    (toggleFullscreen)="onToggleFullscreen()"
    (togglePip)="onTogglePip()"
    (toggleSubtitlePicker)="subtitlePickerOpen.set(!subtitlePickerOpen())"
    (toggleStats)="statsVisible.set(!statsVisible())"
    (speedChange)="onSpeedChange($event)"
    (back)="onBack()"
  />

  <app-player-stats-overlay
    [visible]="statsVisible()"
    [stats]="playerStats()"
  />

  <!-- Subtitle picker dropdown -->
  @if (subtitlePickerOpen()) {
    <div class="absolute bottom-24 right-4 z-50 bg-base-300 rounded-lg shadow-xl p-2 min-w-48 max-h-80 overflow-y-auto">
      <div class="text-xs font-bold text-base-content/50 px-2 py-1">{{ 'player.subtitles' | translate }}</div>
      <button
        class="w-full text-left px-2 py-1.5 rounded text-sm hover:bg-base-200"
        [class.font-bold]="!activeSubtitleId()"
        (click)="selectSubtitle(null)"
      >{{ 'player.off' | translate }}</button>
      @for (sub of availableSubtitles(); track sub.id) {
        <button
          class="w-full text-left px-2 py-1.5 rounded text-sm hover:bg-base-200"
          [class.font-bold]="activeSubtitleId() === sub.id"
          (click)="selectSubtitle(sub)"
        >{{ sub.label }}</button>
      }
    </div>
  }
</div>
