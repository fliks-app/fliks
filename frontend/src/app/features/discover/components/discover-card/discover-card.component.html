<div
  class="card bg-base-100 shadow-md border border-base-200 cursor-pointer hover:shadow-xl transition-shadow relative overflow-hidden"
  (click)="clicked.emit(row())"
>
  <figure class="relative aspect-2/3 bg-base-300">
    @if (row().posterUrl) {
      <img [src]="row().posterUrl" [alt]="row().title" class="w-full h-full object-cover" />
    } @else {
      <div class="flex items-center justify-center w-full h-full text-base-content/30">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-14 w-14" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M7 4v16M17 4v16M3 8h4m10 0h4M3 12h18M3 16h4m10 0h4M4 20h16a1 1 0 001-1V5a1 1 0 00-1-1H4a1 1 0 00-1 1v14a1 1 0 001 1z" />
        </svg>
      </div>
    }
    @if (row().rating) {
      <div class="absolute bottom-2 left-2">
        <span class="badge badge-sm badge-warning">{{ row().rating | number:'1.1-1' }}</span>
      </div>
    }
    @switch (status()) {
      @case ('library') {
        <div class="absolute top-2 right-2">
          <div class="w-7 h-7 rounded-full bg-success flex items-center justify-center shadow">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-success-content" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3">
              <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
            </svg>
          </div>
        </div>
      }
      @case ('pending') {
        <div class="absolute top-2 right-2">
          <div class="w-7 h-7 rounded-full bg-info flex items-center justify-center shadow">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-info-content" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10" />
              <path stroke-linecap="round" d="M12 6v6l4 2" />
            </svg>
          </div>
        </div>
      }
      @case ('declined') {
        <div class="absolute top-2 right-2">
          <div class="w-7 h-7 rounded-full bg-error flex items-center justify-center shadow">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-error-content" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3">
              <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
            </svg>
          </div>
        </div>
      }
    }
  </figure>
  <div class="card-body p-3 gap-1">
    <h3 class="card-title text-sm line-clamp-2 min-h-10">{{ row().title }}</h3>
    <p class="text-sm text-base-content/60">
      @if (row().year) {
        {{ row().year }}
      }
    </p>
  </div>
</div>
