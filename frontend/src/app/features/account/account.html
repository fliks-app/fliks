<div class="flex flex-col gap-6">
  <div>
    <h1 class="sr-only lg:not-sr-only text-2xl font-bold">{{ 'account.title' | translate }}</h1>
    <p class="text-sm text-base-content/60 mt-1">{{ 'account.subtitle' | translate }}</p>
  </div>

  <div class="card bg-base-100 border border-base-200">
    <div class="card-body gap-4">
      <h2 class="card-title text-base">{{ 'account.change_password' | translate }}</h2>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <label class="form-control w-full">
          <span class="label-text">{{ 'account.new_password' | translate }}</span>
          <input
            type="password"
            class="input input-bordered input-sm w-full"
            [ngModel]="formPassword()"
            (ngModelChange)="formPassword.set($event)"
            placeholder="••••••••"
          />
          <div class="label">
            <span class="label-text-alt text-base-content/50">{{ 'account.password_hint' | translate }}</span>
          </div>
        </label>

        <label class="form-control w-full">
          <span class="label-text">{{ 'account.confirm_password' | translate }}</span>
          <input
            type="password"
            class="input input-bordered input-sm w-full"
            [ngModel]="formPasswordConfirm()"
            (ngModelChange)="formPasswordConfirm.set($event)"
            placeholder="••••••••"
          />
        </label>
      </div>

      @if (mismatch()) {
        <p class="text-error text-sm">{{ 'account.password_mismatch' | translate }}</p>
      }

      <div class="card-actions justify-end">
        <button
          type="button"
          class="btn btn-primary btn-sm"
          (click)="save()"
          [disabled]="saving() || !formPassword() || mismatch()"
        >
          @if (saving()) {
            <span class="loading loading-spinner loading-xs"></span>
          }
          {{ 'common.save' | translate }}
        </button>
      </div>
    </div>
  </div>
</div>
