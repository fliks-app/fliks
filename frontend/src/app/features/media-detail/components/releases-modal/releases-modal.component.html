<dialog #dialog class="modal">
  <div class="modal-box w-[95%] max-w-7xl my-8 max-h-[calc(100vh-4rem)] flex flex-col overflow-hidden p-0">
    <div class="px-6 pt-6 pb-3 shrink-0">
      <div class="flex items-center justify-between mb-3">
        <h3 class="text-lg font-bold">{{ title() }}</h3>
        <form method="dialog">
          <button class="btn btn-sm btn-circle btn-ghost">✕</button>
        </form>
      </div>

      @if (showSearch()) {
        <input
          type="text"
          class="input input-bordered input-sm w-full"
          [placeholder]="'media_detail.custom_search_placeholder' | translate"
          [ngModel]="customSearchQuery()"
          (ngModelChange)="customSearchQueryChange.emit($event)"
        />
      }

      @if (showGrabBest() && canGrab()) {
        <div class="flex flex-wrap items-center gap-2" [class.mt-2]="showSearch()">
          <button
            type="button"
            class="btn btn-primary btn-xs"
            (click)="grabBest.emit()"
            [disabled]="grabBestDisabled() || grabBusy() !== null"
          >
            @if (grabBestBusy()) {
              <span class="loading loading-spinner loading-xs"></span>
            }
            {{ 'media_detail.grab_best' | translate }}
          </button>
        </div>
      }
    </div>

    <div class="flex-1 overflow-y-auto px-6">
      @if (loading()) {
        <div class="flex justify-center py-8">
          <span class="loading loading-spinner loading-lg"></span>
        </div>
      } @else if (error()) {
        <div role="alert" class="alert alert-error text-sm">{{ error() }}</div>
      } @else if (searched() && releases().length === 0) {
        <p class="text-sm text-base-content/60 py-4">{{ emptyMessage() | translate }}</p>
      } @else if (releases().length) {
        <app-releases-table
          [releases]="releases()"
          [grabBusy]="grabBusy()"
          [grabState]="grabState()"
          [canGrab]="canGrab()"
          [showCfScore]="showCfScore()"
          [grabPrefix]="grabPrefix()"
          (grab)="grab.emit($event)"
        />
      }
    </div>

    <div class="modal-action px-6 pb-4 pt-2 shrink-0">
      <form method="dialog">
        <button class="btn btn-sm">{{ 'common.close' | translate }}</button>
      </form>
    </div>
  </div>
  <form method="dialog" class="modal-backdrop"><button>close</button></form>
</dialog>
