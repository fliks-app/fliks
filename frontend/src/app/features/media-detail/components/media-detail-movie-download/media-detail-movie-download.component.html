@let m = media();
@if (showUpgradeSection()) {
  <div class="divider my-6"></div>
  <section class="space-y-3">
    <h2 class="text-xl font-semibold">{{ 'media_detail.upgrade_section' | translate }}</h2>
    <p class="text-sm text-base-content/60">
      {{ 'media_detail.upgrade_current_quality' | translate }}:
      @for (f of m.files!; track f.id) {
        <span class="badge badge-sm badge-ghost ml-1">{{ f.quality }}</span>
      }
    </p>
    @if (canGrab()) {
      <div class="flex flex-wrap gap-2 items-center">
        <button
          type="button"
          class="btn btn-outline btn-sm"
          (click)="loadUpgradeReleases.emit()"
          [disabled]="upgradeReleasesLoading()"
        >
          @if (upgradeReleasesLoading()) {
            <span class="loading loading-spinner loading-xs"></span>
          }
          {{ 'media_detail.search_upgrade_releases' | translate }}
        </button>
        <button
          type="button"
          class="btn btn-secondary btn-sm"
          (click)="grabUpgradeBest.emit()"
          [disabled]="upgradeGrabBusy() !== null"
        >
          @if (upgradeGrabBusy() === 'best') {
            <span class="loading loading-spinner loading-xs"></span>
          }
          {{ 'media_detail.grab_upgrade_best' | translate }}
        </button>
      </div>
    }
  </section>
}
