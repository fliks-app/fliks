<dialog class="modal" [class.modal-open]="isOpen()" role="dialog" aria-modal="true">
  <div class="modal-box">
    <h3 class="text-lg font-bold">{{ title() }}</h3>
    <p class="py-4">{{ message() }}</p>
    <div class="modal-action">
      <button class="btn" (click)="confirmService.cancel()">
        {{ cancelLabel() }}
      </button>
      <button class="btn" [class]="confirmBtnClass()" (click)="confirmService.accept()">
        {{ confirmLabel() }}
      </button>
    </div>
  </div>
  <form method="dialog" class="modal-backdrop">
    <button type="button" (click)="confirmService.cancel()" [attr.aria-label]="'common.close' | translate">
      {{ 'common.close' | translate }}
    </button>
  </form>
</dialog>
