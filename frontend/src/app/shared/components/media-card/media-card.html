<div
  class="relative"
  [class.opacity-55]="dimmed()"
  [class]="aspect() === 'landscape' ? 'shrink-0 w-56 sm:w-64' : ''"
>
  <!-- Image -->
  <figure
    class="group relative bg-base-300 rounded-lg overflow-hidden shadow-md hover:shadow-xl transition-shadow cursor-pointer"
    [class.aspect-2/3]="aspect() === 'portrait'"
    [class.aspect-video]="aspect() === 'landscape'"
    tabindex="0"
    role="button"
    [attr.aria-label]="_title()"
    [appCardActions]="cardActions()"
    [actionsTitle]="_title()"
    (click)="onCardClick()"
    (keydown.enter)="onCardClick()"
    (keydown.space)="onCardClick(); $event.preventDefault()"
  >
    @if (_img()) {
      <img
        [src]="_img()! | resolveUrl"
        [alt]="_title()"
        class="w-full h-full object-cover"
        [class.opacity-35]="imageBlurred()"
        [class.scale-105]="imageBlurred()"
        loading="lazy"
      />
    } @else {
      <div class="flex items-center justify-center w-full h-full text-base-content/20">
        <svg lucideFilm class="h-12 w-12" [strokeWidth]="1.5"></svg>
      </div>
    }

    <!-- Rating badge (bottom-left, portrait only) -->
    @if (_rating() > 0 && aspect() === 'portrait') {
      <div class="absolute bottom-1.5 left-1.5 z-20 flex items-center gap-0.5 bg-black/60 rounded-md px-1.5 py-0.5">
        <svg lucideStar class="h-3 w-3 text-yellow-400 fill-yellow-400"></svg>
        <span class="text-[11px] text-white font-semibold tabular-nums">{{ _rating() | number:'1.1-1' }}</span>
      </div>
    }

    <!-- Top-left: status badge or episode number -->
    @if (statusBadge()) {
      <div class="absolute top-1.5 left-1.5 z-20">
        <span class="badge badge-sm" [ngClass]="statusBadge()!.class">{{ statusBadge()!.text }}</span>
      </div>
    } @else if (topLeftBadge()) {
      <div class="absolute top-1.5 left-1.5 z-20">
        <span class="badge badge-sm badge-neutral font-mono">{{ topLeftBadge() }}</span>
      </div>
    }

    <!-- Top-right: discover badge OR status icon -->
    @if (badge()) {
      <div class="absolute top-1.5 right-1.5 z-20">
        @switch (badge()) {
          @case ('library') {
            <div class="w-6 h-6 rounded-full bg-success flex items-center justify-center shadow">
              <svg lucideCheck class="h-3.5 w-3.5 text-success-content"></svg>
            </div>
          }
          @case ('pending') {
            <div class="w-6 h-6 rounded-full bg-info flex items-center justify-center shadow">
              <svg lucideClock class="h-3.5 w-3.5 text-info-content"></svg>
            </div>
          }
          @case ('declined') {
            <div class="w-6 h-6 rounded-full bg-error flex items-center justify-center shadow">
              <svg lucideX class="h-3.5 w-3.5 text-error-content"></svg>
            </div>
          }
        }
      </div>
    } @else if (status() === 'missing') {
      <div class="absolute top-1.5 right-1.5 z-20">
        <svg lucideCircleX class="h-5 w-5 text-error/60 drop-shadow"></svg>
      </div>
    } @else if (interactiveWatched()) {
      <button
        type="button"
        class="absolute top-1.5 right-1.5 z-20 w-6 h-6 rounded-full flex items-center justify-center shadow transition-colors cursor-pointer"
        [class.bg-success]="status() === 'watched'"
        [class.hover:bg-success/90]="status() === 'watched'"
        [class.bg-black/50]="status() !== 'watched'"
        [class.hover:bg-black/70]="status() !== 'watched'"
        (click)="onWatchedClick($event)"
        [attr.aria-label]="(status() === 'watched' ? 'media_card.mark_unwatched' : 'media_card.mark_watched') | translate"
      >
        <svg
          lucideCheck
          class="h-3.5 w-3.5"
          [class.text-success-content]="status() === 'watched'"
          [class.text-white/80]="status() !== 'watched'"
        ></svg>
      </button>
    } @else if (status() === 'watched') {
      <div class="absolute top-1.5 right-1.5 z-20">
        <div class="w-6 h-6 rounded-full bg-success flex items-center justify-center shadow">
          <svg lucideCheck class="h-3.5 w-3.5 text-success-content"></svg>
        </div>
      </div>
    }

    <!-- Hover overlay (desktop only) -->
    @if (!isNative) {
      <div class="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center pointer-events-none group-hover:pointer-events-auto">
        @if (_link()) {
          <a [routerLink]="_link()" class="absolute inset-0 z-0" [attr.aria-label]="_title()" (click)="$event.stopPropagation()"></a>
        }
        @if (_playable() || aspect() === 'landscape') {
          <button type="button" class="relative z-10 w-12 h-12 rounded-full bg-black/50 flex items-center justify-center text-white cursor-pointer" (click)="onPlayClick($event)">
            <svg lucidePlay class="h-6 w-6" [strokeWidth]="2"></svg>
          </button>
        }
      </div>
    }

    <!-- Progress bar -->
    @if (progressPercent() > 0) {
      <div class="absolute bottom-0 left-0 right-0 h-1 bg-black/40">
        <div class="h-full bg-primary" [style.width.%]="progressPercent()"></div>
      </div>
    }
  </figure>

  <!-- Title below -->
  <div class="pt-1.5">
    @if (_link()) {
      <a [routerLink]="_link()" class="hover:underline" [attr.tabindex]="innerTabindex()">
        <h3 class="text-sm font-medium line-clamp-1 leading-snug">{{ _title() }}</h3>
      </a>
    } @else {
      <h3 class="text-sm font-medium line-clamp-1 leading-snug">{{ _title() }}</h3>
    }
    @if (_subtitle()) {
      @if (subtitleLink()) {
        <a [routerLink]="subtitleLink()" class="hover:underline" [attr.tabindex]="innerTabindex()">
          <p class="text-xs text-base-content/50 line-clamp-1">{{ _subtitle() }}</p>
        </a>
      } @else {
        <p class="text-xs text-base-content/50 line-clamp-1">{{ _subtitle() }}</p>
      }
    }
  </div>

  <!-- Dismiss button -->
  @if (dismissable()) {
    <button
      type="button"
      class="absolute top-2 right-2 z-10 btn btn-circle btn-sm border-0 bg-black/50 text-white opacity-0 group-hover:opacity-100 transition-opacity hover:bg-black/65"
      (click)="dismissed.emit(); $event.stopPropagation()"
      aria-label="Remove"
    >
      <svg lucideX class="h-4 w-4" [strokeWidth]="2"></svg>
    </button>
  }
</div>
