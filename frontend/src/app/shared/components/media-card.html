<div
  class="card bg-base-100 shadow-md hover:shadow-xl transition-shadow relative overflow-hidden group"
  [ngClass]="isPoster() ? 'shrink-0 w-28 sm:w-36' : ''"
>
  <figure
    class="relative aspect-[2/3] bg-base-300"
    [class.rounded-lg]="isPoster()"
    [class.overflow-hidden]="isPoster()"
  >
    @if (media().posterUrl) {
      <img
        [src]="media().posterUrl | resolveUrl"
        [alt]="media().title"
        class="w-full h-full object-cover"
        loading="lazy"
      />
    } @else {
      <div class="flex items-center justify-center w-full h-full text-base-content/30">
        <svg lucideFilm class="h-16 w-16" [strokeWidth]="1.5"></svg>
      </div>
    }
    <!-- Mobile: tap poster → detail -->
    <a
      [routerLink]="detailLink()"
      class="absolute inset-0 z-[1] md:hidden"
      [attr.aria-label]="media().title"
    ></a>
    <!-- Desktop: semi-transparent overlay on hover -->
    <div
      class="hidden md:flex absolute inset-0 z-[2] flex-col opacity-0 pointer-events-none group-hover:opacity-100 group-hover:pointer-events-auto transition-opacity duration-200 bg-black/40"
    >
      <a
        [routerLink]="detailLink()"
        class="absolute inset-0 z-0"
        [attr.aria-label]="'media_card.open_detail' | translate"
      ></a>
      @if (canPlay()) {
        <button
          type="button"
          class="btn btn-circle btn-lg border-0 z-10 absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 bg-black/50 text-white hover:bg-black/65"
          (click)="play($event)"
          [attr.title]="'media_card.play' | translate"
        >
          <svg lucidePlay class="h-8 w-8" [strokeWidth]="2"></svg>
        </button>
      }
      <div class="absolute top-2 right-2 z-10 flex items-center gap-1">
        @if (media().type === 'movie') {
          <button
            type="button"
            [ngClass]="
              watched()
                ? 'btn btn-primary btn-circle btn-sm border-0 shadow-md'
                : 'btn btn-circle btn-sm bg-black/50 border-0 text-white hover:bg-black/65'
            "
            (click)="toggleWatchedMovie($event)"
            [attr.title]="
              watched()
                ? ('media_card.mark_unwatched' | translate)
                : ('media_card.mark_watched' | translate)
            "
          >
            @if (watched()) {
              <svg lucideEye class="h-4 w-4" [strokeWidth]="2"></svg>
            } @else {
              <svg lucideEyeOff class="h-4 w-4" [strokeWidth]="2"></svg>
            }
          </button>
        } @else {
          <span
            [ngClass]="
              watched()
                ? 'btn btn-primary btn-circle btn-sm border-0 pointer-events-none shadow-md'
                : 'btn btn-circle btn-sm bg-black/50 border-0 text-white pointer-events-none'
            "
            [attr.title]="
              watched()
                ? ('media_card.fully_watched' | translate)
                : ('media_card.not_fully_watched' | translate)
            "
          >
            @if (watched()) {
              <svg lucideEye class="h-4 w-4" [strokeWidth]="2"></svg>
            } @else {
              <svg lucideEyeOff class="h-4 w-4" [strokeWidth]="2"></svg>
            }
          </span>
        }
      </div>
    </div>
  </figure>

  <a
    [routerLink]="detailLink()"
    class="block px-3 py-2 text-center h-14 relative z-[3] md:z-auto"
  >
    <h3 class="text-sm font-medium line-clamp-1">{{ media().title }}</h3>
    @if (subtitle()) {
      <p class="text-xs text-base-content/50 line-clamp-1">{{ subtitle() }}</p>
    } @else if (isPoster()) {
      <p class="text-xs text-base-content/50 line-clamp-1">{{ media().year }}</p>
    } @else {
      <p class="text-xs text-base-content/60 line-clamp-1">
        {{ statusLabel() | translate }}
        @if (qualityLabel()) {
          — {{ qualityLabel() }}
        }
      </p>
    }
  </a>

  <div class="absolute bottom-0 left-0 right-0 h-1 bg-base-100 pointer-events-none">
    <div
      class="h-full transition-all"
      [ngClass]="barColorClass()"
      [style.width.%]="barPercent()"
    ></div>
  </div>
</div>
